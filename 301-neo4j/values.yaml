# ===============================================
# [301-neo4j 전용 설정]
# → 공통값(global.*)은 values.common.yaml에서 관리
# ===============================================

# 포트 (내부 전용)
# → bolt 는 global.neo4jBoltUri 의 포트와 글자 그대로 같아야 한다 (같은 커밋 규칙)
ports:
  bolt: 7687   # 드라이버 접속 (cdm-consumer-graph)
  http: 7474   # Neo4j Browser → 사람은 port-forward 로만

# JVM 힙(초기 = 최대 고정) · 페이지캐시
# → 안 주면 노드 RAM 기준으로 자동 산정해 과점한다 (limits 를 두지 않는 저장소 규약)
# → deployment.yaml 의 memory request 는 힙 + 페이지캐시 + JVM 여유 → 올리면 같이 올린다
memory:
  heap: "1g"
  pagecache: "512m"


# ===============================================
# [Storage]
# → Neo4j 는 단일 인스턴스로 구성하고
#   데이터 복제는 Longhorn이 담당
# → Longhorn Replica를 통해 노드 장애 시 데이터 보호
# ===============================================
storage:
  storageClass: "longhorn"
  size: "20Gi"  # PVC 용량 상한


# Pod 퇴거 대기 시간(초)
# → Node 장애 감지 후 60초 뒤 다른 노드에서 재기동
# → 강제 삭제 정책은 Longhorn에서 관리
tolerationSeconds: 60
