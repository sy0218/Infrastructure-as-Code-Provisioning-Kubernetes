# ===================================================
# [301-neo4j]
#
# Neo4j 단일 인스턴스(Community) → 클러스터 내부 전용 그래프 DB (cdm-consumer-graph 적재 대상)
#
# 설계
#   - 301-minio 와 같은 계열: Deployment(Recreate) 1개 + RWO PVC(Longhorn) + ClusterIP
#   - Community Edition 은 인스턴스 1개·DB 1개(neo4j) → 클러스터링이 없다
#     → 장애는 Longhorn 스토리지 복제로 막는다: 노드가 죽으면 다른 노드에서 재기동되고 같은 볼륨을 붙는다
#   - 외부 노출 없음 → Bolt 는 Service DNS(global.neo4jBoltUri), Browser 는 port-forward
#
# 의존성
#   - 100-base(Longhorn), 300-data-layer-base(공용 Secret PLATFORM_NEO4J_*) 선행 배포
#   - Harbor 에 data-layer/neo4j 이미지(data_pipeline/data_layer_graph)
# ===================================================
apiVersion: v2
name: neo4j
description: "Neo4j 단일 인스턴스 → 내부 그래프 DB (Deployment + Longhorn PVC + ClusterIP)"
type: application

# Chart 버전 (업그레이드 시 명시적으로 변경)
version: 0.1.0
