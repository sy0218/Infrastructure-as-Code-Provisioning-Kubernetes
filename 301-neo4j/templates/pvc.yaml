# ===============================================
# [Neo4j 데이터 PVC]
#   - 그래프 데이터(/data)를 저장하는 RWO PVC
#   - Longhorn이 볼륨을 복제하여 노드 장애 시 데이터 보호
#   - Pod가 다른 노드로 이동해도 동일 PVC를 연결
#
# [주의]
# - helm uninstall 시 PVC도 삭제된다 → Longhorn reclaimPolicy 가 Delete 라 그래프 데이터도 삭제
# ===============================================
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: neo4j-data
  namespace: {{ .Values.global.namespace }}
  labels:
    app: neo4j
    app.kubernetes.io/name: neo4j
    app.kubernetes.io/part-of: data-layer

spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: {{ .Values.storage.storageClass }}
  resources:
    requests:
      storage: {{ .Values.storage.size }}
