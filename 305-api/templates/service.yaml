# ===============================================
# [data-layer-api Service]
#
# - ClusterIP → 외부 노출은 Ingress 가 맡는다
# - 이름이 외부 호스트명(global.hosts.api)과 같다 (의도)
#   → 파드 안: CoreDNS → ClusterIP / PC: hosts → VIP → Ingress
# ===============================================
apiVersion: v1
kind: Service

metadata:
  name: data-layer-api
  namespace: {{ .Values.global.namespace }}
  labels:
    app: data-layer-api
    app.kubernetes.io/name: data-layer-api
    app.kubernetes.io/part-of: data-layer

spec:
  type: ClusterIP

  selector:
    app: data-layer-api

  ports:
    - name: http
      port: {{ .Values.port }}
      targetPort: http
