# ===============================================
# [data-layer-api Service]
#   - ClusterIP로 내부 통신만 제공
#     → 외부 접근은 Ingress가 담당
# ===============================================
apiVersion: v1
kind: Service

metadata:
  name: data-layer-api
  namespace: {{ .Values.global.namespace }}

  labels:
    app: data-layer-api
    app.kubernetes.io/name: data-layer-api
    app.kubernetes.io/part-of: data-layer

spec:
  type: ClusterIP

  selector:
    app: data-layer-api

  ports:
    - name: http
      port: {{ .Values.port }}
      targetPort: http