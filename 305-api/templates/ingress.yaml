# ===============================================
# [data-layer-api Ingress]
#
# - "/"와 "/api"를 동일한 Service로 전달
# - "/" 관리 화면은 인증 없이 접근하므로 사설망 전제
# - REST API 인증은 애플리케이션의 X-API-Key로 처리
# ===============================================

apiVersion: networking.k8s.io/v1
kind: Ingress

metadata:
  name: data-layer-api
  namespace: {{ .Values.global.namespace }}

  labels:
    app: data-layer-api
    app.kubernetes.io/name: data-layer-api
    app.kubernetes.io/part-of: data-layer

  annotations:
    # 업로드 크기 및 백엔드 응답 대기 시간 제한
    nginx.ingress.kubernetes.io/proxy-body-size: {{ .Values.ingress.proxyBodySize | quote }}
    nginx.ingress.kubernetes.io/proxy-read-timeout: {{ .Values.ingress.proxyReadTimeout | quote }}
    nginx.ingress.kubernetes.io/proxy-send-timeout: {{ .Values.ingress.proxyReadTimeout | quote }}

spec:
  ingressClassName: {{ .Values.global.ingressClassName }}

  rules:
    - host: {{ .Values.global.hosts.api }}
      http:
        paths:
          # "/" 이하의 모든 요청을 data-layer-api로 전달
          # → 관리 화면("/") + REST API("/api")
          - path: /
            pathType: Prefix
            backend:
              service:
                name: data-layer-api
                port:
                  number: {{ .Values.port }}