# ===================================================
# [305-api]
#
# data-layer-api → 관리 UI("/") + REST API("/api")
#
# 설계
#   - Deployment + ClusterIP + Ingress 구성
#   - 상태는 MinIO/PostgreSQL에 저장하므로 PVC 불필요
#   - Docker socket 대신 Kubernetes API로 리소스 제어
#   - Grafana 서버사이드 조회를 위해 VIP를 hostAliases에 등록
#
# 의존성
# - 300-data-layer-base: 공통 ConfigMap/Secret/권한
# - 102-ingress: 외부 접근용 VIP
# ===================================================
apiVersion: v2
name: api
description: "data-layer-api → 관리 화면 + REST (Deployment + ClusterIP + Ingress)"
type: application

# Chart 버전 (업그레이드 시 명시적으로 변경)
version: 0.1.0
