# ===============================================
# [305-api 전용 설정]
# → 공통값(global.*)은 values.common.yaml에서 관리
# ===============================================

# ⚠ 1 고정 — /quality/apply 가 매퍼 파드를 delete 하므로
#   둘이 동시에 처리하면 같은 매퍼를 두 번 죽인다
replicas: 1

# 컨테이너 포트 · ClusterIP 포트 · DATA_LAYER_API_PORT 가 이 한 값에서 나온다
port: 8090

ingress:
  # nginx 기본 1m → DQ 규칙·도메인 설정 업로드가 넘는다 (넘으면 413)
  proxyBodySize: "50m"

  # nginx 기본 60초 → DQ '적용'은 매퍼 드레인(180) + 재기동 대기(60) = 최대 240초를
  # HTTP 요청 안에서 기다린다 (넘으면 504). 드레인 값을 올리면 같이 올린다.
  proxyReadTimeout: "300"
