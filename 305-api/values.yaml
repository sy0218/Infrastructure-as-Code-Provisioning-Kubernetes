# ===============================================
# [305-api 전용 설정]
# → 공통값(global.*)은 values.common.yaml에서 관리
# ===============================================

# /quality/apply가 매퍼 Pod를 삭제하므로 동시 실행 방지
replicas: 1

# 컨테이너·Service·API 포트에 공통 사용
port: 8090

ingress:
  # DQ 규칙/도메인 설정 업로드 용량
  proxyBodySize: "50m"

  # DQ 적용 작업의 최대 처리 시간 확보
  # 매퍼 드레인(180s) + 재기동 대기(60s) 고려
  proxyReadTimeout: "300"