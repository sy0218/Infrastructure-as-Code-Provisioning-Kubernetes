# ===============================================
# [test-rdb-secrets]
#
# - 소스 RDB 4종의 계정 비밀번호. 공용 data-layer-secrets 에 넣지 않는다
#   → 저쪽은 파이프라인 전 워크로드가 envFrom 으로 통째로 받는다 (테스트 픽스처 계정을 섞지 않는다)
# - 키 이름 = 각 이미지가 읽는 env 이름 → 워크로드가 secretKeyRef 로 필요한 키만 집는다
# ===============================================
apiVersion: v1
kind: Secret

metadata:
  name: test-rdb-secrets
  namespace: {{ .Values.global.namespace }}
  labels:
    app.kubernetes.io/component: test-rdb
    app.kubernetes.io/part-of: data-layer

type: Opaque

stringData:
  # Oracle: SYS/SYSTEM · 업무 스키마(APP_USER) · LogMiner 계정
  ORACLE_PASSWORD: {{ .Values.secrets.cdcSourceDbPassword | quote }}
  APP_USER_PASSWORD: {{ .Values.secrets.cdcSourceDbPassword | quote }}
  DBZ_PASSWORD: {{ .Values.secrets.cdcSourceDbPassword | quote }}

  # SQL Server: 커넥터가 sa 로 붙는다 (랩 전제)
  MSSQL_SA_PASSWORD: {{ .Values.secrets.cdcSourceDbPassword | quote }}

  # PostgreSQL: POSTGRES_USER 가 슈퍼유저
  POSTGRES_PASSWORD: {{ .Values.secrets.cdcSourceDbPassword | quote }}

  # MySQL: root 는 initdb 의 GRANT, cdc 는 커넥터 접속
  MYSQL_ROOT_PASSWORD: {{ .Values.secrets.cdcSourceDbPassword | quote }}
  MYSQL_PASSWORD: {{ .Values.secrets.cdcSourceDbPassword | quote }}
