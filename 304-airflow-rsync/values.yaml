# ===============================================
# [values.yaml → 304-airflow-rsync 설정]
# - 공통 설정(global)은 values.common.yaml에서 관리
# - 노드 IP는 global.nodes에서 자동 조회
# ===============================================

# ===============================================
# [원본 노드]
# - Sync Pod가 실행될 원본 노드
# - hostPath 원본이므로 반드시 고정
# ===============================================
source:
  nodeName: "ap"

# 모든 노드에서 304-airflow가 동일하게 마운트하는 로컬 경로
# 304-airflow / Ansible 설정과 경로를 동일하게 유지
repoPath: "/project/data_pipeline/data_layer_airflow"

# ===============================================
# [대상 노드]
# - 원본을 제외한 동기화 대상 노드
# - IP는 global.nodes에서 자동 조회
# ===============================================
targets:
  nodeNames: ["s1", "s2"]

# ===============================================
# [SSH]
# - 원본 노드의 기존 root SSH 키를 사용
# - 대상 노드는 해당 공개키를 authorized_keys에 등록
# ===============================================
ssh:
  user: "root"
  keyHostPath: "/root/.ssh/id_ed25519"

# ===============================================
# [동기화]
# - 변경 감지 후 짧게 기다렸다가 rsync 수행
# - 주기적 전체 동기화로 이벤트 누락·노드 복귀 보완
# ===============================================
sync:
  # 연속된 파일 변경 이벤트를 하나의 rsync로 묶음
  debounceSeconds: 5

  # 이벤트가 없어도 주기적으로 전체 동기화
  intervalSeconds: 1800

  # 동기화에서 제외할 파일/디렉토리
  excludes:
    - ".git/"
    - "logs/"
    - "__pycache__/"
    - "*.pyc"
    - "*.env"
    - ".env*"