# ===============================================
# [307-pipeline 전용 설정]
# - 공통값: values.common.yaml
# - 실행 설정: 300 공용 ConfigMap
# ===============================================


# ===============================================
# [CDM Mapper] raw.* → cdm-topic
# ===============================================
mapper:
  # cdm-topic 파티션 수(3) 기준 병렬 처리
  replicas: 1

  # 종료 전 현재 배치를 flush + commit할 최대 시간
  # - helm upgrade / node drain 시 적용
  # - DQ 재기동은 305-api가 별도 timeout을 전달
  terminationGracePeriodSeconds: 300

  # 실행할 Mapper 모듈
  modules:
    - qm_chemical_batches
    - qm_chemical_event_logs
    - qm_chemical_replacement_history
    - qm_chemical_control_loop_defs
    - qm_chemical_qc_results
    - qm_chemical_lab_results
    - qm_chemical_claims
    - qm_chemical_sensor_timeseries


# ===============================================
# [CDM Consumer] cdm-topic → 저장소
# - kind별 이미지와 저장소 연결 정보
# ===============================================
consumer:
  # cdm-topic 파티션 수(3) 기준 병렬 처리
  replicas: 1

  # 종료 전 현재 마이크로배치를 commit할 최대 시간
  terminationGracePeriodSeconds: 300

  kinds:
    rdb:
      # PostgreSQL 저장
      image: cdm-consumer-rdb

    graph:
      # Neo4j 저장
      image: cdm-consumer-graph

      fromConfigMap:
        NEO4J_URI: PLATFORM_NEO4J_URI
        NEO4J_DATABASE: PLATFORM_NEO4J_DATABASE

      fromSecret:
        NEO4J_USER: PLATFORM_NEO4J_USER
        NEO4J_PASSWORD: PLATFORM_NEO4J_PASSWORD

    warehouse:
      # Iceberg / HDFS 저장
      image: cdm-consumer-warehouse

      # HDFS 설정 및 실행 사용자 주입
      hdfs: true


# ===============================================
# [Lineage Consumer] lineage-topic → PostgreSQL
# ===============================================
lineage:
  # 저처리량 계보 데이터 → 단일 Consumer
  replicas: 1


# ===============================================
# [TCP Socket Collector] 장비 push → raw.*
# ===============================================
tcpSocket:
  # hostNetwork 사용 → 장비는 실제 Pod가 실행된 노드 IP로 전송
  # 후보 노드가 여러 개면 장비에서 모든 노드 IP에 접근 가능해야 함
  nodeNames: ["s1"]