# ===============================================
# [CDM Mapper Deployment ×N]
#
# - 모듈별로 Deployment 생성
# - 같은 이미지에서 실행 모듈만 command로 구분
# - 변환 규칙은 MinIO의 config/*.yaml에서 조회
# - probe 없음: 포트가 없는 배치 워커
# ===============================================

{{- range .Values.mapper.modules }}

---

apiVersion: apps/v1
kind: Deployment

metadata:
  # 모듈명을 Kubernetes 리소스명으로 변환
  name: cdm-mapper-{{ . | replace "_" "-" }}
  namespace: {{ $.Values.global.namespace }}
  labels:
    app: cdm-mapper
    cdm.mapper/module: {{ . }}
    app.kubernetes.io/name: cdm-mapper
    app.kubernetes.io/part-of: data-layer

spec:
  replicas: {{ $.Values.mapper.replicas }}

  selector:
    matchLabels:
      app: cdm-mapper
      cdm.mapper/module: {{ . }}

  template:
    metadata:
      labels:
        # 305-api가 DQ 재기동 대상을 찾는 기준
        app: cdm-mapper
        cdm.mapper/module: {{ . }}
        app.kubernetes.io/name: cdm-mapper
        app.kubernetes.io/part-of: data-layer

    spec:
      # 불필요한 Service 환경변수 자동 주입 방지
      enableServiceLinks: false

      # 종료 전 현재 배치 처리 시간 확보
      terminationGracePeriodSeconds: {{ $.Values.mapper.terminationGracePeriodSeconds }}

      containers:
        - name: cdm-mapper
          image: {{ $.Values.global.harborRegistry }}/data-layer/cdm-mapper:{{ $.Values.global.imageTag }}
          imagePullPolicy: IfNotPresent

          # 모듈별 실행 진입점
          command: ["python", "-m", "cdm.data_layer_mappers.{{ . }}"]

          # 공통 환경변수 + Secret 주입
          envFrom:
            - configMapRef:
                name: data-layer-env
            - secretRef:
                name: data-layer-secrets

          env:
            # Mapper 전용 로그 레벨
            - name: LOG_LEVEL
              valueFrom:
                configMapKeyRef:
                  name: data-layer-env
                  key: CDM_MAPPER_LOG_LEVEL

          # 리소스 requests는 노드 여유 확보 후 적용
          # resources:
          #   requests:
          #     cpu: "100m"
          #     memory: "256Mi"

{{- end }}