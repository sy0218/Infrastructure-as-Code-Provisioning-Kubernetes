# ===============================================
# [Lineage Consumer Deployment]
#   - lineage-topic → PostgreSQL 계보 저장
#   - 본 데이터와 토픽·Consumer Group을 분리
# ===============================================

apiVersion: apps/v1
kind: Deployment

metadata:
  name: cdm-lineage-consumer
  namespace: {{ .Values.global.namespace }}
  labels:
    app: cdm-lineage-consumer
    app.kubernetes.io/name: cdm-lineage-consumer
    app.kubernetes.io/part-of: data-layer

spec:
  replicas: {{ .Values.lineage.replicas }}

  selector:
    matchLabels:
      app: cdm-lineage-consumer

  template:
    metadata:
      labels:
        app: cdm-lineage-consumer
        app.kubernetes.io/name: cdm-lineage-consumer
        app.kubernetes.io/part-of: data-layer

    spec:
      # 불필요한 Service 환경변수 자동 주입 방지
      enableServiceLinks: false

      # 종료 전 현재 배치 commit 시간 확보
      terminationGracePeriodSeconds: {{ .Values.consumer.terminationGracePeriodSeconds }}

      containers:
        - name: cdm-lineage-consumer
          image: {{ .Values.global.harborRegistry }}/data-layer/cdm-lineage-consumer:{{ .Values.global.imageTag }}
          imagePullPolicy: IfNotPresent

          # 공통 환경변수 + Secret 주입
          envFrom:
            - configMapRef:
                name: data-layer-env
            - secretRef:
                name: data-layer-secrets

          env:
            # 공용 PG DSN을 Lineage 전용 이름으로 매핑
            - name: LINEAGE_PG_DSN
              valueFrom:
                configMapKeyRef:
                  name: data-layer-env
                  key: PLATFORM_PG_DSN

            # Lineage 전용 로그 레벨
            - name: LOG_LEVEL
              valueFrom:
                configMapKeyRef:
                  name: data-layer-env
                  key: LINEAGE_LOG_LEVEL

          # 리소스 requests는 노드 여유 확보 후 적용
          # resources:
          #   requests:
          #     cpu: "50m"
          #     memory: "128Mi"