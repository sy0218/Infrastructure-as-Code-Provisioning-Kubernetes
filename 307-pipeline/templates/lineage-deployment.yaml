# ===============================================
# [Lineage Consumer Deployment]
#
# - lineage-topic → PostgreSQL(data_pipeline.data_lineage), DSN 은 공용 LINEAGE_PG_DSN
# - 본 데이터 경로와 토픽·그룹이 분리돼 계보 DB 장애가 파이프라인 정지로 번지지 않는다
# ===============================================
apiVersion: apps/v1
kind: Deployment

metadata:
  name: cdm-lineage-consumer
  namespace: {{ .Values.global.namespace }}
  labels:
    app: cdm-lineage-consumer
    app.kubernetes.io/name: cdm-lineage-consumer
    app.kubernetes.io/part-of: data-layer

spec:
  replicas: {{ .Values.lineage.replicas }}

  selector:
    matchLabels:
      app: cdm-lineage-consumer

  template:
    metadata:
      labels:
        app: cdm-lineage-consumer
        app.kubernetes.io/name: cdm-lineage-consumer
        app.kubernetes.io/part-of: data-layer

    spec:
      # Kubernetes Service 환경변수 자동 주입 비활성화
      enableServiceLinks: false

      terminationGracePeriodSeconds: {{ .Values.consumer.terminationGracePeriodSeconds }}

      containers:
        - name: cdm-lineage-consumer
          image: {{ .Values.global.harborRegistry }}/data-layer/cdm-lineage-consumer:{{ .Values.global.imageTag }}
          imagePullPolicy: IfNotPresent

          envFrom:
            - configMapRef:
                name: data-layer-env
            - secretRef:
                name: data-layer-secrets

          env:
            - name: LOG_LEVEL
              valueFrom:
                configMapKeyRef:
                  name: data-layer-env
                  key: LINEAGE_LOG_LEVEL

          # requests 는 당분간 주석 처리 — 노드 여유가 없다 (304-airflow 와 같은 임시 조치)
          # resources:
          #   requests:
          #     cpu: "50m"
          #     memory: "128Mi"
