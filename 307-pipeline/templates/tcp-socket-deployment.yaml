# ===============================================
# [TCP Socket Collector Deployment]
#
# - 장비 TCP 데이터 → raw.* Kafka
# - hostNetwork + 런타임 동적 포트 → Service 없이 직접 수신
# - 단일 Pod + Recreate로 동일 NodePort 충돌 방지
# ===============================================

apiVersion: apps/v1
kind: Deployment

metadata:
  name: tcp-socket-collector
  namespace: {{ .Values.global.namespace }}
  labels:
    app: tcp-socket-collector
    app.kubernetes.io/name: tcp-socket-collector
    app.kubernetes.io/part-of: data-layer

spec:
  # hostNetwork에서 동일 포트 중복 bind 방지
  replicas: 1

  # 교체 시 기존 Pod 종료 후 새 Pod 생성
  strategy:
    type: Recreate

  selector:
    matchLabels:
      app: tcp-socket-collector

  template:
    metadata:
      labels:
        # 305-api가 수집기 상태 조회에 사용하는 라벨
        app: tcp-socket-collector
        app.kubernetes.io/name: tcp-socket-collector
        app.kubernetes.io/part-of: data-layer

    spec:
      enableServiceLinks: false

      # Pod IP = Node IP
      hostNetwork: true

      # hostNetwork에서도 Cluster DNS 사용
      dnsPolicy: ClusterFirstWithHostNet

      # 장비 수신이 가능한 Node로 스케줄링
      # nodeNames는 global.nodes에서 검증
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: In
                    values:
                      {{- range .Values.tcpSocket.nodeNames }}
                      {{- $_ := include "pipeline.nodeIp" (dict "root" $ "name" .) }}
                      - {{ . | quote }}
                      {{- end }}

      containers:
        - name: tcp-socket-collector
          image: {{ .Values.global.harborRegistry }}/data-layer/tcp-socket-collector:{{ .Values.global.imageTag }}
          imagePullPolicy: IfNotPresent

          # 수신 포트가 런타임에 결정되므로 ports 미정의
          envFrom:
            - configMapRef:
                name: data-layer-env
            - secretRef:
                name: data-layer-secrets

          env:
            # Collector DB 연결
            - name: TCP_SOCKET_PG_DSN
              valueFrom:
                configMapKeyRef:
                  name: data-layer-env
                  key: PLATFORM_PG_DSN

            - name: TCP_SOCKET_DB_SCHEMA
              valueFrom:
                configMapKeyRef:
                  name: data-layer-env
                  key: COLLECTOR_DB_SCHEMA

            # 수집 실패 데이터를 raw 단계 DLQ로 전송
            - name: TCP_SOCKET_DLQ_TOPIC
              valueFrom:
                configMapKeyRef:
                  name: data-layer-env
                  key: DATA_QUALITY_DLQ_TOPIC

            # Collector 전용 로그 레벨
            - name: LOG_LEVEL
              valueFrom:
                configMapKeyRef:
                  name: data-layer-env
                  key: TCP_SOCKET_LOG_LEVEL

          # 동적 수신 포트라 고정 probe 사용 안 함
          # resources:
          #   requests:
          #     cpu: "100m"
          #     memory: "128Mi"