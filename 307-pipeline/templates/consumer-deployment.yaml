# ===============================================
# [CDM Consumer Deployment ×3]
# rdb / graph / warehouse
#
# - 모두 cdm-topic을 독립 Consumer Group으로 소비
# - 종류별 차이: 이미지 + 환경변수 매핑 + HDFS 사용 여부
# - probe 없음: 포트가 없는 배치 워커이므로 probe 오판 방지
# ===============================================

{{- range $kind, $c := .Values.consumer.kinds }}

---

apiVersion: apps/v1
kind: Deployment

metadata:
  name: cdm-consumer-{{ $kind }}
  namespace: {{ $.Values.global.namespace }}
  labels:
    app: cdm-consumer-{{ $kind }}
    app.kubernetes.io/name: cdm-consumer-{{ $kind }}
    app.kubernetes.io/component: cdm-consumer
    app.kubernetes.io/part-of: data-layer

spec:
  replicas: {{ $.Values.consumer.replicas }}

  selector:
    matchLabels:
      app: cdm-consumer-{{ $kind }}

  template:
    metadata:
      {{- if $c.hdfs }}
      annotations:
        # HDFS 설정 변경 시 ConfigMap checksum 변경 → 자동 롤아웃
        checksum/hdfs-client: {{ include (print $.Template.BasePath "/hdfs-client-configmap.yaml") $ | sha256sum }}
      {{- end }}

      labels:
        app: cdm-consumer-{{ $kind }}
        app.kubernetes.io/name: cdm-consumer-{{ $kind }}
        app.kubernetes.io/component: cdm-consumer
        app.kubernetes.io/part-of: data-layer

    spec:
      # 불필요한 Service 환경변수 자동 주입 방지
      enableServiceLinks: false

      # 종료 전 현재 마이크로배치 commit 시간 확보
      terminationGracePeriodSeconds: {{ $.Values.consumer.terminationGracePeriodSeconds }}

      containers:
        - name: cdm-consumer-{{ $kind }}
          image: {{ $.Values.global.harborRegistry }}/data-layer/{{ $c.image }}:{{ $.Values.global.imageTag }}
          imagePullPolicy: IfNotPresent

          # 공통 환경변수 + Secret 주입
          envFrom:
            - configMapRef:
                name: data-layer-env
            - secretRef:
                name: data-layer-secrets

          {{- if or $c.fromConfigMap $c.fromSecret $c.hdfs }}
          env:
            {{- range $name, $key := $c.fromConfigMap }}
            # 종류별 환경변수 이름으로 ConfigMap 값을 매핑
            - name: {{ $name }}
              valueFrom:
                configMapKeyRef:
                  name: data-layer-env
                  key: {{ $key }}
            {{- end }}

            {{- range $name, $key := $c.fromSecret }}
            # 종류별 환경변수 이름으로 Secret 값을 매핑
            - name: {{ $name }}
              valueFrom:
                secretKeyRef:
                  name: data-layer-secrets
                  key: {{ $key }}
            {{- end }}

            {{- if $c.hdfs }}
            # HDFS 클라이언트 설정 및 실행 사용자
            - name: HADOOP_USER_NAME
              value: {{ $.Values.global.hadoop.warehouse.user | quote }}
            - name: HADOOP_CONF_DIR
              value: /etc/hadoop/conf
            {{- end }}
          {{- end }}

          {{- if $c.hdfs }}
          # HDFS 클라이언트 설정 마운트
          volumeMounts:
            - name: hdfs-client-config
              mountPath: /etc/hadoop/conf
              readOnly: true
          {{- end }}

          # 리소스 requests는 노드 여유 확보 후 적용
          # resources:
          #   requests:
          #     cpu: "100m"
          #     memory: "256Mi"

      {{- if $c.hdfs }}
      volumes:
        - name: hdfs-client-config
          configMap:
            name: hdfs-client-config
      {{- end }}

{{- end }}