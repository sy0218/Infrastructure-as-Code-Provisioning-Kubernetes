# ===============================================
# [Airflow Api-Server Deployment]
#   - UI / REST API / Execution API 제공
#   - Stateless → RollingUpdate
# ===============================================

apiVersion: apps/v1
kind: Deployment

metadata:
  name: airflow-apiserver
  namespace: {{ .Values.global.namespace }}
  labels:
    app: airflow-apiserver
    app.kubernetes.io/name: airflow
    app.kubernetes.io/component: apiserver
    app.kubernetes.io/part-of: data-layer

spec:
  replicas: {{ .Values.apiserver.replicas }}

  # Stateless → 무중단 RollingUpdate
  strategy:
    type: RollingUpdate

  selector:
    # 기존 리소스와의 호환성을 위해 고정
    matchLabels:
      app: airflow-apiserver

  template:
    metadata:
      annotations:
        # Secret 변경 시 Pod 재생성
        checksum/airflow-env: {{ include (print $.Template.BasePath "/secret-airflow-env.yaml") . | sha256sum }}

      labels:
        app: airflow-apiserver
        app.kubernetes.io/name: airflow
        app.kubernetes.io/component: apiserver
        app.kubernetes.io/part-of: data-layer

    spec:
      # 불필요한 Service 환경변수 자동 주입 방지
      enableServiceLinks: false

      # 컨테이너 실행 사용자 및 파일시스템 권한
      securityContext:
        runAsUser: {{ .Values.securityContext.runAsUser }}
        runAsGroup: {{ .Values.securityContext.fsGroup }}
        fsGroup: {{ .Values.securityContext.fsGroup }}

      containers:
        - name: apiserver
          image: {{ .Values.global.harborRegistry }}/data-layer/airflow:{{ .Values.global.imageTag }}
          imagePullPolicy: IfNotPresent

          # 이미지 기본 entrypoint 유지, Airflow CLI 인자만 전달
          args: ["api-server"]

          ports:
            - name: http
              containerPort: {{ .Values.apiserver.port }}

          envFrom:
            # airflow-env 를 마지막에 — 겹치는 키는 Airflow 설정이 이긴다
            - configMapRef:
                name: data-layer-env
            - secretRef:
                name: data-layer-secrets
            - secretRef:
                name: airflow-env

          # 트래픽 수신 가능 여부
          readinessProbe:
            httpGet:
              path: /api/v2/monitor/health
              port: http
            initialDelaySeconds: 20
            periodSeconds: 10
            failureThreshold: 6

          # 프로세스 정상 동작 여부
          livenessProbe:
            httpGet:
              path: /api/v2/monitor/health
              port: http
            initialDelaySeconds: 60
            periodSeconds: 60
            failureThreshold: 6

          # requests 는 당분간 주석 처리 — 노드 여유가 없어(ap CPU 95% · s1 메모리 96% 요청) 그대로는
          # api-server 가 Pending 이라 스케줄러 검사를 빼고 띄운다(301-hadoop 과 같은 임시 조치).
          # 대가: QoS 가 BestEffort 라 메모리 압박 시 먼저 evict 된다. 여유가 생기면 주석을 푼다.
          # resources:
          #   requests:
          #     cpu: "250m"
          #     memory: "1Gi"
