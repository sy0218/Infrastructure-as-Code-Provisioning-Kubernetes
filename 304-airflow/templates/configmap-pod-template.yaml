# ===============================================
# [KubernetesExecutor Task Pod Template]
#   - Scheduler가 읽는 태스크 Pod 기본 템플릿
#   - 태스크 실행 시 Pod 생성 → 종료 후 삭제
#   - Pod 생성/삭제 권한은 default SA 에 붙은 300 의 ClusterRoleBinding 이 준다(차트에 SA/RBAC 없음)
# ===============================================

apiVersion: v1
kind: ConfigMap

metadata:
  name: airflow-pod-template
  namespace: {{ .Values.global.namespace }}
  labels:
    app.kubernetes.io/name: airflow
    app.kubernetes.io/component: pod-template
    app.kubernetes.io/part-of: data-layer

data:
  # ConfigMap을 디렉토리로 마운트하여 파일로 사용
  pod_template.yaml: |
    apiVersion: v1
    kind: Pod
    metadata:
      labels:
        app.kubernetes.io/name: airflow
        app.kubernetes.io/component: worker
        app.kubernetes.io/part-of: data-layer

    spec:
      # 태스크 재시작은 Airflow가 관리
      restartPolicy: Never

      # Kubernetes Service 환경변수 자동 주입 비활성화
      enableServiceLinks: false

      # 태스크 Pod 실행 UID/GID
      securityContext:
        runAsUser: {{ .Values.securityContext.runAsUser }}
        runAsGroup: {{ .Values.securityContext.fsGroup }}
        fsGroup: {{ .Values.securityContext.fsGroup }}

      containers:
        # Airflow가 태스크 실행 설정을 주입하므로 이름은 base로 고정
        - name: base

          # Scheduler/API Server와 동일한 Airflow 이미지 사용
          image: {{ .Values.global.harborRegistry }}/data-layer/airflow:{{ .Values.global.imageTag }}
          imagePullPolicy: IfNotPresent

          envFrom:
            - configMapRef:
                name: data-layer-env
            - secretRef:
                name: data-layer-secrets
            - secretRef:
                name: airflow-env

          # 태스크 Pod 기본 리소스
          resources:
            requests:
              cpu: "10m"
              memory: "128Mi"

          # DAG 및 Python 코드 디렉토리 마운트
          volumeMounts:
            {{- range .Values.repo.dirs }}
            - name: repo-{{ . }}
              mountPath: {{ printf "%s/%s" $.Values.airflowHome . | quote }}
              readOnly: true
            {{- end }}

      volumes:
        # 각 노드에 동기화된 DAG/코드 디렉토리 사용
        {{- range .Values.repo.dirs }}
        - name: repo-{{ . }}
          hostPath:
            path: {{ printf "%s/%s" $.Values.repo.hostPath . | quote }}
            type: Directory
        {{- end }}