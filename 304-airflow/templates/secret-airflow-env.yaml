# ===============================================
# [Airflow 설정 Secret]
# - Airflow 전용 설정 및 민감정보 관리
# - init Job / Scheduler / DAG Processor / API Server / Task Pod가 공유
# ===============================================

{{- $logsConn := dict
      "conn_type" "webhdfs"
      "host" .Values.webhdfs.hosts
      "port" (int .Values.webhdfs.port)
      "login" .Values.webhdfs.user }}

{{/* DAG 이 읽는 Connection 3종 — Connection 은 env(AIRFLOW_CONN_<ID>)로 주면 DB 등록 없이 곧바로 보인다 */}}
{{- $dbConn := dict
      "conn_type" "postgres"
      "host" (include "airflow.postgresHost" .)
      "port" (int .Values.global.postgres.port)
      "schema" .Values.global.postgres.databases.collector
      "login" .Values.global.secrets.postgresUser
      "password" .Values.global.secrets.postgresPassword }}
{{- $kafkaConn := dict
      "conn_type" "generic"
      "host" (include "airflow.kafkaBootstrap" .) }}
{{- $sshConn := dict
      "conn_type" "ssh"
      "host" .Values.collector.dataNode.host
      "port" (int .Values.collector.dataNode.port)
      "login" .Values.collector.dataNode.user
      "password" .Values.secrets.dataNodePassword
      "extra" (dict "look_for_keys" false) }}

apiVersion: v1
kind: Secret

metadata:
  name: airflow-env
  namespace: {{ .Values.global.namespace }}
  labels:
    app.kubernetes.io/name: airflow
    app.kubernetes.io/component: config
    app.kubernetes.io/part-of: data-layer

type: Opaque

# 사람이 읽고 관리할 수 있도록 stringData 사용
stringData:

  # ---------------------------------------------------
  # Airflow Core
  # ---------------------------------------------------
  AIRFLOW__CORE__EXECUTOR: {{ .Values.executor | quote }}
  AIRFLOW__CORE__AUTH_MANAGER: "airflow.providers.fab.auth_manager.fab_auth_manager.FabAuthManager"
  AIRFLOW__CORE__LOAD_EXAMPLES: "false"
  AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
  AIRFLOW__CORE__DEFAULT_TIMEZONE: {{ .Values.timezone | quote }}
  AIRFLOW__CORE__FERNET_KEY: {{ .Values.secrets.fernetKey | quote }}
  AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: {{ include "airflow.sqlAlchemyConn" . | quote }}

  # ---------------------------------------------------
  # DAG / Python 코드
  # ---------------------------------------------------
  AIRFLOW__CORE__DAGS_FOLDER: {{ printf "%s/dags" .Values.airflowHome | quote }}
  PYTHONPATH: {{ .Values.airflowHome | quote }}

  # ---------------------------------------------------
  # API / 인증
  # ---------------------------------------------------
  # 외부 접속 주소 — Ingress Host와 동일
  AIRFLOW__API__BASE_URL: {{ printf "http://%s" .Values.global.hosts.airflow | quote }}

  # 내부 통신 — ClusterIP Service 사용
  AIRFLOW__CORE__EXECUTION_API_SERVER_URL: {{ printf "http://airflow-apiserver:%d/execution/" (int .Values.apiserver.port) | quote }}

  # api-server 프로세스의 리슨 포트 — containerPort·Service·Ingress 와 같은 값(apiserver.port)에서 파생
  AIRFLOW__API__PORT: {{ .Values.apiserver.port | quote }}

  # 모든 Airflow 컴포넌트에서 동일한 인증 키 사용
  AIRFLOW__API__SECRET_KEY: {{ .Values.secrets.apiSecretKey | quote }}
  # 섹션이 [api_auth] 라 밑줄 하나다 — AIRFLOW__API__AUTH__... 로 적으면 무시되고 파드마다 랜덤 키가 생긴다
  AIRFLOW__API_AUTH__JWT_SECRET: {{ .Values.secrets.jwtSecret | quote }}

  # ---------------------------------------------------
  # KubernetesExecutor
  # ---------------------------------------------------
  # 태스크마다 Pod 생성
  AIRFLOW__KUBERNETES_EXECUTOR__NAMESPACE: {{ .Values.global.namespace | quote }}
  AIRFLOW__KUBERNETES_EXECUTOR__POD_TEMPLATE_FILE: {{ printf "%s/pod_template.yaml" .Values.podTemplateDir | quote }}
  AIRFLOW__KUBERNETES_EXECUTOR__DELETE_WORKER_PODS_ON_FAILURE: "False"

  # 동시 실행 태스크 제한
  AIRFLOW__CORE__PARALLELISM: {{ .Values.parallelism | quote }}
  AIRFLOW__CORE__MAX_ACTIVE_TASKS_PER_DAG: {{ .Values.maxActiveTasksPerDag | quote }}

  # ---------------------------------------------------
  # DAG Processor / Scheduler
  # ---------------------------------------------------
  # DAG 파일 변경 감지 주기
  AIRFLOW__DAG_PROCESSOR__REFRESH_INTERVAL: {{ .Values.dagRefreshInterval | quote }}

  # Scheduler Health API 활성화
  AIRFLOW__SCHEDULER__ENABLE_HEALTH_CHECK: "true"

  # ---------------------------------------------------
  # Logging
  # ---------------------------------------------------
  AIRFLOW__LOGGING__LOGGING_LEVEL: {{ .Values.logLevel | quote }}
  AIRFLOW__LOGGING__LOG_FORMAT: "%(asctime)s %(levelname)s %(name)s %(message)s"

  # HDFS 원격 로그 저장
  AIRFLOW__LOGGING__REMOTE_LOGGING: "True"
  AIRFLOW__LOGGING__REMOTE_BASE_LOG_FOLDER: {{ .Values.logs.remoteBaseFolder | quote }}
  AIRFLOW__LOGGING__REMOTE_LOG_CONN_ID: {{ .Values.logs.connId | quote }}

  # WebHDFS Connection
  {{ printf "AIRFLOW_CONN_%s" (upper .Values.logs.connId) }}: {{ $logsConn | toJson | quote }}

  # ---------------------------------------------------
  # DAG 이 읽는 Airflow Variable / Connection
  # ---------------------------------------------------
  # 구 compose 의 register_airflow_{variables,connections}.sh 를 env 로 승계했다.
  # env 백엔드는 메타DB 보다 먼저 조회되므로 초기화 Job 순서에 의존하지 않는다.
  # 키 이름 = AIRFLOW_VAR_<대문자 Variable 키> / AIRFLOW_CONN_<대문자 conn_id>.
  AIRFLOW_VAR_COLLECTOR_CRYPTO_KEY: {{ .Values.global.secrets.collectorCryptoKey | quote }}
  AIRFLOW_VAR_COLLECTOR_DB_QUERY: {{ .Values.collector.dbQuery | quote }}
  AIRFLOW_VAR_COLLECTOR_KAFKA_CONFIG: {{ dict "acks" (int .Values.collector.kafka.acks) "retries" (int .Values.collector.kafka.retries) | toJson | quote }}
  AIRFLOW_VAR_COLLECTOR_SNAPSHOT_CONFIG: {{ dict "data_root" .Values.collector.snapshot.dataRoot "retention_days" (int .Values.collector.snapshot.retentionDays) | toJson | quote }}

  AIRFLOW_CONN_COLLECTOR_DB: {{ $dbConn | toJson | quote }}
  AIRFLOW_CONN_COLLECTOR_KAFKA: {{ $kafkaConn | toJson | quote }}
  AIRFLOW_CONN_DATA_NODE_SSH: {{ $sshConn | toJson | quote }}

  # ---------------------------------------------------
  # Timezone
  # ---------------------------------------------------
  TZ: {{ .Values.timezone | quote }}

  # ---------------------------------------------------
  # 초기 관리자 계정
  # ---------------------------------------------------
  AIRFLOW_ADMIN_USERNAME: {{ .Values.secrets.adminUsername | quote }}
  AIRFLOW_ADMIN_PASSWORD: {{ .Values.secrets.adminPassword | quote }}
  AIRFLOW_ADMIN_FIRSTNAME: "Admin"
  AIRFLOW_ADMIN_LASTNAME: "User"
  AIRFLOW_ADMIN_EMAIL: "admin@example.com"