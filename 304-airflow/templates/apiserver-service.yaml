# ===============================================
# [Airflow API Server Service]
# - Ingress와 내부 Pod가 공통으로 사용하는 Service
# - ClusterIP로 생성하여 외부에는 직접 노출하지 않음
# ===============================================

apiVersion: v1
kind: Service

metadata:
  name: airflow-apiserver
  namespace: {{ .Values.global.namespace }}
  labels:
    app: airflow-apiserver
    app.kubernetes.io/name: airflow
    app.kubernetes.io/component: apiserver
    app.kubernetes.io/part-of: data-layer

spec:
  # Ingress를 통해 외부 접근 → ClusterIP로 충분
  type: ClusterIP

  # 이 Label을 가진 API Server Pod로 트래픽 전달
  selector:
    app: airflow-apiserver

  ports:
    - name: http
      # Service가 노출하는 포트
      port: {{ .Values.apiserver.port }}
      # Pod의 named port(http)로 전달
      targetPort: http