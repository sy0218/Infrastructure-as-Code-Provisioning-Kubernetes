# ===============================================
# [Airflow Triggerer]
# - Deferrable Operator의 Trigger 실행 전담
# ===============================================

apiVersion: apps/v1
kind: Deployment

metadata:
  name: airflow-triggerer
  namespace: {{ .Values.global.namespace }}
  labels:
    app: airflow-triggerer
    app.kubernetes.io/name: airflow
    app.kubernetes.io/component: triggerer
    app.kubernetes.io/part-of: data-layer

spec:
  replicas: {{ .Values.triggerer.replicas }}

  # Trigger 중복 실행 방지
  strategy:
    type: Recreate

  selector:
    matchLabels:
      app: airflow-triggerer

  template:
    metadata:
      annotations:
        # 설정 변경 시 Pod 재시작
        checksum/airflow-env: {{ include (print $.Template.BasePath "/secret-airflow-env.yaml") . | sha256sum }}

      labels:
        app: airflow-triggerer
        app.kubernetes.io/name: airflow
        app.kubernetes.io/component: triggerer
        app.kubernetes.io/part-of: data-layer

    spec:
      # Service 환경변수 자동 주입 비활성화
      enableServiceLinks: false

      # 컨테이너 실행 사용자
      securityContext:
        runAsUser: {{ .Values.securityContext.runAsUser }}
        runAsGroup: {{ .Values.securityContext.fsGroup }}
        fsGroup: {{ .Values.securityContext.fsGroup }}

      containers:
        - name: triggerer
          image: {{ .Values.global.harborRegistry }}/data-layer/airflow:{{ .Values.global.imageTag }}
          imagePullPolicy: IfNotPresent

          # Triggerer 실행
          args: ["triggerer"]

          envFrom:
            - configMapRef:
                name: data-layer-env
            - secretRef:
                name: data-layer-secrets
            # Airflow 설정 우선 적용
            - secretRef:
                name: airflow-env

          # Triggerer 상태 확인
          livenessProbe:
            exec:
              command:
                - /bin/bash
                - -c
                - airflow jobs check --job-type TriggererJob --local
            initialDelaySeconds: 60
            periodSeconds: 60
            timeoutSeconds: 30
            failureThreshold: 5

          # requests 는 당분간 주석 처리 — 노드 여유가 없어(ap CPU 95% · s1 메모리 96% 요청) 그대로는
          # api-server 가 Pending 이라 스케줄러 검사를 빼고 띄운다(301-hadoop 과 같은 임시 조치).
          # 대가: QoS 가 BestEffort 라 메모리 압박 시 먼저 evict 된다. 여유가 생기면 주석을 푼다.
          # resources:
          #   requests:
          #     cpu: "100m"
          #     memory: "512Mi"

          # 커스텀 Trigger 코드 로드용
          volumeMounts:
            {{- range .Values.repo.dirs }}
            - name: repo-{{ . }}
              mountPath: {{ printf "%s/%s" $.Values.airflowHome . | quote }}
              readOnly: true
            {{- end }}

      volumes:
        # DAG/코드 디렉토리 없으면 배포 실패
        {{- range .Values.repo.dirs }}
        - name: repo-{{ . }}
          hostPath:
            path: {{ printf "%s/%s" $.Values.repo.hostPath . | quote }}
            type: Directory
        {{- end }}