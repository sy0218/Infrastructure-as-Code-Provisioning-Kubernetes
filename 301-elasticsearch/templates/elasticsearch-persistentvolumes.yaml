# ===============================================
# [Elasticsearch Local PV]
#   - nodeNames 의 노드마다 PV 1개 (N노드 = PV N개)
#
# [핵심]
# - local PV → 노드의 로컬 디렉터리, nodeAffinity 로 노드 고정
# - claimRef → StatefulSet 이 만들 PVC 이름(data-elasticsearch-N)에 미리 묶는다
#   → ordinal ↔ PVC ↔ PV ↔ 노드가 고정되어 elasticsearch-N 은 nodeNames[N] 의 디스크만 쓴다
# - Retain → PVC 삭제 시에도 PV/데이터를 유지
#
# [참고] → 로컬 디렉터리(values data.path)는 Ansible elasticsearch_prereq 가 미리 만든다 (root:root 2770)
# ===============================================

{{- $root := . }}

{{- range $i, $nodeName := .Values.nodeNames }}

---
apiVersion: v1
kind: PersistentVolume

metadata:
  # 예: elasticsearch-ap / elasticsearch-s1
  name: {{ printf "elasticsearch-%s" $nodeName }}

  labels:
    app.kubernetes.io/part-of: data-layer
    app.kubernetes.io/name: elasticsearch
    data-layer/elasticsearch-node: {{ $nodeName }}
    data-layer/elasticsearch-ordinal: {{ $i | quote }}

spec:
  capacity:
    storage: {{ $root.Values.data.size }}

  volumeMode: Filesystem

  accessModes:
    - ReadWriteOnce

  # PVC 삭제 후에도 PV 와 실제 데이터를 유지
  persistentVolumeReclaimPolicy: Retain

  storageClassName: {{ $root.Values.storageClass }}

  # 해당 ordinal 의 PVC 에 PV 를 미리 바인딩 (volumeClaimTemplates 이름 data + StatefulSet 이름 + ordinal)
  claimRef:
    namespace: {{ $root.Values.global.namespace }}
    name: {{ printf "data-elasticsearch-%d" $i }}

  # Node 의 실제 로컬 디렉터리
  local:
    path: {{ $root.Values.data.path }}

  # Local PV 가 지정된 Node 에서만 사용되도록 고정
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/hostname
              operator: In
              values:
                - {{ $nodeName }}

{{- end }}
