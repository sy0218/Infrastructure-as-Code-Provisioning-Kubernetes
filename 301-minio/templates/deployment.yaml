# ===============================================
# [MinIO Deployment]
#
# - 단일 Pod + RWO PVC(Longhorn)
# - Recreate: 기존 Pod 종료 후 새 Pod 생성
#   → RWO PVC의 Multi-Attach 방지
# - 노드 고정 없이 장애 시 다른 노드에서 재기동
#   → Longhorn이 PVC를 새 노드에 연결
# ===============================================

apiVersion: apps/v1
kind: Deployment

metadata:
  name: minio
  namespace: {{ .Values.global.namespace }}
  labels:
    app: minio
    app.kubernetes.io/name: minio
    app.kubernetes.io/part-of: data-layer

spec:
  replicas: 1

  # RWO PVC 사용 → 기존 Pod 종료 후 새 Pod 생성
  strategy:
    type: Recreate

  selector:
    matchLabels:
      app: minio

  template:
    metadata:
      labels:
        app: minio
        app.kubernetes.io/name: minio
        app.kubernetes.io/part-of: data-layer

    spec:
      # Kubernetes Service 환경변수 자동 주입 비활성화
      enableServiceLinks: false

      # Node 장애 감지 후 빠르게 Pod 퇴거
      # → 실제 강제 삭제 및 재기동은 Longhorn 정책에 의존
      tolerations:
        - key: node.kubernetes.io/unreachable
          operator: Exists
          effect: NoExecute
          tolerationSeconds: {{ .Values.tolerationSeconds }}

        - key: node.kubernetes.io/not-ready
          operator: Exists
          effect: NoExecute
          tolerationSeconds: {{ .Values.tolerationSeconds }}

      containers:
        - name: minio
          image: {{ .Values.global.harborRegistry }}/data-layer/minio:{{ .Values.global.imageTag }}
          imagePullPolicy: IfNotPresent

          args:
            - server
            - /data

          # 공용 ConfigMap 대신 필요한 MINIO_* 변수만 명시적으로 주입
          # 내부 전용 → 웹 콘솔 비활성화, 관리 작업은 mc 사용
          env:
            # 내부 전용이라 웹 콘솔은 끈다 → 관리 작업은 mc(이미지 동봉)
            - name: MINIO_BROWSER
              value: "off"

            - name: MINIO_ROOT_USER
              valueFrom:
                secretKeyRef:
                  name: data-layer-secrets
                  key: MINIO_ROOT_USER

            - name: MINIO_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: data-layer-secrets
                  key: MINIO_ROOT_PASSWORD

          ports:
            - name: api
              containerPort: {{ .Values.ports.api }}

          volumeMounts:
            - name: data
              mountPath: /data

          resources:
            requests:
              cpu: "10m"
              memory: "64Mi"

          # S3 API 요청 처리 가능 여부 확인
          readinessProbe:
            httpGet:
              path: /minio/health/ready
              port: api
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 6

          # 프로세스 정상 동작 여부 확인
          livenessProbe:
            httpGet:
              path: /minio/health/live
              port: api
            initialDelaySeconds: 30
            periodSeconds: 60
            failureThreshold: 6

      # Longhorn PVC 연결
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: minio-data