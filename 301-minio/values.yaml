# ===============================================
# [301-minio 전용 설정]
# → 공통값(global.*)은 values.common.yaml에서 관리
# ===============================================

# MinIO 포트 (내부 전용 — 웹 콘솔은 MINIO_BROWSER=off 로 꺼 둔다)
ports:
  api: 9000 # S3 API


# ===============================================
# [Storage]
# → MinIO는 단일 인스턴스로 구성하고
#   데이터 복제는 Longhorn이 담당
# → Longhorn Replica를 통해 노드 장애 시 데이터 보호
# ===============================================
storage:
  storageClass: "longhorn"
  size: "20Gi"  # PVC 용량 상한


# Pod 퇴거 대기 시간(초)
# → Node 장애 감지 후 60초 뒤 다른 노드에서 재기동
# → 강제 삭제 정책은 Longhorn에서 관리
tolerationSeconds: 60