# ===============================================
# [kafka-tools values]
# - 로컬 환경에서 helm template 단독 렌더 가능
# - ArgoCD app-of-apps 배포 시 global.* 덮어쓰기 가능
# - 필수 값/형식은 values.schema.json으로 검증
# ===============================================

global:
  # Kubernetes Namespace (300-data-layer-base 소유 → 여기서는 참조만)
  namespace: "data-layer"

  # Harbor 레지스트리 주소(스킴 없음) → 이미지 이름의 첫 마디가 된다.
  # :80 필수 — 콜론도 점도 없는 단일 라벨은 Docker 참조 파서가 레지스트리로
  # 인정하지 않고 docker.io 밑 경로로 정규화한다(그러면 pull 이 Docker Hub 로 간다).
  harborRegistry: "data-layer-harbor:80"

  # 배포할 이미지 태그 → 불변 태그로 다루고 재사용하지 않는다
  imageTag: "v0.1.0"

  # Ingress 클래스 이름 (102-ingress 의 ingress-nginx)
  ingressClassName: "nginx"

  # Kafka 브로커 주소 → 300-data-layer-base 의 global.kafkaBootstrap 복사본.
  # 워크로드는 실제 값을 클러스터의 공용 ConfigMap(data-layer-env)에서 받고,
  # 이 복사본은 값이 바뀔 때 파드를 재기동시키는 checksum 계산에만 쓴다.
  # [주의] 바꿀 때는 300과 같은 커밋에서 함께 수정한다.
  kafkaBootstrap: "192.168.56.200:9092,192.168.56.201:9092,192.168.56.202:9092"


# ===============================================
# 이 차트가 소유한 값
#
# 포트 하나가 매니페스트 안 여러 곳(리슨 주소/containerPort/Service port)에
# 나오므로 값 하나에서 전부 주입해 어긋날 방법 자체를 없앤다.
#
# [주의] 300-data-layer-base 가 URL 조립용 복사본을 갖는 값이 둘 있다
#    (schemaRegistryPort / kafkaUiHost) → 바꾸면 같은 커밋에서 함께 고친다.
# ===============================================

# Schema Registry 복제 수 (stateless → 리더 선출이 내장이라 늘려도 안전)
schemaRegistryReplicas: 1

# ClusterIP / 컨테이너 포트
schemaRegistryPort: 9096 # 300의 SCHEMA_REGISTRY_URL 조립에 사용
kafkaUiPort: 9095        # Ingress 백엔드가 가리키는 포트이기도 하다
kafkaExporterPort: 9097  # 302-monitoring 의 Prometheus 가 긁어가는 포트

# kafka-ui 접속 호스트명 → Ingress 규칙의 host이자 브라우저가 치는 주소.
# /etc/hosts 가 Ingress VIP 로 풀고(Ansible etc_hosts 롤), 노드 한 대가 죽으면
# MetalLB 가 VIP 를 살아 있는 노드로 옮긴다 → 주소도 포트도 그대로다.
# 이름 전체 표의 단일 출처는 저장소 README 접속 주소 표 → 바꾸면 같은 커밋에서 함께 고친다.
kafkaUiHost: "data-layer-kafka-ui" # 300의 KAFKA_UI_URL 조립에 사용
