# ===============================================
# [Kafka UI → Service]
#
# 외부 노출은 Ingress 가 맡는다(kafka-ui-ingress.yaml) → 여기는 ClusterIP 로 충분하다.
# 인그레스 컨트롤러도 클러스터 안에서 이 이름:포트로 부르므로 둘 다 계약이다.
# ===============================================
apiVersion: v1
kind: Service
metadata:
  name: kafka-ui
  namespace: {{ .Values.global.namespace }}
  labels:
    app: kafka-ui
    app.kubernetes.io/name: kafka-ui
    app.kubernetes.io/part-of: data-layer
spec:
  type: ClusterIP

  selector:
    app: kafka-ui
  ports:
    - name: http
      port: {{ .Values.kafkaUiPort }}
      targetPort: http
