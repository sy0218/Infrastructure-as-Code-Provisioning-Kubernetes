# ===============================================
# [Alloy → DaemonSet]
#
# 각 Node에 Alloy Pod를 1개씩 배치하여
# Node / Container 메트릭을 수집한다.
#
# Node 1 ── Alloy ──┐
# Node 2 ── Alloy ──┼──→ Prometheus
# Node 3 ── Alloy ──┘
#
# - DaemonSet       → Node마다 Alloy 1개 실행
# - hostNetwork     → Node 네트워크 사용
# - hostPath        → Node의 /proc, /sys, rootfs, containerd 접근
# - Prometheus      → Alloy의 메트릭 Endpoint를 Scrape
# - 별도 저장소 없음 → 메트릭은 Prometheus가 저장
#
# Node가 추가되면 Alloy도 자동으로 배포된다.
# ===============================================
apiVersion: apps/v1
kind: DaemonSet

metadata:
  name: alloy
  namespace: {{ .Values.global.namespace }}
  labels:
    app: alloy
    app.kubernetes.io/name: alloy
    app.kubernetes.io/part-of: data-layer

spec:
  # Alloy Pod를 식별하는 Label
  selector:
    matchLabels:
      app: alloy

  # =============================================
  # [Pod Template]
  # DaemonSet이 각 Node에 생성할 Pod 정의
  # =============================================
  template:
    metadata:
      labels:
        app: alloy
        app.kubernetes.io/name: alloy
        app.kubernetes.io/part-of: data-layer

      annotations:
        # alloy-config 가 같은 릴리스라 해시를 계산할 수 있다
        # → 설정이 바뀌면 helm upgrade 만으로 롤아웃된다(수동 rollout restart 불필요).
        checksum/config: {{ include (print $.Template.BasePath "/configmap-alloy.yaml") . | sha256sum }}

    spec:
      # Kubernetes Service 환경변수 자동 주입 방지
      enableServiceLinks: false

      # ===========================================
      # [Node Network]
      # Node의 네트워크를 직접 사용
      # ===========================================
      hostNetwork: true

      # hostNetwork 사용 시에도 Cluster DNS 사용
      dnsPolicy: ClusterFirstWithHostNet

      # ===========================================
      # [Control Plane 실행 허용]
      # Control Plane의 NoSchedule Taint 허용
      # ===========================================
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule

      containers:
        - name: alloy
          image: {{ .Values.global.harborRegistry }}/data-layer/alloy:{{ .Values.global.imageTag }}
          imagePullPolicy: IfNotPresent

          # Node의 시스템 정보를 수집하기 위해 Host 자원에 대한 높은 권한이 필요
          securityContext:
            privileged: true

          # ========================================
          # [Alloy 실행]
          # ========================================
          command: ["/bin/alloy"]
          args:
            - run
            - --server.http.listen-addr=0.0.0.0:{{ .Values.alloy.port }}
            - /etc/alloy/config.alloy

          # Prometheus가 Scrape할 Metrics Endpoint
          ports:
            - name: http-metrics
              containerPort: {{ .Values.alloy.port }}
              protocol: TCP

          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"

          # Alloy가 메트릭을 제공할 준비가 되었는지 확인
          readinessProbe:
            httpGet:
              path: {{ .Values.global.alloy.nodeMetricsPath }}
              port: http-metrics
            initialDelaySeconds: 20
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 5

          # Alloy 프로세스가 정상 동작하는지 확인
          # 계속 실패하면 kubelet이 컨테이너를 재시작
          livenessProbe:
            httpGet:
              path: /-/ready
              port: http-metrics
            initialDelaySeconds: 30
            periodSeconds: 60
            timeoutSeconds: 5
            failureThreshold: 5

          volumeMounts:
            # Alloy 설정 파일
            - name: config
              mountPath: /etc/alloy
              readOnly: true

            # Node 프로세스 / 커널 정보 수집
            - name: proc
              mountPath: /host/proc
              readOnly: true

            # Node 시스템 / cgroup 정보 수집
            - name: sys
              mountPath: /sys
              readOnly: true
              mountPropagation: HostToContainer

            # Node 파일시스템 사용량 수집
            - name: rootfs
              mountPath: /rootfs
              readOnly: true
              mountPropagation: HostToContainer

            # containerd를 통한 Container 정보 수집
            - name: containerd-sock
              mountPath: /run/containerd/containerd.sock
              readOnly: true

      # ===========================================
      # [Host Volume]
      # 위 volumeMounts에 연결할 Node의 실제 경로
      # ===========================================
      volumes:
        - name: config # alloy-config ConfigMap을 → config Volume으로 연결
          configMap:
            name: alloy-config

        - name: proc
          hostPath:
            path: /proc

        - name: sys
          hostPath:
            path: /sys

        - name: rootfs
          hostPath:
            path: /

        - name: containerd-sock
          hostPath:
            path: /run/containerd/containerd.sock
            type: Socket