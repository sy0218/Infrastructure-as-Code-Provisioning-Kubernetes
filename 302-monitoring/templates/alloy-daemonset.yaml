# ===============================================
# [Alloy DaemonSet]
#
# - Kubernetes의 각 노드마다 Alloy 1개씩 실행한다.
# - Alloy가 노드와 컨테이너의 메트릭을 수집해서 제공한다.
# - 메트릭을 저장하지는 않는다.
# - Prometheus가 Alloy의 메트릭을 가져간다.
#
# [구조]
#
# Node 1 ── Alloy ──┐
# Node 2 ── Alloy ──┼──→ Prometheus
# Node 3 ── Alloy ──┘
#
# DaemonSet이므로 노드가 추가되면 Alloy도 자동으로 추가된다.
# ===============================================

apiVersion: apps/v1
kind: DaemonSet

# ===============================================
# [DaemonSet 자기 자신의 metadata]
# ===============================================
metadata:
  name: alloy # DaemonSet 이름
  namespace: {{ .Values.global.namespace }} # DaemonSet 실행할 Namespace

  # DaemonSet(워크로드 리소스) 라벨
  labels:
    app: alloy
    app.kubernetes.io/name: alloy
    app.kubernetes.io/part-of: data-layer

spec:

  # ===============================================
  # [DaemonSet이 관리할 Pod를 선택하는 조건]
  #   → app=apply 라벨이 붙은 Pod를 이 DaemonSet이 관리 대상으로 삼는다.
  # ===============================================
  selector:
    matchLabels:
      app: alloy

  # ================================
  # [Pod Template]
  #   - 워크로드 리소스(데몬셋)가 만들어 낼 Pod의 설계도
  #   → 데몬셋 : "내가 생성할 Pod는 이렇게 생김~"
  # ================================
  template:

    # =============================================
    # [생성될 Pod의 metadata]
    # =============================================
    metadata:

      # 생성할 Pod의 라벨
      # → spec.selector.matchLabels 의 app:alloy 와 연결된다.
      labels:
        app: alloy
        app.kubernetes.io/name: alloy
        app.kubernetes.io/part-of: data-layer


      # alloy-config.yaml 내용이 변경되면 해시값도 바뀐다.
      # 해시값이 바뀌면 Pod 설정이 변경된 것으로 판단되어
      #   → DaemonSet이 Alloy Pod를 새로 만들어 변경된 설정을 적용한다.
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/alloy-config.yaml") . | sha256sum | quote }}
    
    
    # =============================================
    # [여기부터 실제 Pod의 spec]
    # =============================================
    spec:

      # Service env 자동 주입 차단
      enableServiceLinks: false

      # ===========================================
      # [Node 네트워크 사용]
      # ===========================================
      # → 실제 노드 네트워크 인터페이스 정보를 수집해야 하기 때문에 사용한다.
      # ===========================================
      hostNetwork: true

      # hostNetwork: true를 사용하면서 쿠버네티스 내부 DNS를 사용할 수 있도록한다.
      dnsPolicy: ClusterFirstWithHostNet


      # ===========================================
      # [Control Plane에도 Alloy 실행]
      # ===========================================
      # - 쿠버네티스 컨트롤 플레인 노드에는 보통 NoSchedule taint가 있다.
      # - tolerations를 추가하여 Control Plane Node에도 Alloy Pod가 올라갈 수 있다.
      # ===========================================
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule

      # ===========================================
      # [Alloy Container]
      # ===========================================
      containers:
        - name: alloy # 컨테이너 명

          # 실행할 Alloy 컨테이너 이미지
          # imagePullPolicy: IfNotPresent → 노드에 해당 이미지 있으면 다운 X
          image: {{ .Values.global.harborRegistry }}/data-layer/alloy:{{ .Values.imageTag }}
          imagePullPolicy: IfNotPresent

          # ========================================
          # [Container 권한]
          #   → Alloy가 Node의 /proc, /sys, cgroup 등을 읽어야 하기에 높은 권한으로 실행
          # =======================================
          securityContext:
            privileged: true

          # ========================================
          # [Alloy 실행 명령]
          # ========================================
          command: ["/bin/alloy"]
          args:
            - run
            - --server.http.listen-addr=0.0.0.0:{{ .Values.alloy.port }}
            - /etc/alloy/config.alloy
          

          # ========================================
          # [Alloy Metrics Port]
          # ========================================
          ports:
            # 포트에 붙이는 이름이다.
            # → Prometheus가 Service Discovery에서 이 이름을 사용할 수 있다.
            - name: http-metrics
              containerPort: {{ .Values.alloy.port }}
              protocol: TCP

          # ========================================
          # [리소스]
          #   → Alloy Pod가 스케줄링될 때
          #   최소한 확보해야 하는 CPU / Memory
          # ========================================
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"

          # ========================================
          # [준비상태]
          #   → 이 Alloy Pod가 현재 정상적으로 메트릭을 제공할 준비가 되었는가?
          # ========================================
          readinessProbe:
            httpGet:
              path: {{ .Values.alloy.nodeMetricsPath }}
              port: http-metrics
            initialDelaySeconds: 20
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 5

          # ========================================
          # [Liveness Probe]
          #   → liveness가 계속 실패하면 ( kubelet이 컨테이너를 재시작한다. )
          # ========================================
          livenessProbe:
            httpGet:
              path: /-/ready
              port: http-metrics
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 5

          volumeMounts:
            # ========================================
            # [Volume Mount]
            # ========================================

            # ConfigMap의 Alloy 설정을 → 컨테이너 내부 /etc/alloy에 연결
            - name: config
              mountPath: /etc/alloy
              readOnly: true

            # node exporter → Node의 프로세스/커널 정보를 수집하기 위해 사용
            - name: proc
              mountPath: /host/proc
              readOnly: true

            # Node의 /sys를 컨테이너에 연결 → Node 정보 및 cgroup 정보 수집에 사용
            - name: sys
              mountPath: /sys
              readOnly: true
              mountPropagation: HostToContainer

            # Node의 전체 파일시스템(/)을 → 컨테이너의 /rootfs에 연결
            #   - 파일시스템 사용량 등의 메트릭 수집에 사용
            - name: rootfs
              mountPath: /rootfs
              readOnly: true
              mountPropagation: HostToContainer
            
            # 컨테이너 메타데이터 / 상태 수집에 사용
            - name: containerd-sock
              mountPath: /run/containerd/containerd.sock
              readOnly: true

      # ===========================================
      # [Volume 정의]
      #   - 위 volumeMounts에서 사용한 Volume의 실제 원본을 정의한다.
      # ===========================================
      volumes:
        - name: config
          configMap:
            name: alloy-config
        - name: proc
          hostPath:
            path: /proc
        - name: sys
          hostPath:
            path: /sys
        - name: rootfs
          hostPath:
            path: /
        - name: containerd-sock
          hostPath:
            path: /run/containerd/containerd.sock
            type: Socket
