# ===============================================
# [Prometheus Deployment PVC]
# → Deployment 는 PVC 를 스스로 만들지 못해 별도 오브젝트로 선언한다.
# ===============================================
apiVersion: v1
kind: PersistentVolumeClaim # 쿠버네티스 PVC 리소스
metadata:
  name: prometheus-data
  namespace: {{ .Values.global.namespace }}
  labels:
    app: prometheus
    app.kubernetes.io/name: prometheus
    app.kubernetes.io/part-of: data-layer
spec:
  accessModes: ["ReadWriteOnce"] # RWO → 하나의 Node 에서 볼륨을 읽고 쓰기 가능
  storageClassName: {{ .Values.prometheus.storageClass }} # 사용할 StorageClass
  resources:
    requests:
      storage: {{ .Values.prometheus.storageSize }} # 요청할 저장공간 크기
