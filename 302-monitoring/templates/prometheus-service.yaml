# ===============================================
# [Prometheus Deployment Service]
#   - Prometheus Pod에 접근하기 위한 "내부 네트워크 엔드포인트" → ClusterIP 
#
# → 외부 접근은 Ingress가 담당
# ===============================================
apiVersion: v1
kind: Service # 쿠버네티스 서비스 리소스
metadata:
  name: prometheus
  namespace: {{ .Values.global.namespace }}
  labels:
    app: prometheus
    app.kubernetes.io/name: prometheus
    app.kubernetes.io/part-of: data-layer
spec:
  type: ClusterIP # 클러스터 내부에서만 접근 가능
  selector:
    app: prometheus # app=prometheus Pod를 백엔드로 연결
  ports:
    - name: http # Service 포트 이름
      port: {{ .Values.prometheus.port }} # Service가 노출할 포트
      targetPort: http # Pod의 http 포트로 전달
