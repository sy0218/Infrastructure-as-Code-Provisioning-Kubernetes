# ===============================================
# [Prometheus Service — 내부 질의 + 외부 디버깅 UI]
#
# 내부: Grafana 데이터소스가 부르는 이름(prometheus:{{ .Values.prometheus.port }}).
# 외부: 사람이 직접 보는 경로는 Ingress 가 맡는다 → 여기는 ClusterIP 로 충분하다.
#
# [주의] 인증이 없다 — 전체 경고는 prometheus-ingress.yaml 참조.
# ===============================================
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: {{ .Values.global.namespace }}
  labels:
    app: prometheus
    app.kubernetes.io/name: prometheus
    app.kubernetes.io/part-of: data-layer
spec:
  type: ClusterIP
  selector:
    app: prometheus
  ports:
    - name: http
      port: {{ .Values.prometheus.port }}
      targetPort: http
