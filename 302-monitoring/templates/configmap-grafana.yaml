# ===============================================
# [Grafana Deployment ConfigMap]
# ===============================================
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasource
  namespace: {{ .Values.global.namespace }}
  labels:
    app: grafana
    app.kubernetes.io/name: grafana
    app.kubernetes.io/part-of: data-layer
data:
  datasource.yml: |
    apiVersion: 1

    datasources:
      - name: prometheus
        uid: data-layer-prometheus
        type: prometheus
        # access: proxy 라서 이 URL 을 해소하는 주체는 브라우저가 아니라 grafana 파드다
        # → 클러스터 내부 Service FQDN 이 맞다(브라우저는 Ingress 로만 grafana 에 닿는다).
        # FQDN 전체를 적는 이유: ndots:5 때문에 짧은 이름은 search 도메인을 순회하며 헛질의를 만든다.
        access: proxy
        url: http://prometheus.{{ .Values.global.namespace }}.svc.cluster.local:{{ .Values.prometheus.port }}
        isDefault: true
        editable: true
