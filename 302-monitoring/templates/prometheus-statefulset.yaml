# ===============================================
# [Prometheus StatefulSet — 단일 인스턴스]
#
# Deployment 가 아닌 이유: 롤링이 새 파드를 먼저 띄우면 같은 PVC 를 두 파드가
# 잡으려다 "lock DB directory" 로 죽는다. STS 는 항상 '종료 후 생성'이라 충돌이 없다.
# ===============================================
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: prometheus
  namespace: {{ .Values.global.namespace }}
  labels:
    app: prometheus
    app.kubernetes.io/name: prometheus
    app.kubernetes.io/part-of: data-layer
spec:
  # 파드별 DNS 레코드를 쓸 일이 없어 headless 없이 ClusterIP Service 를 governing service 로 쓴다
  serviceName: prometheus
  replicas: 1
  selector:
    matchLabels:
      app: prometheus
  template:
    metadata:
      labels:
        app: prometheus
        app.kubernetes.io/name: prometheus
        app.kubernetes.io/part-of: data-layer
      annotations:
        # ConfigMap 만 바뀌면 파드는 다시 만들어지지 않고 Prometheus 도 파일을 다시 읽지 않는다.
        # 설정 해시를 심어 두면 설정 변경이 곧 롤아웃이 된다(helm upgrade 만으로 반영).
        checksum/config: {{ include (print $.Template.BasePath "/prometheus-config.yaml") . | sha256sum | quote }}
    spec:
      # Service env 자동 주입 차단 — 근거는 CLAUDE.md '쿠버네티스 규약'
      enableServiceLinks: false

      # serviceAccountName 없음 → default SA. kubernetes_sd 에 필요한 API 권한은
      # 300-data-layer-base 의 ClusterRoleBinding 이 이미 주고 있다.
      # nodeSelector 없음 → 노드를 고정하면 longhorn 으로 얻은 재스케줄 이득이 사라진다.
      securityContext:
        # prom/prometheus 는 nobody(65534)로 돌고 새 Longhorn 볼륨은 root 소유다 —
        # fsGroup 없이는 첫 기동에서 /prometheus 에 쓰지 못해 바로 죽는다.
        fsGroup: 65534
      containers:
        - name: prometheus
          image: {{ .Values.global.harborRegistry }}/data-layer/prometheus:{{ .Values.imageTag }}
          imagePullPolicy: IfNotPresent
          args:
            - --config.file=/etc/prometheus/prometheus.yml
            - --storage.tsdb.path=/prometheus
            - --storage.tsdb.retention.time={{ .Values.prometheus.retention }}
            # 재기동 없이 설정을 다시 읽는 스위치 (reload 명령은 README '일상 운영' 참조)
            - --web.enable-lifecycle
          ports:
            - name: http
              containerPort: {{ .Values.prometheus.port }}
          # envFrom 을 붙이지 않는다 — 설정은 전부 ConfigMap 에서 오고,
          # 쓰지 않을 DB/S3 자격증명을 프로세스 환경에 넣을 이유가 없다.
          resources:
            requests:
              cpu: "250m"
              memory: "1Gi"
          # readiness 와 liveness 를 다른 엔드포인트로 나눈다: WAL 리플레이 중에는
          # healthy 지만 ready 가 아니다. /-/healthy 로 readiness 를 잡으면 아직 답 못하는
          # 파드가 endpoint 에 올라 Grafana 가 빈 그래프를 그린다.
          readinessProbe:
            httpGet:
              path: /-/ready
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /-/healthy
              port: http
            # WAL 이 크면 리플레이가 수 분 걸린다 — 짧게 잡으면 복구 중인 파드를 계속 죽인다
            initialDelaySeconds: 60
            periodSeconds: 15
            failureThreshold: 6
          volumeMounts:
            - name: config
              mountPath: /etc/prometheus
              readOnly: true
            - name: data
              mountPath: /prometheus
      # 종료 시 인메모리 헤드 블록을 디스크로 내리는 시간. 부족하면 다음 기동이 WAL 리플레이로 시작한다.
      terminationGracePeriodSeconds: 60
      volumes:
        - name: config
          configMap:
            name: prometheus-config
  volumeClaimTemplates:
    - metadata:
        name: data
        labels:
          app.kubernetes.io/part-of: data-layer
      spec:
        accessModes: ["ReadWriteOnce"]
        # 인스턴스가 하나뿐이라 볼륨이 파드를 따라 옮겨가는 것이 유일한 생존 수단이다 →
        # longhorn. local-path 면 노드가 죽는 순간 보존기간치 메트릭이 그 노드에 갇힌다.
        storageClassName: {{ .Values.prometheus.storageClass }}
        resources:
          requests:
            storage: {{ .Values.prometheus.storageSize }}
