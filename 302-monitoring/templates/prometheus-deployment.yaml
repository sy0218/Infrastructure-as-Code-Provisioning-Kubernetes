# ===============================================
# [Prometheus Deployment]
#
# - 단일 Pod + RWO PVC 사용
# - Recreate: 기존 Pod 종료 후 새 Pod 생성
#   → 두 파드가 같은 TSDB 를 열어 "lock DB directory" 로 죽는 것을 막는다
# ===============================================
apiVersion: apps/v1
kind: Deployment # 쿠버네티스 디플로이먼트 리소스 생성
metadata:
  name: prometheus
  namespace: {{ .Values.global.namespace }}
  labels:
    app: prometheus
    app.kubernetes.io/name: prometheus
    app.kubernetes.io/part-of: data-layer
spec:
  replicas: 1

  # RWO PVC를 사용하는 단일 인스턴스이므로 → RWO = 하나의 노드에서 읽기/쓰기
  # 배포 전략 → 기존 Pod를 먼저 종료한 후 새 Pod를 생성한다.
  strategy:
    type: Recreate

  selector: # 쿠버네티스 리소스가(여기선 디플로이먼트) 관리할 Pod를 찾는 조건 → 레이블 기반 ( app: prometheus )
    matchLabels:
      app: prometheus

  template: # 파드를 생성하는 설계도
    metadata:
      annotations:
        # prometheus-config 가 같은 릴리스라 해시를 계산할 수 있다
        # → 설정이 바뀌면 helm upgrade 만으로 롤아웃된다(수동 rollout restart 불필요).
        checksum/config: {{ include (print $.Template.BasePath "/configmap-prometheus.yaml") . | sha256sum }}
      labels:
        app: prometheus
        app.kubernetes.io/name: prometheus
        app.kubernetes.io/part-of: data-layer

    spec:
      # 노드 후보
      {{- with .Values.prometheus.nodeNames }}
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: In
                    values:
                      {{- toYaml . | nindent 22 }}
      {{- end }}

      # Service env 자동 주입 차단
      enableServiceLinks: false

      securityContext:
        # [주의] prom/prometheus 는 nobody(65534)로 돌고 새 Longhorn 볼륨은 root 소유다
        # → fsGroup 없이는 첫 기동에서 /prometheus 에 쓰지 못해 바로 죽는다.
        fsGroup: 65534

      containers:
        - name: prometheus
          image: {{ .Values.global.harborRegistry }}/data-layer/prometheus:{{ .Values.global.imageTag }}
          imagePullPolicy: IfNotPresent
          args:
            - --config.file=/etc/prometheus/prometheus.yml
            - --storage.tsdb.path=/prometheus
            - --storage.tsdb.retention.time={{ .Values.prometheus.retention }}
            # 재기동 없이 설정을 다시 읽는 스위치
            - --web.enable-lifecycle
          ports:
            - name: http
              containerPort: {{ .Values.prometheus.port }}

          resources:
            requests:
              cpu: "100m"
              memory: "512Mi"

          readinessProbe:
            httpGet:
              path: /-/ready
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 6

          livenessProbe:
            httpGet:
              path: /-/healthy
              port: http
            initialDelaySeconds: 60
            periodSeconds: 60
            failureThreshold: 6
          volumeMounts:
            # [설정 변경 반영] prometheus.yml ConfigMap 은 이 차트가 소유한다.
            # 같은 릴리스라 checksum/config 로 자동 롤아웃된다 → helm upgrade 만으로 반영.
            - name: config
              mountPath: /etc/prometheus
              readOnly: true

            - name: data
              mountPath: /prometheus

      # 정상 종료 및 데이터 반영을 위해 최대 120초 대기
      terminationGracePeriodSeconds: 120

      volumes:
        - name: config
          configMap:
            name: prometheus-config
        - name: data
          persistentVolumeClaim:
            claimName: prometheus-data
