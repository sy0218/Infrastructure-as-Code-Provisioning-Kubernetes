# ===============================================
# [Grafana Deployment]
#
# - 단일 Pod + RWO PVC 사용
# - Recreate: 기존 Pod 종료 후 새 Pod 생성
#   → RollingUpdate 시 RWO 볼륨 Multi-Attach 방지
# ===============================================

apiVersion: apps/v1
kind: Deployment

metadata:
  name: grafana
  namespace: {{ .Values.global.namespace }}
  labels:
    app: grafana
    app.kubernetes.io/name: grafana
    app.kubernetes.io/part-of: data-layer

spec:
  replicas: 1

  # RWO PVC를 사용하는 단일 인스턴스이므로
  # 기존 Pod를 먼저 종료한 후 새 Pod를 생성한다.
  strategy:
    type: Recreate

  selector:
    matchLabels:
      app: grafana

  template:
    metadata:
      annotations:
        # 데이터소스 ConfigMap 이 같은 릴리스라 해시를 계산할 수 있다
        # → 값이 바뀌면 helm upgrade 만으로 롤아웃된다(수동 rollout restart 불필요).
        checksum/datasource: {{ include (print $.Template.BasePath "/configmap-grafana.yaml") . | sha256sum }}
      labels:
        app: grafana
        app.kubernetes.io/name: grafana
        app.kubernetes.io/part-of: data-layer

    spec:
      # 노드 후보
      {{- with .Values.grafana.nodeNames }}
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: In
                    values:
                      {{- toYaml . | nindent 22 }}
      {{- end }}

      # Kubernetes Service 환경변수 자동 주입 비활성화
      enableServiceLinks: false

      securityContext:
        # Grafana(uid 472)가 PVC에 데이터를 쓸 수 있도록 권한 설정
        fsGroup: 472

      containers:
        - name: grafana
          image: {{ .Values.global.harborRegistry }}/data-layer/grafana:{{ .Values.global.imageTag }}
          imagePullPolicy: IfNotPresent

          # 공용 ConfigMap / Secret에서 Grafana 환경변수 주입
          envFrom:
            - configMapRef:
                name: data-layer-env
            - secretRef:
                name: data-layer-secrets

          ports:
            - name: http
              containerPort: {{ .Values.grafana.port }}

          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"

          # HTTP 응답 가능 여부 확인 → 트래픽 수신 시작
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 60
            failureThreshold: 6

          # 프로세스가 정상 동작하는지 확인 → 비정상 시 재시작
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 60
            periodSeconds: 60
            failureThreshold: 6

          volumeMounts:
            - name: data
              mountPath: /var/lib/grafana

            # datasources 디렉토리만 덮는다 → dashboards 는 이미지에 구운 것이 그대로 남는다.
            - name: datasource
              mountPath: /etc/grafana/provisioning/datasources
              readOnly: true

      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: grafana-data

        - name: datasource
          configMap:
            name: grafana-datasource