# ===============================================
# [Grafana Deployment]
#
# Recreate 전략 고정: RWO 볼륨이라 RollingUpdate 로 새 파드를 먼저 띄우면 그 파드가
# 다른 노드로 가는 순간 Multi-Attach 로 무한 대기한다(단일 인스턴스라 무중단이 목표도 아니다).
# ===============================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: {{ .Values.global.namespace }}
  labels:
    app: grafana
    app.kubernetes.io/name: grafana
    app.kubernetes.io/part-of: data-layer
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: grafana
  template:
    metadata:
      labels:
        app: grafana
        app.kubernetes.io/name: grafana
        app.kubernetes.io/part-of: data-layer
    spec:
      # Service env 자동 주입 차단 — 근거는 CLAUDE.md '쿠버네티스 규약'
      enableServiceLinks: false

      securityContext:
        # grafana 이미지는 uid/gid 472 로 돌고 새 Longhorn 볼륨은 root 소유다 —
        # fsGroup 없이는 grafana.db 를 못 만들고 죽는다.
        fsGroup: 472
      containers:
        - name: grafana
          image: {{ .Values.global.harborRegistry }}/data-layer/grafana:{{ .Values.imageTag }}
          imagePullPolicy: IfNotPresent
          # GF_* env(관리자 계정 + 익명 열람/임베드)는 전부 300-data-layer-base 의 공용
          # ConfigMap/Secret 에서 온다 — 계정/권한 조정도 300 에서 한다.
          envFrom:
            - configMapRef:
                name: data-layer-env
            - secretRef:
                name: data-layer-secrets
          ports:
            - name: http
              containerPort: {{ .Values.grafana.port }}
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 60
            periodSeconds: 15
            failureThreshold: 6
          volumeMounts:
            - name: data
              mountPath: /var/lib/grafana
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: grafana-data
