# ===============================================
# [Grafana Ingress]
#
# - 브라우저 → Ingress → Grafana Service로 전달
# - Host 기반 라우팅 사용
# - 외부 접근은 Ingress VIP를 통해 처리
# ===============================================

apiVersion: networking.k8s.io/v1
kind: Ingress

metadata:
  name: grafana
  namespace: {{ .Values.global.namespace }}
  labels:
    app: grafana
    app.kubernetes.io/name: grafana
    app.kubernetes.io/part-of: data-layer

spec:
  # 사용할 Ingress Controller 지정
  ingressClassName: {{ .Values.global.ingressClassName }}

  rules:
    # 요청 Host에 따라 Grafana Service로 라우팅
    - host: {{ .Values.global.hosts.grafana }}
      http:
        paths:
          - path: /
            pathType: Prefix

            # Ingress → Grafana Service
            backend:
              service:
                name: grafana
                port:
                  number: {{ .Values.grafana.port }}