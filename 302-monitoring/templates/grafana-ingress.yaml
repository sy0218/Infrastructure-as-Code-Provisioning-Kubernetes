# ===============================================
# [Grafana — 브라우저 진입점]
#
# 관리 화면의 iframe 도 '브라우저가' 이 주소를 연다 — 보는 사람의 PC 에서
# 이름이 VIP 로 풀려야 화면이 뜬다.
# 호스트 기반이라 Grafana 는 자기가 루트에 있다고 믿어도 된다(경로 기반이었다면
# GF_SERVER_SERVE_FROM_SUB_PATH 까지 켜야 한다).
# ===============================================
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: grafana
  namespace: {{ .Values.global.namespace }}
  labels:
    app: grafana
    app.kubernetes.io/name: grafana
    app.kubernetes.io/part-of: data-layer
spec:
  # 클래스를 빠뜨리면 어떤 컨트롤러도 집어 가지 않고 조용히 404 가 된다
  ingressClassName: nginx
  rules:
    - host: {{ .Values.grafana.host }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: grafana
                port:
                  number: {{ .Values.grafana.port }}
