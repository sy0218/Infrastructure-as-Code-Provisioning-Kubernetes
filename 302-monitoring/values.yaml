# ===============================================
# [values.yaml → 302-monitoring 이 소유하는 값만]
#
# 공통값(global.*)은 → 저장소 루트 values.common.yaml 에 정의합니다.
#   helm install monitoring ./302-monitoring -f values.common.yaml -n data-layer
#
# Ingress 호스트는 global.hosts 에 있다(300 이 GRAFANA_URL·GF_SERVER_ROOT_URL 조립에 같은 값을 쓴다).
#
# - Alloy      → 서버/컨테이너 메트릭 수집
# - Prometheus → 메트릭 저장
# - Grafana    → 메트릭을 화면으로 보여줌
# ===============================================


# ===============================================
# [Alloy]
# - 각 Kubernetes 노드에 1개씩 실행된다. (데몬셋)
# - 노드와 컨테이너의 메트릭을 수집해서 노출한다.
# - Prometheus가 Alloy에서 메트릭을 가져간다.
# ===============================================
alloy:
  # Alloy가 사용하는 포트 (hostNetwork → 노드 포트)
  port: 12345


# ===============================================
# [Prometheus]
#   - Alloy, PostgreSQL, Kafka 등의 메트릭을 수집한다.
#   - 수집한 메트릭을 저장하고 Grafana에 제공한다.
# ===============================================
prometheus:
  # 메트릭 보관 기간
  retention: "30d"

  # Prometheus 데이터 저장공간
  storageSize: "20Gi"
  storageClass: "longhorn"

  # Prometheus 포트
  port: 9090

  # 파드를 배치할 노드 이름 (nodeAffinity 로 지정된다)
  nodeNames: ["s1"]

# ===============================================
# [Grafana]
#   - Prometheus가 저장한 메트릭을 그래프로 보여준다.
#   - 브라우저에서 접속해서 모니터링 화면을 확인한다.
# ===============================================
grafana:
  # Grafana 데이터 저장공간
  storageSize: "5Gi"
  storageClass: "longhorn"

  # Grafana 포트
  port: 3000

  # 파드를 배치할 노드 이름 (nodeAffinity 로 지정된다)
  nodeNames: ["s2"]