# ===============================================
# [Hadoop StorageClass → Static Local PV]
#
# - 기존에 생성한 Local PV를 사용하며, PV를 동적으로 생성하지 않음
# - WaitForFirstConsumer: Pod 스케줄링 후 Node에 맞는 PV를 바인딩
# - Retain: PVC 삭제 후에도 PV와 데이터 유지
#
# Local PV는 nodeAffinity로 특정 Node에 고정
# → 해당 Node의 로컬 디스크에서만 사용
# ===============================================
apiVersion: storage.k8s.io/v1
kind: StorageClass

metadata:
  name: {{ .Values.hadoop.storageClass }}
  labels:
    app.kubernetes.io/part-of: data-layer

# 동적 PV 생성 없이 기존 Static PV 사용
provisioner: kubernetes.io/no-provisioner

# Pod의 Node 배치에 맞춰 PV 바인딩
volumeBindingMode: WaitForFirstConsumer

# PVC 삭제 후에도 PV와 데이터 유지
reclaimPolicy: Retain