# ===============================================
# [HDFS HA → StatefulSet 4종 + ZKFC]
#
# ZooKeeper ×3  → HA 상태 / 쿼럼 관리
# JournalNode ×3 → NameNode EditLog 공유
# NameNode ×2   → Active / Standby
# DataNode ×3   → HDFS 데이터 블록 저장
#
# - hostNetwork → Node IP로 직접 통신
# - StatefulSet + Local PV → Pod와 디스크를 Node에 고정
# - 설정 파일은 Pod 기동 시 생성
# - OnDelete → 설정 변경 후 수동 재기동
# ===============================================

{{/* Node 이름에 해당하는 IP 조회 */}}
{{- define "hadoop.nodeIp" -}}
{{- $ip := "" -}}
{{- range .root.Values.global.nodes -}}{{- if eq .name $.name -}}{{- $ip = .ip -}}{{- end -}}{{- end -}}
{{- required (printf "global.nodes 에 노드 %q 가 없다" .name) $ip -}}
{{- end -}}

{{/* 지정 Node들의 IP:Port 목록 생성 */}}
{{- define "hadoop.addrList" -}}
{{- $l := list -}}
{{- range (index .root.Values.global.hadoop .comp).nodeNames -}}
{{- $l = append $l (printf "%s:%d" (include "hadoop.nodeIp" (dict "root" $.root "name" .)) (int $.port)) -}}
{{- end -}}
{{- join .sep $l -}}
{{- end -}}

{{/* core-site.xml 설정 생성 */}}
{{- define "hadoop.coreSite" -}}
fs.defaultFS=hdfs://{{ .Values.global.hadoop.nameservice }}
ha.zookeeper.quorum={{ include "hadoop.addrList" (dict "root" . "comp" "zookeeper" "port" .Values.global.hadoop.ports.zookeeperClient "sep" ",") }}
hadoop.prometheus.endpoint.enabled=true
{{- end -}}

{{/* hdfs-site.xml 설정 생성 */}}
{{- define "hadoop.hdfsSite" -}}
{{- $ns := .Values.global.hadoop.nameservice -}}
{{- $p := .Values.global.hadoop.ports -}}
{{- $ids := list -}}
{{- range $i, $n := .Values.global.hadoop.namenode.nodeNames }}{{ $ids = append $ids (printf "nn%d" $i) }}{{ end -}}
dfs.nameservices={{ $ns }}
dfs.ha.namenodes.{{ $ns }}={{ join "," $ids }}
{{- range $i, $n := .Values.global.hadoop.namenode.nodeNames }}
{{- $ip := include "hadoop.nodeIp" (dict "root" $ "name" $n) }}
dfs.namenode.rpc-address.{{ $ns }}.nn{{ $i }}={{ $ip }}:{{ int $p.namenodeRpc }}
dfs.namenode.http-address.{{ $ns }}.nn{{ $i }}={{ $ip }}:{{ int $p.namenodeHttp }}
{{- end }}
dfs.namenode.name.dir={{ .Values.hadoop.namenode.path }}
dfs.namenode.shared.edits.dir=qjournal://{{ include "hadoop.addrList" (dict "root" . "comp" "journalnode" "port" $p.journalnodeRpc "sep" ";") }}/{{ $ns }}
dfs.journalnode.edits.dir={{ .Values.hadoop.journalnode.path }}
dfs.journalnode.rpc-address=0.0.0.0:{{ int $p.journalnodeRpc }}
dfs.journalnode.http-address=0.0.0.0:{{ int $p.journalnodeHttp }}
dfs.client.failover.proxy.provider.{{ $ns }}=org.apache.hadoop.hdfs.server.namenode.ha.ConfiguredFailoverProxyProvider
dfs.ha.automatic-failover.enabled=true
dfs.ha.zkfc.port={{ int $p.zkfc }}
dfs.ha.fencing.methods=shell(/bin/true)
dfs.ha.tail-edits.in-progress=true
dfs.datanode.data.dir={{ .Values.hadoop.datanode.path }}
dfs.datanode.data.dir.perm=770
dfs.datanode.address=0.0.0.0:{{ int $p.datanodeData }}
dfs.datanode.ipc.address=0.0.0.0:{{ int $p.datanodeIpc }}
dfs.datanode.http.address=0.0.0.0:{{ int $p.datanodeHttp }}
dfs.replication={{ int .Values.hadoop.replication }}
dfs.namenode.datanode.registration.ip-hostname-check=false
{{- end -}}

{{/*
기동 스크립트 공통부 — key=value 설정을 Hadoop XML로 변환
- Hadoop 설정을 Pod 기동 시 XML로 생성
*/}}
{{- define "hadoop.writeConf" -}}
write_site() {
  {
    echo '<?xml version="1.0" encoding="UTF-8"?>'
    echo '<configuration>'
    printf '%s\n' "$2" | sed 's/^[[:space:]]*//' | while IFS='=' read -r k v; do
      [ -n "$k" ] || continue
      printf '  <property><name>%s</name><value>%s</value></property>\n' "$k" "$v"
    done
    echo '</configuration>'
  } > "${HADOOP_CONF_DIR}/$1"
}
write_site core-site.xml "
{{ include "hadoop.coreSite" . }}
"
write_site hdfs-site.xml "
{{ include "hadoop.hdfsSite" . }}
${HDFS_SITE_EXTRA:-}
"
echo "== ${POD_NAME} extra=[${HDFS_SITE_EXTRA:-}] conf=${HADOOP_CONF_DIR} =="
{{- end -}}

{{- $name := .Values.global.hadoop.name }}
{{- $ports := .Values.global.hadoop.ports }}
{{- $image := printf "%s/data-layer/%s:%s" .Values.global.harborRegistry .Values.hadoop.imageName .Values.global.imageTag }}

# ===============================================
# [ZooKeeper]
#
# - 3개 노드로 쿼럼 구성
# - StatefulSet으로 Pod와 데이터 디스크 유지
# ===============================================
---
apiVersion: apps/v1
kind: StatefulSet

metadata:
  name: {{ $name }}-zookeeper
  namespace: {{ .Values.global.namespace }}
  labels:
    app: {{ $name }}-zookeeper
    app.kubernetes.io/name: hadoop
    app.kubernetes.io/component: zookeeper
    app.kubernetes.io/part-of: data-layer

spec:
  # Service 없이 Node IP로 직접 통신
  replicas: {{ len .Values.global.hadoop.zookeeper.nodeNames }}

  # 쿼럼 구성을 위해 동시 기동
  podManagementPolicy: Parallel

  updateStrategy:
    type: OnDelete

  selector:
    matchLabels:
      app: {{ $name }}-zookeeper

  template:
    metadata:
      labels:
        app: {{ $name }}-zookeeper
        app.kubernetes.io/name: hadoop
        app.kubernetes.io/component: zookeeper
        app.kubernetes.io/part-of: data-layer

    spec:
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      enableServiceLinks: false
      terminationGracePeriodSeconds: 30

      securityContext:
        fsGroup: 0
        fsGroupChangePolicy: OnRootMismatch

      # Node당 ZooKeeper 1개 배치
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  app: {{ $name }}-zookeeper
              topologyKey: kubernetes.io/hostname

      containers:
        - name: zookeeper
          image: {{ $image }}
          imagePullPolicy: IfNotPresent

          command:
            - /bin/bash
            - -ec
            - |
              ORD="${POD_NAME##*-}"

              # myid = ordinal + 1 → zoo.cfg의 server.N과 일치
              echo "$((ORD + 1))" > {{ .Values.hadoop.zookeeper.path }}/myid

              cat > "${ZOOCFGDIR}/zoo.cfg" <<'ZOOCFG'
              tickTime=2000
              initLimit=10
              syncLimit=5
              dataDir={{ .Values.hadoop.zookeeper.path }}
              clientPort={{ int $ports.zookeeperClient }}
              autopurge.snapRetainCount=3
              autopurge.purgeInterval=24
              4lw.commands.whitelist=ruok,srvr
              admin.enableServer=false
              metricsProvider.className=org.apache.zookeeper.metrics.prometheus.PrometheusMetricsProvider
              metricsProvider.httpPort={{ int $ports.zookeeperMetrics }}
              {{- range $i, $n := .Values.global.hadoop.zookeeper.nodeNames }}
              server.{{ add1 $i }}={{ include "hadoop.nodeIp" (dict "root" $ "name" $n) }}:{{ int $ports.zookeeperPeer }}:{{ int $ports.zookeeperElection }}
              {{- end }}
              ZOOCFG

              echo "== ${POD_NAME} myid=$((ORD + 1)) =="
              export SERVER_JVMFLAGS="-Xms{{ .Values.hadoop.zookeeper.heap }} -Xmx{{ .Values.hadoop.zookeeper.heap }}"
              exec zkServer.sh start-foreground

          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name

          ports:
            - name: client
              containerPort: {{ int $ports.zookeeperClient }}
            - name: peer
              containerPort: {{ int $ports.zookeeperPeer }}
            - name: election
              containerPort: {{ int $ports.zookeeperElection }}
            - name: metrics
              containerPort: {{ int $ports.zookeeperMetrics }}

          volumeMounts:
            - name: data
              mountPath: {{ .Values.hadoop.zookeeper.path }}

          resources:
            {{- toYaml .Values.hadoop.zookeeper.resources | nindent 12 }}

          # 쿼럼에 합류해야 Ready
          readinessProbe:
            exec:
              command:
                - /bin/bash
                - -c
                - 'exec 3<>/dev/tcp/127.0.0.1/{{ int $ports.zookeeperClient }}; echo srvr >&3; grep -qE "^Mode: (leader|follower)" <&3'
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 6

          livenessProbe:
            exec:
              command:
                - /bin/bash
                - -c
                - 'exec 3<>/dev/tcp/127.0.0.1/{{ int $ports.zookeeperClient }}; echo ruok >&3; grep -q imok <&3'
            initialDelaySeconds: 30
            periodSeconds: 30
            failureThreshold: 5

  # Local PV는 지정 Node에 고정
  volumeClaimTemplates:
    - metadata:
        name: data
        labels:
          app.kubernetes.io/part-of: data-layer
          app.kubernetes.io/name: hadoop  # Hadoop PVC 식별용 라벨
      spec:
        accessModes: [ReadWriteOnce]
        storageClassName: {{ .Values.hadoop.storageClass }}
        resources:
          requests:
            storage: {{ .Values.hadoop.zookeeper.size }}


# ===============================================
# [JournalNode]
#
# - 3개 노드로 EditLog 공유
# - StatefulSet으로 EditLog 디스크 유지
# ===============================================
---
apiVersion: apps/v1
kind: StatefulSet

metadata:
  name: {{ $name }}-journalnode
  namespace: {{ .Values.global.namespace }}
  labels:
    app: {{ $name }}-journalnode
    app.kubernetes.io/name: hadoop
    app.kubernetes.io/component: journalnode
    app.kubernetes.io/part-of: data-layer

spec:
  replicas: {{ len .Values.global.hadoop.journalnode.nodeNames }}

  # 쿼럼 구성을 위해 동시 기동
  podManagementPolicy: Parallel

  updateStrategy:
    type: OnDelete

  selector:
    matchLabels:
      app: {{ $name }}-journalnode

  template:
    metadata:
      labels:
        app: {{ $name }}-journalnode
        app.kubernetes.io/name: hadoop
        app.kubernetes.io/component: journalnode
        app.kubernetes.io/part-of: data-layer

    spec:
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      enableServiceLinks: false
      terminationGracePeriodSeconds: {{ .Values.hadoop.terminationGracePeriodSeconds }}

      securityContext:
        fsGroup: 0
        fsGroupChangePolicy: OnRootMismatch

      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  app: {{ $name }}-journalnode
              topologyKey: kubernetes.io/hostname

      containers:
        - name: journalnode
          image: {{ $image }}
          imagePullPolicy: IfNotPresent

          command:
            - /bin/bash
            - -ec
            - |
              {{- include "hadoop.writeConf" $ | nindent 14 }}

              export HDFS_JOURNALNODE_OPTS="-Xms{{ .Values.hadoop.journalnode.heap }} -Xmx{{ .Values.hadoop.journalnode.heap }}"
              exec hdfs journalnode

          ports:
            - name: rpc
              containerPort: {{ int $ports.journalnodeRpc }}
            - name: http
              containerPort: {{ int $ports.journalnodeHttp }}

          volumeMounts:
            - name: data
              mountPath: {{ .Values.hadoop.journalnode.path }}

          resources:
            {{- toYaml .Values.hadoop.journalnode.resources | nindent 12 }}

          readinessProbe:
            tcpSocket:
              port: rpc
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 6

          livenessProbe:
            tcpSocket:
              port: rpc
            initialDelaySeconds: 60
            periodSeconds: 30
            failureThreshold: 5

  volumeClaimTemplates:
    - metadata:
        name: data
        labels:
          app.kubernetes.io/part-of: data-layer
          app.kubernetes.io/name: hadoop
      spec:
        accessModes: [ReadWriteOnce]
        storageClassName: {{ .Values.hadoop.storageClass }}
        resources:
          requests:
            storage: {{ .Values.hadoop.journalnode.size }}


# ===============================================
# [NameNode + ZKFC]
#
# - NameNode 2개 → Active / Standby
# - ZKFC → ZooKeeper 기반 자동 Failover
# - StatefulSet으로 NameNode 메타데이터 유지
#
# 최초 구성
# - nn0 → 필요 시 최초 Format
# - nn1 → nn0의 메타데이터를 Bootstrap
# ===============================================
---
apiVersion: apps/v1
kind: StatefulSet

metadata:
  name: {{ $name }}-namenode
  namespace: {{ .Values.global.namespace }}
  labels:
    app: {{ $name }}-namenode
    app.kubernetes.io/name: hadoop
    app.kubernetes.io/component: namenode
    app.kubernetes.io/part-of: data-layer

spec:
  replicas: {{ len .Values.global.hadoop.namenode.nodeNames }}

  # nn1은 스크립트에서 nn0을 확인하므로 순서 강제 불필요
  podManagementPolicy: Parallel

  updateStrategy:
    type: OnDelete

  selector:
    matchLabels:
      app: {{ $name }}-namenode

  template:
    metadata:
      labels:
        app: {{ $name }}-namenode
        app.kubernetes.io/name: hadoop
        app.kubernetes.io/component: namenode
        app.kubernetes.io/part-of: data-layer

    spec:
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      enableServiceLinks: false
      terminationGracePeriodSeconds: {{ .Values.hadoop.terminationGracePeriodSeconds }}

      securityContext:
        fsGroup: 0
        fsGroupChangePolicy: OnRootMismatch

      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  app: {{ $name }}-namenode
              topologyKey: kubernetes.io/hostname

      containers:
        - name: namenode
          image: {{ $image }}
          imagePullPolicy: IfNotPresent

          command:
            - /bin/bash
            - -ec
            - |
              ORD="${POD_NAME##*-}"
              HDFS_SITE_EXTRA="dfs.ha.namenode.id=nn${ORD}"
              {{- include "hadoop.writeConf" $ | nindent 14 }}

              export HDFS_NAMENODE_OPTS="-Xms{{ .Values.hadoop.namenode.heap }} -Xmx{{ .Values.hadoop.namenode.heap }}"
              NAME_DIR={{ .Values.hadoop.namenode.path }}

              # 상대 NameNode의 메타데이터를 Bootstrap
              bootstrap() {
                hdfs namenode -bootstrapStandby -nonInteractive && return 0
                rm -rf "${NAME_DIR}/current" "${NAME_DIR}/in_use.lock"; return 1
              }

              # Bootstrap 잔재가 있으면 정리
              if ! ls "${NAME_DIR}"/current/fsimage_* >/dev/null 2>&1; then
                rm -rf "${NAME_DIR}/current" "${NAME_DIR}/in_use.lock"
                if [ "${ORD}" -eq 0 ]; then
                  # nn0: Bootstrap 실패 시 JournalNode 확인 후 최초 Format
                  if ! bootstrap; then
                    for a in {{ include "hadoop.addrList" (dict "root" $ "comp" "journalnode" "port" $ports.journalnodeRpc "sep" " ") }}; do
                      until timeout 3 bash -c "exec 3<>/dev/tcp/${a%:*}/${a##*:}" 2>/dev/null; do
                        echo "== nn0: waiting JournalNode ${a} before format =="; sleep 5
                      done
                    done
                    # -force 없이 Format하여 기존 EditLog 보호
                    hdfs namenode -format -nonInteractive -clusterid {{ .Values.hadoop.clusterId | quote }}
                  fi
                else
                  until bootstrap; do
                    echo "== nn${ORD}: nn0 not ready, retrying bootstrapStandby =="; sleep 15
                  done
                fi
              fi

              exec hdfs namenode

          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name

          ports:
            - name: rpc
              containerPort: {{ int $ports.namenodeRpc }}
            - name: http
              containerPort: {{ int $ports.namenodeHttp }}

          volumeMounts:
            - name: data
              mountPath: {{ .Values.hadoop.namenode.path }}

          resources:
            {{- toYaml .Values.hadoop.namenode.resources | nindent 12 }}

          # NameNode RPC 준비 대기
          startupProbe:
            tcpSocket:
              port: rpc
            periodSeconds: 10
            failureThreshold: 60

          readinessProbe:
            tcpSocket:
              port: rpc
            periodSeconds: 10
            failureThreshold: 3

          livenessProbe:
            tcpSocket:
              port: rpc
            periodSeconds: 30
            failureThreshold: 5

        # ZKFC → NameNode 상태 감시 및 Failover
        - name: zkfc
          image: {{ $image }}
          imagePullPolicy: IfNotPresent

          command:
            - /bin/bash
            - -ec
            - |
              ORD="${POD_NAME##*-}"
              HDFS_SITE_EXTRA="dfs.ha.namenode.id=nn${ORD}"
              {{- include "hadoop.writeConf" $ | nindent 14 }}

              export HDFS_ZKFC_OPTS="-Xms{{ .Values.hadoop.zkfc.heap }} -Xmx{{ .Values.hadoop.zkfc.heap }}"

              # HA용 ZooKeeper znode 생성
              until hdfs zkfc -formatZK -nonInteractive; do
                rc=$?
                [ "${rc}" -eq 2 ] && break
                echo "== zkfc nn${ORD}: ZooKeeper not ready (rc=${rc}), retrying =="; sleep 5
              done

              exec hdfs zkfc

          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name

          ports:
            - name: zkfc
              containerPort: {{ int $ports.zkfc }}

          resources:
            {{- toYaml .Values.hadoop.zkfc.resources | nindent 12 }}

          readinessProbe:
            tcpSocket:
              port: zkfc
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 6

          livenessProbe:
            tcpSocket:
              port: zkfc
            initialDelaySeconds: 60
            periodSeconds: 30
            failureThreshold: 5

  volumeClaimTemplates:
    - metadata:
        name: data
        labels:
          app.kubernetes.io/part-of: data-layer
          app.kubernetes.io/name: hadoop
      spec:
        accessModes: [ReadWriteOnce]
        storageClassName: {{ .Values.hadoop.storageClass }}
        resources:
          requests:
            storage: {{ .Values.hadoop.namenode.size }}


# ===============================================
# [DataNode]
#
# - HDFS 데이터 블록 저장
# - Local PV로 데이터 디스크를 Node에 고정
# - StatefulSet으로 Pod와 디스크 신원 유지
# ===============================================
---
apiVersion: apps/v1
kind: StatefulSet

metadata:
  name: {{ $name }}-datanode
  namespace: {{ .Values.global.namespace }}
  labels:
    app: {{ $name }}-datanode
    app.kubernetes.io/name: hadoop
    app.kubernetes.io/component: datanode
    app.kubernetes.io/part-of: data-layer

spec:
  replicas: {{ len .Values.global.hadoop.datanode.nodeNames }}

  # DataNode는 독립 구성 → 동시 기동
  podManagementPolicy: Parallel

  updateStrategy:
    type: OnDelete

  selector:
    matchLabels:
      app: {{ $name }}-datanode

  template:
    metadata:
      labels:
        app: {{ $name }}-datanode
        app.kubernetes.io/name: hadoop
        app.kubernetes.io/component: datanode
        app.kubernetes.io/part-of: data-layer

    spec:
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      enableServiceLinks: false
      terminationGracePeriodSeconds: {{ .Values.hadoop.terminationGracePeriodSeconds }}

      securityContext:
        fsGroup: 0
        fsGroupChangePolicy: OnRootMismatch

      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  app: {{ $name }}-datanode
              topologyKey: kubernetes.io/hostname

      containers:
        - name: datanode
          image: {{ $image }}
          imagePullPolicy: IfNotPresent

          command:
            - /bin/bash
            - -ec
            - |
              ORD="${POD_NAME##*-}"

              # Node IP로 DataNode 등록
              HDFS_SITE_EXTRA="dfs.datanode.hostname=${HOST_IP}"
              {{- include "hadoop.writeConf" $ | nindent 14 }}

              export HDFS_DATANODE_OPTS="-Xms{{ .Values.hadoop.datanode.heap }} -Xmx{{ .Values.hadoop.datanode.heap }}"
              exec hdfs datanode

          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name

            - name: HOST_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.hostIP

          ports:
            - name: data
              containerPort: {{ int $ports.datanodeData }}
            - name: ipc
              containerPort: {{ int $ports.datanodeIpc }}
            - name: http
              containerPort: {{ int $ports.datanodeHttp }}

          volumeMounts:
            - name: data
              mountPath: {{ .Values.hadoop.datanode.path }}

          resources:
            {{- toYaml .Values.hadoop.datanode.resources | nindent 12 }}

          readinessProbe:
            tcpSocket:
              port: ipc
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 6

          livenessProbe:
            tcpSocket:
              port: ipc
            initialDelaySeconds: 60
            periodSeconds: 30
            failureThreshold: 5

  volumeClaimTemplates:
    - metadata:
        name: data
        labels:
          app.kubernetes.io/part-of: data-layer
          app.kubernetes.io/name: hadoop
      spec:
        accessModes: [ReadWriteOnce]
        storageClassName: {{ .Values.hadoop.storageClass }}
        resources:
          requests:
            storage: {{ .Values.hadoop.datanode.size }}