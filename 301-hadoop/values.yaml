# ===============================================
# [values.yaml]
# 301-hadoop 전용 설정
# 공통 설정(global.*)은 values.common.yaml에서 관리
# ===============================================


# -----------------------------------------------
# HDFS HA 클러스터
# -----------------------------------------------
# NameNode / DataNode / JournalNode / ZooKeeper 구성
# HDFS HA + 블록 복제로 데이터 내결함성 확보
# Local PV로 Pod와 저장소를 동일 Node에 고정
# NameNode 장애 시 ZKFC가 Standby를 Active로 전환
# OnDelete: 상태 확인 후 운영자가 수동 재기동
# -----------------------------------------------

hadoop:

  # Hadoop 공통 이미지
  imageName: "hadoop"

  # HDFS 데이터 저장용 Local PV StorageClass
  storageClass: "hadoop-local"

  # HDFS 클러스터 식별자
  # 기존 데이터가 있는 상태에서는 변경 금지
  clusterId: "CID-data-layer"

  # DataNode 블록 복제본 수
  replication: 3

  # Pod 정상 종료 대기 시간
  terminationGracePeriodSeconds: 60

  # HDFS 디렉토리 추가 생성 목록
  # hadoop-dirs Job이 mkdir + chown 수행
  # /warehouse는 global.hadoop.warehouse에서 관리
  extraDirs: []

  # 디렉토리 부트스트랩 Job 설정
  dirs: {}

  # 리소스 제한은 현재 미적용
  # 적용 시 스케줄링 여유와 QoS를 함께 확인


  # ---------------------------------------------
  # NameNode
  # ---------------------------------------------
  # HDFS 메타데이터 저장
  namenode:
    path: "/data/hadoop-namenode"
    size: "5Gi"
    heap: "512m"

    # resources:
    #   requests:
    #     cpu: "250m"
    #     memory: "768Mi"


  # ---------------------------------------------
  # ZKFC
  # ---------------------------------------------
  # NameNode 장애 감지 및 Active/Standby 전환
  zkfc:
    heap: "128m"

    # resources:
    #   requests:
    #     cpu: "50m"
    #     memory: "192Mi"


  # ---------------------------------------------
  # JournalNode
  # ---------------------------------------------
  # NameNode HA용 Edit Log 공유
  journalnode:
    path: "/data/hadoop-journalnode"
    size: "5Gi"
    heap: "256m"

    # resources:
    #   requests:
    #     cpu: "100m"
    #     memory: "384Mi"


  # ---------------------------------------------
  # ZooKeeper
  # ---------------------------------------------
  # NameNode HA 상태 관리 및 쿼럼 구성
  zookeeper:
    path: "/data/hadoop-zookeeper"
    size: "5Gi"
    heap: "256m"

    # resources:
    #   requests:
    #     cpu: "100m"
    #     memory: "384Mi"


  # ---------------------------------------------
  # DataNode
  # ---------------------------------------------
  # HDFS 실제 데이터 블록 저장
  datanode:
    path: "/data/hadoop-datanode"
    size: "30Gi"
    heap: "256m"

    # resources:
    #   requests:
    #     cpu: "250m"
    #     memory: "384Mi"