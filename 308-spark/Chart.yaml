# ===================================================
# [308-spark]
#
# Spark 작업 창구(workbench) 차트 — Spark 클러스터는 없다
# - 드라이버는 workbench 파드(kubectl exec) 안에서 돌고,
#   executor 는 잡이 돌 때만 파드로 떴다 사라진다(spark.master k8s:// — 리소스 관리자는 쿠버네티스 자신)
# - 차트가 소유하는 것은 설정 둘(spark-defaults · HDFS 클라이언트)과 workbench 파드 하나
#
# 의존성
# - 300-data-layer-base: Namespace · Secret <clusterName>-app-user(카탈로그 DB 계정) · ClusterRoleBinding(드라이버가 executor 파드를 만든다)
# - 301-hadoop: Iceberg 데이터 파일(hdfs://<nameservice>/warehouse)
# - 303-postgres: Iceberg JDBC 카탈로그(iceberg_catalog DB)
# - 304-airflow-rsync: PySpark 코드 디렉토리(jobs.hostPath)를 후보 노드 전부에 맞춘다
# ===================================================
apiVersion: v2
name: spark
description: "Spark on Kubernetes 작업 창구 → workbench Deployment + spark-defaults·HDFS 클라이언트 ConfigMap (executor 는 잡마다 파드로 생성)"
type: application

# Chart 버전 (업그레이드 시 명시적으로 변경)
version: 0.1.0
