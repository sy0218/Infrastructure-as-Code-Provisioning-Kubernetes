# ===============================================
# [workbench → Deployment]
# - Spark 작업 창구 1개: kubectl exec 로 들어가 spark-sql · pyspark · spark-submit 을 친다
# - 여기서 뜬 드라이버가 K8s API 로 executor 파드를 만들고, 잡이 끝나면 지운다
# - 후보 노드는 values nodeNames(nodeAffinity) — jobs.hostPath 가 그 노드 전부에 있어야 한다
#
# kubectl exec ──▶ workbench(드라이버) ──K8s API──▶ executor 파드 ×N ──▶ HDFS(301) · iceberg_catalog(303)
# ===============================================

# 후보 노드가 global.nodes 에 없으면 Helm 렌더 단계에서 실패 (Pending 으로 조용히 멈추지 않게)
{{- range .Values.nodeNames }}{{ $_ := include "spark.nodeIp" (dict "root" $ "name" .) }}{{ end }}

apiVersion: apps/v1
kind: Deployment

metadata:
  name: spark-workbench
  namespace: {{ .Values.global.namespace }}
  labels:
    app: spark-workbench
    app.kubernetes.io/name: spark
    app.kubernetes.io/component: workbench
    app.kubernetes.io/part-of: data-layer

spec:
  # 작업 창구는 하나면 된다
  replicas: 1

  selector:
    matchLabels:
      app: spark-workbench

  template:
    metadata:
      annotations:
        # 설정 변경 시 helm upgrade 만으로 파드 재생성
        checksum/spark-defaults: {{ include (print $.Template.BasePath "/configmap-spark.yaml") . | sha256sum }}
        checksum/hadoop-config: {{ include (print $.Template.BasePath "/configmap-hadoop.yaml") . | sha256sum }}

      labels:
        app: spark-workbench
        app.kubernetes.io/name: spark
        app.kubernetes.io/component: workbench
        app.kubernetes.io/part-of: data-layer

    spec:
      # 코드 hostPath 가 있는 노드 후보
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: In
                    values:
                      {{- range .Values.nodeNames }}
                      - {{ . | quote }}
                      {{- end }}

      # 불필요한 Service 환경변수 주입 방지
      enableServiceLinks: false

      containers:
        - name: workbench

          image: {{ .Values.global.harborRegistry }}/data-layer/spark:{{ .Values.global.imageTag }}
          imagePullPolicy: IfNotPresent

          # ConfigMap 은 읽기 전용이라 파드마다 다른 값과 DB 계정은 기동 시 사본에 덧붙인다
          # (kubectl exec 세션은 파드 spec 의 env 를 물려받으므로 SPARK_CONF_DIR 가 그 사본을 가리킨다)
          command:
            - /bin/bash
            - -ec
            - |
              mkdir -p "${SPARK_CONF_DIR}"
              cat /etc/spark/spark-defaults.conf - > "${SPARK_CONF_DIR}/spark-defaults.conf" <<EOF
              spark.driver.host                                         ${POD_IP}
              spark.kubernetes.driver.pod.name                          ${POD_NAME}
              spark.sql.catalog.{{ .Values.catalog }}.jdbc.user         ${PG_USER}
              spark.sql.catalog.{{ .Values.catalog }}.jdbc.password     ${PG_PASSWORD}
              EOF
              exec /usr/bin/tini -- sleep infinity

          env:
            # Spark CLI 가 읽는 설정 디렉토리 (기동 시 생성)
            - name: SPARK_CONF_DIR
              value: /tmp/spark-conf

            # HDFS 클라이언트 설정 및 실행 사용자 (307 warehouse 컨슈머와 동일)
            - name: HADOOP_CONF_DIR
              value: /etc/hadoop/conf
            - name: HADOOP_USER_NAME
              value: {{ .Values.global.hadoop.warehouse.user | quote }}

            # 드라이버 주소·파드 이름 → executor 가 드라이버로 돌아오고, 드라이버가 죽으면 executor 도 지워진다(ownerReference)
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name

            # Iceberg JDBC 카탈로그 계정 — 300 이 소유한 CNPG app 계정 Secret 을 번역(305-api 와 같은 패턴)
            - name: PG_USER
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.global.postgres.clusterName }}-app-user
                  key: username
            - name: PG_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.global.postgres.clusterName }}-app-user
                  key: password

          # CPU/메모리 요청은 현재 생략(BestEffort) — executor 는 spark.executor.* 가 파드 requests 가 된다
          # resources:
          #   requests:
          #     cpu: "250m"
          #     memory: "1536Mi"

          volumeMounts:
            # spark-defaults.conf 원본 (기동 시 SPARK_CONF_DIR 로 복사)
            - name: spark-defaults
              mountPath: /etc/spark
              readOnly: true

            # HDFS HA 클라이언트 설정
            - name: hadoop-config
              mountPath: /etc/hadoop/conf
              readOnly: true

            # PySpark 코드
            - name: jobs
              mountPath: {{ .Values.jobs.mountPath | quote }}
              readOnly: true

      volumes:
        - name: spark-defaults
          configMap:
            name: spark-defaults

        - name: hadoop-config
          configMap:
            name: spark-hadoop-config

        # 노드 로컬 코드 디렉토리 — 없는 노드에서는 파드가 뜨지 않는다
        - name: jobs
          hostPath:
            path: {{ .Values.jobs.hostPath | quote }}
            type: Directory
