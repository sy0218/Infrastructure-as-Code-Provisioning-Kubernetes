# ===============================================
# [Kafka → ConfigMap (JMX Exporter Role)]
#
# 브로커 JVM 의 jmx_prometheus_javaagent 가 읽는 config.yaml → /opt/jmx/config/config.yaml 로 마운트된다.
# 활성화·포트는 StatefulSet 의 BROKER_JMX_AGENT 가, 수집 MBean·변환 규칙은 files/jmx-exporter.yaml 이 소유한다.
# 룰 변경: files/jmx-exporter.yaml 수정 → helm upgrade → checksum/kafka-jmx 로 파드 템플릿이 바뀜
#   → OnDelete 라 브로커를 사람이 한 대씩 재기동해야 반영된다.
# ===============================================

apiVersion: v1
kind: ConfigMap

metadata:
  name: {{ .Values.global.kafka.name }}-jmx-exporter
  namespace: {{ .Values.global.namespace }}

  labels:
    app: kafka
    app.kubernetes.io/name: kafka
    app.kubernetes.io/part-of: data-layer

data:
  # ConfigMap의 key(config.yaml)가
  # Pod 내부 /opt/jmx/config/config.yaml 파일로 마운트된다.
  config.yaml: |
    {{- .Files.Get "files/jmx-exporter.yaml" | nindent 4 }}