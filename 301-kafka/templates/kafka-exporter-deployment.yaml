# ===============================================
# [Kafka Exporter → Deployment]
#
# Kafka 토픽, Consumer Group, Offset, Lag 메트릭을
# → Prometheus 형식으로 노출한다.
#
# 브로커 주소는 공용 ConfigMap의 KAFKA_BOOTSTRAP을 사용한다.
# Broker JVM 메트릭은 각 Broker의 JMX Exporter가 담당한다.
# ===============================================

# Bootstrap 주소 변경 시 Pod를 재생성한다.
{{- $configHash := sha256sum (include "kafka.bootstrap" .) }}

apiVersion: apps/v1
kind: Deployment

metadata:
  name: kafka-exporter
  namespace: {{ .Values.global.namespace }}
  labels:
    app: kafka-exporter
    app.kubernetes.io/name: kafka-exporter
    app.kubernetes.io/part-of: data-layer

spec:
  replicas: 1

  selector:
    matchLabels:
      app: kafka-exporter

  template:
    metadata:
      labels:
        app: kafka-exporter
        app.kubernetes.io/name: kafka-exporter
        app.kubernetes.io/part-of: data-layer
      annotations:
        # ConfigMap 변경 시 환경변수 갱신을 위해 Pod 롤아웃
        checksum/kafka-bootstrap: "{{ $configHash }}"

    spec:
      # Kubernetes Service 환경변수 자동 주입 비활성화
      enableServiceLinks: false

      containers:
        - name: kafka-exporter
          image: {{ .Values.global.harborRegistry }}/data-layer/kafka-exporter:{{ .Values.global.imageTag }}
          imagePullPolicy: IfNotPresent

          # KAFKA_BOOTSTRAP 목록을 각 --kafka.server 옵션으로 변환
          command:
            - /bin/sh
            - -c

          args:
            - |
              exec /bin/kafka_exporter \
                $(echo "${KAFKA_BOOTSTRAP}" | tr ',' '\n' | sed 's/^/--kafka.server=/' | tr '\n' ' ') \
                --web.listen-address=:{{ .Values.kafkaExporterPort }}

          ports:
            - name: metrics
              containerPort: {{ .Values.kafkaExporterPort }}

          envFrom:
            - configMapRef:
                name: data-layer-env
            - secretRef:
                name: data-layer-secrets

          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"

          # Broker 연결 상태와 Exporter 상태 확인
          readinessProbe:
            httpGet:
              path: /
              port: metrics
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 6

          livenessProbe:
            httpGet:
              path: /
              port: metrics
            initialDelaySeconds: 60
            periodSeconds: 60
            failureThreshold: 3