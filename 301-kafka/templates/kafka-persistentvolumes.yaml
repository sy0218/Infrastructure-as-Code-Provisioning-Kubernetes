# ===============================================
# [Kafka Local PV]
#
# Broker 1대당 data / metadata PV를 각각 생성한다.
# → Broker N대 = PV 2N개
#
# [핵심]
# - local PV → 특정 Node의 로컬 디스크 사용
# - nodeAffinity → PV와 Node를 고정
# - claimRef → 특정 Broker의 PVC와 PV를 고정
# - Retain → PVC 삭제 시에도 PV/데이터를 유지
#
# [결과]
# - Broker ID ↔ PVC ↔ PV ↔ Node가 고정되어
# - kafka-N이 지정된 Node의 디스크만 사용한다.
#
# [참고] → 로컬 디렉터리는 Ansible kafka_prereq가 미리 생성한다.
# ===============================================

{{- $root := . }}

{{- range $i, $node := .Values.global.kafka.brokers }}
{{- range $vol := list "data" "metadata" }}
{{- $spec := index $root.Values.global.kafka $vol }}

---
apiVersion: v1
kind: PersistentVolume # 쿠버네티스 리소스 정의

metadata:
  # 예: kafka-data-s1 / kafka-metadata-s1
  name: {{ printf "%s-%s-%s" $root.Values.global.kafka.name $vol $node.name }}

  labels:
    app.kubernetes.io/part-of: data-layer
    app.kubernetes.io/name: kafka
    data-layer/kafka-volume: {{ $vol }}
    data-layer/kafka-node: {{ $node.name }}
    data-layer/kafka-broker-id: {{ $i | quote }}

spec:
  capacity:
    storage: {{ $spec.size }}

  volumeMode: Filesystem # 파일시스템 형태로 Pod 마운트

  accessModes: 
    - ReadWriteOnce

  # PVC 삭제 후에도 PV와 실제 데이터를 유지
  persistentVolumeReclaimPolicy: Retain

  storageClassName: {{ $root.Values.kafka.storageClass }}

  # 해당 Broker의 PVC에 PV를 미리 바인딩
  claimRef:
    namespace: {{ $root.Values.global.namespace }}
    name: {{ printf "%s-%s-%d" $vol $root.Values.global.kafka.name $i }}

  # Node의 실제 로컬 디렉터리
  local:
    path: {{ $spec.path }}

  # Local PV가 지정된 Node에서만 사용되도록 고정
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/hostname
              operator: In
              values:
                - {{ $node.name }}

{{- end }}
{{- end }}