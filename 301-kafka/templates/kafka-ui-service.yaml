# ===============================================
# [Kafka UI → Service]
#
# Ingress가 외부 요청을 받아 이 Service로 전달한다.
# 외부에 직접 노출할 필요가 없으므로 ClusterIP를 사용한다.
#
# Ingress → kafka-ui Service → Kafka UI Pod
# ===============================================
apiVersion: v1
kind: Service

metadata:
  name: kafka-ui
  namespace: {{ .Values.global.namespace }}
  labels:
    app: kafka-ui
    app.kubernetes.io/name: kafka-ui
    app.kubernetes.io/part-of: data-layer

spec:
  type: ClusterIP

  # kafka-ui Pod로 트래픽 전달
  selector:
    app: kafka-ui

  ports:
    - name: http

      # Service가 받는 포트
      port: {{ .Values.kafkaUiPort }}

      # Pod의 http 포트로 전달
      targetPort: http