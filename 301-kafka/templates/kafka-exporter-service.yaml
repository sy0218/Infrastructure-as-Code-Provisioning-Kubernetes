# ===============================================
# [Kafka Exporter → Service]
#
# Prometheus가 이 Service를 통해 Kafka Exporter 메트릭을 수집한다.
# 외부 공개가 필요 없으므로 ClusterIP를 사용한다.
#
# Prometheus → Service port → targetPort → Exporter Pod
#
# Service 이름(kafka-exporter)과 포트 이름(metrics)으로
# Prometheus 수집 대상을 식별한다.
# ===============================================
apiVersion: v1
kind: Service # 쿠버네티스 리소스 정의

metadata:
  name: kafka-exporter
  namespace: {{ .Values.global.namespace }}
  labels:
    app: kafka-exporter
    app.kubernetes.io/name: kafka-exporter
    app.kubernetes.io/part-of: data-layer

spec:
  type: ClusterIP

  selector:
    # app=kafka-exporter Pod로 트래픽 전달
    app: kafka-exporter

  ports:
    - name: metrics

      # Prometheus가 Service에 접속하는 포트
      port: {{ .Values.kafkaExporterPort }}

      # Service가 Exporter Pod의 metrics 포트로 전달
      targetPort: metrics