# ===============================================
# [Kafka Exporter → Service]
#
# 302-monitoring 의 Prometheus 가 이 Service 를 통해 메트릭을 긁어간다.
# 외부 공개가 필요 없어 ClusterIP.
# ===============================================
apiVersion: v1
kind: Service
metadata:
  name: kafka-exporter
  namespace: {{ .Values.global.namespace }}
  labels:
    app: kafka-exporter
    app.kubernetes.io/name: kafka-exporter
    app.kubernetes.io/part-of: data-layer
  # prometheus.io/* 어노테이션은 일부러 두지 않는다 — 302-monitoring 은 annotation 자동 발견
  # 대신 Service·포트 이름으로 keep 한다(prometheus-config.yaml.tftpl 의 regex `kafka-exporter;metrics`).
spec:
  type: ClusterIP
  selector:
    app: kafka-exporter
  ports:
    - name: metrics
      port: {{ .Values.kafkaExporterPort }}
      # 숫자가 아니라 이름으로 묶어 containerPort 가 바뀌어도 따라가게 한다
      targetPort: metrics
