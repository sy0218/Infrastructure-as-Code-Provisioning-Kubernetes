# ===============================================
# [Kafka → Service 2종]
#
# kafka-hl (headless): StatefulSet 의 serviceName — 파드 DNS kafka-N.kafka-hl.<ns>.svc 를 만든다.
#   hostNetwork 라 그 이름은 노드 IP 로 풀린다. publishNotReadyAddresses 는 기동 중(readiness 전)에도
#   DNS 가 있어야 KRaft 쿼럼 형성이 서로를 찾을 수 있게 하기 위함 — 단 voters 는 IP 라 실제 의존은 없다.
# kafka (ClusterIP): 클러스터 안 클라이언트의 bootstrap — 공용 ConfigMap 의 KAFKA_BOOTSTRAP.
#   readiness 통과한 브로커만 엔드포인트가 되고(파드 IP = 노드 IP), 클라이언트는 bootstrap 뒤
#   브로커가 광고한 노드 IP:9092 로 직접 간다. 클러스터 밖은 Service 없이 노드 IP:9092 로 붙는다.
# ===============================================
apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.kafka.name }}-hl
  namespace: {{ .Values.global.namespace }}
  labels:
    app: kafka
    app.kubernetes.io/name: kafka
    app.kubernetes.io/part-of: data-layer
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector:
    app: kafka
  ports:
    - name: client
      port: {{ .Values.kafka.ports.client }}
      targetPort: client
    - name: inter-broker
      port: {{ .Values.kafka.ports.interBroker }}
      targetPort: inter-broker
    - name: controller
      port: {{ .Values.kafka.ports.controller }}
      targetPort: controller
---
apiVersion: v1
kind: Service
metadata:
  # 이 이름이 KAFKA_BOOTSTRAP 의 호스트 부분이다 (_helpers.tpl kafka.bootstrap)
  name: {{ .Values.kafka.name }}
  namespace: {{ .Values.global.namespace }}
  labels:
    app: kafka
    app.kubernetes.io/name: kafka
    app.kubernetes.io/part-of: data-layer
spec:
  type: ClusterIP
  selector:
    app: kafka
  ports:
    - name: client
      port: {{ .Values.kafka.ports.client }}
      targetPort: client
