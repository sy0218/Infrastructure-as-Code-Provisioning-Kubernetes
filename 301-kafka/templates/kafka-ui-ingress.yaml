# ===============================================
# [Kafka UI → Ingress]
#
# 외부에서 Kafka UI에 접속하기 위한 진입점이다.
#
# Client
#   → Ingress VIP
#   → Host: kafka-ui 도메인
#   → kafka-ui Service
#   → Kafka UI Pod
#
# Host 기반 라우팅을(L7) 사용해 Kafka UI를 / 경로 그대로 서비스한다.
# ===============================================
apiVersion: networking.k8s.io/v1
kind: Ingress

metadata:
  name: kafka-ui
  namespace: {{ .Values.global.namespace }}
  labels:
    app: kafka-ui
    app.kubernetes.io/name: kafka-ui
    app.kubernetes.io/part-of: data-layer

spec:
  # 이 도메인으로 들어오는 요청만 처리
  ingressClassName: {{ .Values.global.ingressClassName }}

  rules:
    # Host 기준으로 Kafka UI 요청을 라우팅
    - host: {{ .Values.global.hosts.kafkaUi }}

      http:
        paths:
          - path: /
            pathType: Prefix

            # Kafka UI Service로 전달
            backend:
              service:
                name: kafka-ui # Kafka UI 라는 이름의 Kubernetes Service로 전달한다.
                port:
                  number: {{ .Values.kafkaUiPort }}