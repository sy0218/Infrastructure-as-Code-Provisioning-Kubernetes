# ===============================================
# [Kafka → StatefulSet]
#
# Kafka Broker를 고정된 Node + Local PV에서 실행한다.
#
# - hostNetwork → Pod IP = Node IP (Broker용 Service 없음)
# - Broker ID → StatefulSet ordinal(kafka-0, kafka-1, ...)
# - Local PV → Broker별 데이터/메타데이터 디스크 고정
# - podAntiAffinity → 한 Node에 Broker 1개만 배치
# - OnDelete → 설정 변경 시 자동 재기동하지 않고 수동 롤링
# ===============================================

apiVersion: apps/v1
kind: StatefulSet

metadata:
  name: {{ .Values.global.kafka.name }}
  namespace: {{ .Values.global.namespace }}
  labels:
    app: kafka
    app.kubernetes.io/name: kafka
    app.kubernetes.io/part-of: data-layer

spec:
  # governing Service(serviceName)를 두지 않는다.
  # hostNetwork라 광고 주소·quorum voters가 전부 노드 IP이고 파드별 DNS를 쓰는 곳이 없다.
  # k8s 1.34의 StatefulSetSpec required는 selector/template뿐이라 생략할 수 있다.

  # brokers 목록과 Broker 수를 동일하게 유지
  replicas: {{ len .Values.global.kafka.brokers }}

  # KRaft 컨트롤러 3대는 과반(2대 이상)이 살아 있어야 쿼럼을 구성할 수 있다.
  # OrderedReady는 앞 Pod가 Ready될 때까지 다음 Pod를 생성하지 않아 초기 쿼럼 구성이 교착될 수 있다.
  # → 3개 브로커를 동시에 기동하도록 Parallel 사용
  podManagementPolicy: Parallel

  # 설정 변경 시 Pod를 자동 재기동하지 않음
  updateStrategy:
    type: OnDelete

  selector:
    matchLabels:
      app: kafka

  template:
    metadata:
      labels:
        app: kafka
        app.kubernetes.io/name: kafka
        app.kubernetes.io/part-of: data-layer

    spec:
      # Pod IP = Node IP
      hostNetwork: true

      # hostNetwork에서도 클러스터 DNS 사용
      dnsPolicy: ClusterFirstWithHostNet

      enableServiceLinks: false

      # Kafka graceful shutdown 시간
      terminationGracePeriodSeconds: {{ .Values.kafka.terminationGracePeriodSeconds }}

      # Local PV 디렉터리를 Kafka 컨테이너가 그룹 권한으로 사용
      securityContext:
        fsGroup: 0
        fsGroupChangePolicy: OnRootMismatch

      # 한 Node에 Kafka Broker 1개만 배치
      affinity:
        podAntiAffinity: # 특정 Pod와 같은 Node에 배치하지 않음
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector: # app=kafka인 Pod를 찾음
                matchLabels:
                  app: kafka
              topologyKey: kubernetes.io/hostname # 같은 Node인지 기준으로 판단

      containers:
        - name: kafka

          image: {{ .Values.global.harborRegistry }}/data-layer/{{ .Values.kafka.imageName }}:{{ .Values.global.imageTag }}
          imagePullPolicy: IfNotPresent

          # StatefulSet ordinal을 Broker ID로 사용
          # Controller 노드는 KRaft quorum 구성에 따라 역할을 결정
          command:
            - /bin/sh
            - -ec
            - |
              ORD="${POD_NAME##*-}"

              if [ "$ORD" -lt "$CONTROLLERS" ]; then
                ROLES="controller,broker"
                LISTENERS="CLIENT://0.0.0.0:{{ .Values.global.kafka.ports.client }},INTERNAL://0.0.0.0:{{ .Values.global.kafka.ports.interBroker }},CONTROLLER://0.0.0.0:{{ .Values.global.kafka.ports.controller }}"
              else
                ROLES="broker"
                LISTENERS="CLIENT://0.0.0.0:{{ .Values.global.kafka.ports.client }},INTERNAL://0.0.0.0:{{ .Values.global.kafka.ports.interBroker }}"
              fi

              CFG=/opt/kafka/config/server.properties

              sed \
                -e "s|__NODE_ID__|${ORD}|g" \
                -e "s|__ROLES__|${ROLES}|g" \
                -e "s|__LISTENERS__|${LISTENERS}|g" \
                -e "s|__HOST_IP__|${HOST_IP}|g" \
                /opt/kafka-config/server.properties.tpl > "$CFG"

              echo "== kafka-${ORD} roles=${ROLES} advertised=${HOST_IP} =="

              # 이미 포맷된 Local PV는 유지
              /opt/kafka/bin/kafka-storage.sh format \
                --ignore-formatted \
                -t "$CLUSTER_ID" \
                -c "$CFG"

              # Broker JVM에만 Heap/JMX 옵션 적용
              export KAFKA_HEAP_OPTS="$BROKER_HEAP_OPTS"
              export KAFKA_OPTS="$BROKER_JMX_AGENT"

              exec /opt/kafka/bin/kafka-server-start.sh "$CFG"

          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name

            # hostNetwork이므로 Node IP를 Kafka advertised 주소로 사용
            - name: HOST_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.hostIP

            - name: CLUSTER_ID
              value: {{ .Values.kafka.clusterId | quote }}

            - name: CONTROLLERS
              value: {{ .Values.global.kafka.controllers | quote }}

            # Broker JVM Heap 고정
            - name: BROKER_HEAP_OPTS
              value: "-Xms{{ .Values.kafka.heap }} -Xmx{{ .Values.kafka.heap }}"

            # Broker JVM의 JMX Prometheus Exporter
            - name: BROKER_JMX_AGENT
              value: "-javaagent:/opt/jmx/jmx_prometheus_javaagent.jar={{ .Values.global.kafka.ports.jmx }}:/opt/jmx/config/config.yaml"

          ports:
            - name: client
              containerPort: {{ .Values.global.kafka.ports.client }}

            - name: inter-broker
              containerPort: {{ .Values.global.kafka.ports.interBroker }}

            - name: controller
              containerPort: {{ .Values.global.kafka.ports.controller }}

            # Prometheus가 Broker JVM 메트릭 수집
            - name: metrics
              containerPort: {{ .Values.global.kafka.ports.jmx }}

          volumeMounts:
            # Kafka 로그 세그먼트
            - name: data
              mountPath: {{ .Values.global.kafka.data.path }}

            # KRaft 메타데이터
            - name: metadata
              mountPath: {{ .Values.global.kafka.metadata.path }}

            # Kafka 설정
            - name: config
              mountPath: /opt/kafka-config
              readOnly: true

            # JMX Exporter 설정
            - name: jmx-config
              mountPath: /opt/jmx/config
              readOnly: true

          resources:
            {{- toYaml .Values.kafka.resources | nindent 12 }}

          # 포트가 열리면 Broker를 Ready로 판단
          readinessProbe:
            tcpSocket:
              port: client
            initialDelaySeconds: 20
            periodSeconds: 10
            failureThreshold: 6

          # Kafka 초기 복구가 완료될 때까지 liveness 검사를 지연한다.
          # 9092 포트가 열리기 전까지 최대 360초(6분) 대기한다.
          startupProbe:
            tcpSocket:
              port: client
            periodSeconds: 10
            failureThreshold: 36

          # startupProbe 성공 이후부터 센다
          livenessProbe:
            tcpSocket:
              port: client
            periodSeconds: 60
            failureThreshold: 5

      volumes:
        - name: config
          configMap:
            name: {{ .Values.global.kafka.name }}-config

        - name: jmx-config
          configMap:
            name: {{ .Values.global.kafka.name }}-jmx-exporter

  # Broker별 Local PV에 연결되는 PVC 생성
  # 예: data-kafka-0, metadata-kafka-0
  volumeClaimTemplates:
    - metadata:
        name: data
        labels:
          app.kubernetes.io/part-of: data-layer
      spec:
        accessModes: [ReadWriteOnce]
        storageClassName: {{ .Values.kafka.storageClass }}
        resources:
          requests:
            storage: {{ .Values.global.kafka.data.size }}

    - metadata:
        name: metadata
        labels:
          app.kubernetes.io/part-of: data-layer
      spec:
        accessModes: [ReadWriteOnce]
        storageClassName: {{ .Values.kafka.storageClass }}
        resources:
          requests:
            storage: {{ .Values.global.kafka.metadata.size }}