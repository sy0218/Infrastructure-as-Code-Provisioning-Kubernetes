# ===============================================
# [Kafka → StatefulSet]
#
# - Broker를 고정된 Node + Local PV에서 실행
# - hostNetwork로 Node IP를 Kafka 주소로 사용
# - StatefulSet ordinal을 Broker ID로 사용
# - Broker별 Local PV로 데이터/메타데이터를 고정
# - podAntiAffinity로 Node당 Broker 1개 배치
# - OnDelete로 설정 변경 시 수동 롤링
# ===============================================

apiVersion: apps/v1
kind: StatefulSet

metadata:
  name: {{ .Values.global.kafka.name }}
  namespace: {{ .Values.global.namespace }}
  labels:
    app: kafka
    app.kubernetes.io/name: kafka
    app.kubernetes.io/part-of: data-layer

spec:
  # Kafka Broker 수 = 설정된 Broker 목록 수
  replicas: {{ len .Values.global.kafka.brokers }}

  # Broker를 동시에 생성해 KRaft 초기 쿼럼 구성을 지원
  podManagementPolicy: Parallel

  # 설정 변경 시 자동 재기동하지 않고 수동으로 순차 재기동
  updateStrategy:
    type: OnDelete

  selector:
    matchLabels:
      app: kafka

  template:
    metadata:
      labels:
        app: kafka
        app.kubernetes.io/name: kafka
        app.kubernetes.io/part-of: data-layer

      annotations:
        # ConfigMap 변경 여부를 Pod Template에 반영
        # OnDelete이므로 실제 재기동은 Pod 삭제 시 수행
        checksum/kafka-config: {{ include (print $.Template.BasePath "/kafka-configmap.yaml") . | sha256sum }}
        checksum/kafka-jmx: {{ include (print $.Template.BasePath "/kafka-configmap-jmx.yaml") . | sha256sum }}

    spec:
      # Pod IP 대신 Node IP를 Kafka 주소로 사용
      hostNetwork: true

      # hostNetwork에서도 Kubernetes DNS 사용
      dnsPolicy: ClusterFirstWithHostNet

      enableServiceLinks: false

      # Kafka 종료 시 정상 shutdown을 기다리는 시간
      terminationGracePeriodSeconds: {{ .Values.kafka.terminationGracePeriodSeconds }}

      securityContext:
        fsGroup: 0
        fsGroupChangePolicy: OnRootMismatch

      affinity:
        podAntiAffinity:
          # 동일 Node에 Kafka Broker가 2개 배치되지 않도록 보장
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  app: kafka
              topologyKey: kubernetes.io/hostname

      containers:
        - name: kafka
          image: {{ .Values.global.harborRegistry }}/data-layer/{{ .Values.kafka.imageName }}:{{ .Values.global.imageTag }}
          imagePullPolicy: IfNotPresent

          # StatefulSet ordinal을 Broker ID로 사용
          # 예: kafka-0 → 0, kafka-1 → 1
          # 앞쪽 Broker는 KRaft controller + broker로 동작
          command:
            - /bin/sh
            - -ec
            - |
              ORD="${POD_NAME##*-}"

              if [ "$ORD" -lt "$CONTROLLERS" ]; then
                ROLES="controller,broker"
                LISTENERS="CLIENT://0.0.0.0:{{ .Values.global.kafka.ports.client }},INTERNAL://0.0.0.0:{{ .Values.global.kafka.ports.interBroker }},CONTROLLER://0.0.0.0:{{ .Values.global.kafka.ports.controller }}"
              else
                ROLES="broker"
                LISTENERS="CLIENT://0.0.0.0:{{ .Values.global.kafka.ports.client }},INTERNAL://0.0.0.0:{{ .Values.global.kafka.ports.interBroker }}"
              fi

              CFG=/opt/kafka/config/server.properties

              sed \
                -e "s|__NODE_ID__|${ORD}|g" \
                -e "s|__ROLES__|${ROLES}|g" \
                -e "s|__LISTENERS__|${LISTENERS}|g" \
                -e "s|__HOST_IP__|${HOST_IP}|g" \
                /opt/kafka-config/server.properties.tpl > "$CFG"

              echo "== kafka-${ORD} roles=${ROLES} advertised=${HOST_IP} =="

              # 이미 포맷된 Local PV는 그대로 사용
              /opt/kafka/bin/kafka-storage.sh format \
                --ignore-formatted \
                -t "$CLUSTER_ID" \
                -c "$CFG"

              export KAFKA_HEAP_OPTS="$BROKER_HEAP_OPTS"
              export KAFKA_OPTS="$BROKER_JMX_AGENT"

              exec /opt/kafka/bin/kafka-server-start.sh "$CFG"

          env:
            # StatefulSet Pod 이름
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name

            # hostNetwork이므로 Node IP를 Kafka advertised 주소로 사용
            - name: HOST_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.hostIP

            - name: CLUSTER_ID
              value: {{ .Values.kafka.clusterId | quote }}

            # 앞쪽 N개 Broker를 KRaft Controller로 사용
            - name: CONTROLLERS
              value: {{ .Values.global.kafka.controllers | quote }}

            # Broker JVM Heap
            - name: BROKER_HEAP_OPTS
              value: "-Xms{{ .Values.kafka.heap }} -Xmx{{ .Values.kafka.heap }}"

            # JMX Prometheus Exporter
            - name: BROKER_JMX_AGENT
              value: "-javaagent:/opt/jmx/jmx_prometheus_javaagent.jar={{ .Values.global.kafka.ports.jmx }}:/opt/jmx/config/config.yaml"

          ports:
            - name: client
              containerPort: {{ .Values.global.kafka.ports.client }}
            - name: inter-broker
              containerPort: {{ .Values.global.kafka.ports.interBroker }}
            - name: controller
              containerPort: {{ .Values.global.kafka.ports.controller }}
            - name: metrics
              containerPort: {{ .Values.global.kafka.ports.jmx }}

          volumeMounts:
            # Kafka 로그 세그먼트
            - name: data
              mountPath: {{ .Values.global.kafka.data.path }}

            # KRaft 메타데이터
            - name: metadata
              mountPath: {{ .Values.global.kafka.metadata.path }}

            # Kafka 설정
            - name: config
              mountPath: /opt/kafka-config
              readOnly: true

            # JMX Exporter 설정
            - name: jmx-config
              mountPath: /opt/jmx/config
              readOnly: true

          resources:
            {{- toYaml .Values.kafka.resources | nindent 12 }}

          # Client 포트가 열리면 트래픽 수신 가능 상태로 판단
          readinessProbe:
            tcpSocket:
              port: client
            initialDelaySeconds: 20
            periodSeconds: 10
            failureThreshold: 6

          # 초기 복구가 완료될 때까지 liveness 검사 지연
          startupProbe:
            tcpSocket:
              port: client
            periodSeconds: 10
            failureThreshold: 36

          # 정상 기동 후 Broker 장애 감지
          livenessProbe:
            tcpSocket:
              port: client
            periodSeconds: 60
            failureThreshold: 5

      volumes:
        # Kafka 설정
        - name: config
          configMap:
            name: {{ .Values.global.kafka.name }}-config

        # JMX Exporter 설정
        - name: jmx-config
          configMap:
            name: {{ .Values.global.kafka.name }}-jmx-exporter

  # Broker별 PVC 생성
  # 예: data-kafka-0, data-kafka-1
  #     metadata-kafka-0, metadata-kafka-1
  volumeClaimTemplates:
    - metadata:
        name: data
        labels:
          app.kubernetes.io/part-of: data-layer
      spec:
        accessModes: [ReadWriteOnce]
        storageClassName: {{ .Values.kafka.storageClass }}
        resources:
          requests:
            storage: {{ .Values.global.kafka.data.size }}

    - metadata:
        name: metadata
        labels:
          app.kubernetes.io/part-of: data-layer
      spec:
        accessModes: [ReadWriteOnce]
        storageClassName: {{ .Values.kafka.storageClass }}
        resources:
          requests:
            storage: {{ .Values.global.kafka.metadata.size }}