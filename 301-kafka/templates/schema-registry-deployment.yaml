# ===============================================
# [Schema Registry → Deployment]
#
# Kafka 메시지의 Schema를 관리한다.
# Schema 데이터는 Kafka의 _schemas 토픽에 저장하므로 별도 PVC가 없다.
#
# Kafka 연결 정보는 공용 ConfigMap을 사용한다.
# ===============================================

apiVersion: apps/v1
kind: Deployment

metadata:
  name: schema-registry
  namespace: {{ .Values.global.namespace }}
  labels:
    app: schema-registry
    app.kubernetes.io/name: schema-registry
    app.kubernetes.io/part-of: data-layer

spec:
  # Stateless → 필요에 따라 복제 가능
  replicas: {{ .Values.schemaRegistryReplicas }}

  selector:
    matchLabels:
      app: schema-registry

  template:
    metadata:
      labels:
        app: schema-registry
        app.kubernetes.io/name: schema-registry
        app.kubernetes.io/part-of: data-layer

    spec:
      # Kubernetes Service 환경변수 자동 주입 방지
      enableServiceLinks: false

      containers:
        - name: schema-registry

          image: {{ .Values.global.harborRegistry }}/data-layer/schema-registry:{{ .Values.global.imageTag }}
          imagePullPolicy: IfNotPresent

          ports:
            - name: http
              containerPort: {{ .Values.global.kafka.schemaRegistryPort }}

          # 공용 환경변수 / Secret 사용
          envFrom:
            - configMapRef:
                name: data-layer-env
            - secretRef:
                name: data-layer-secrets

          env:
            # 인스턴스 식별용 Pod IP
            - name: SCHEMA_REGISTRY_HOST_NAME
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP

            # Schema 저장소인 Kafka 연결
            - name: SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS
              valueFrom:
                configMapKeyRef:
                  name: data-layer-env
                  key: KAFKA_BOOTSTRAP_PLAINTEXT

            # 이미지 엔트리포인트의 kafka-ready 사전점검 기준 (브로커 전부가 등록될 때까지 기다린다.)
            # 기본값 1로 두면 브로커 1대만 뜬 순간 통과해 _schemas가 RF 1로 만들어진다(사후 변경 불가).
            - name: SCHEMA_REGISTRY_CUB_KAFKA_MIN_BROKERS
              value: {{ len .Values.global.kafka.brokers | quote }}

            # _schemas 토픽 복제 수 → 의도를 명시적으로 고정
            - name: SCHEMA_REGISTRY_KAFKASTORE_TOPIC_REPLICATION_FACTOR
              value: {{ .Values.global.kafka.replicationFactor | quote }}

            # Schema Registry HTTP API
            - name: SCHEMA_REGISTRY_LISTENERS
              value: "http://0.0.0.0:{{ .Values.global.kafka.schemaRegistryPort }}"

            # 이전 버전 Consumer와 호환되는 Schema 허용
            - name: SCHEMA_REGISTRY_SCHEMA_COMPATIBILITY_LEVEL
              value: "backward"

          resources:
            requests:
              cpu: "100m"
              memory: "512Mi"

          # HTTP API + Kafka 연결 상태 확인
          readinessProbe:
            httpGet:
              path: /subjects
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 6

          livenessProbe:
            httpGet:
              path: /subjects
              port: http
            initialDelaySeconds: 60
            periodSeconds: 60
            failureThreshold: 6