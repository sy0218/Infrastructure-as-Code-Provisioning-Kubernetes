# ===============================================
# [Kafka 전용 StorageClass → 정적 local PV]
#
# 프로비저너가 없다 — PV 는 이 차트가 노드마다 미리 만든다(kafka-persistentvolumes.yaml).
# local-path 를 쓰지 않는 이유: local-path 는 파드가 뜬 노드에 디렉토리를 '새로' 파므로
# 파드가 다른 노드에 뜨면 빈 디스크에서 시작한다. 정적 local PV 는 nodeAffinity 로
# 데이터가 있는 노드에 파드를 못박는다 — "장애는 쿠버네티스가 아니라 Kafka 복제로 막는다".
#
# WaitForFirstConsumer: 일반 바인딩 순서(스케줄 → 바인딩). 이 차트의 PV 는 claimRef 로 PVC 이름에
#   미리 묶여 있어(pre-bound) 사실상 즉시 바인딩되고, 스케줄러는 그 PV 의 nodeAffinity 를 따른다.
# Retain: PVC 가 지워져도 PV 오브젝트와 디스크 데이터를 남긴다 — 단 PV 는 Released 가 되어 새 PVC 가
#   바인딩되지 않으므로 claimRef 를 다시 걸어 줘야 한다(README 'PV 재사용').
# ===============================================
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: {{ .Values.kafka.storageClass }}
  labels:
    app.kubernetes.io/part-of: data-layer
provisioner: kubernetes.io/no-provisioner
volumeBindingMode: WaitForFirstConsumer
reclaimPolicy: Retain
