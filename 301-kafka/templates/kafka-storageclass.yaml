# ===============================================
# [Kafka StorageClass → 정적 Local PV]
#
# 이 StorageClass는 동적 PV 생성 없이
# kafka-persistentvolumes.yaml에서 미리 만든 Local PV를 사용한다.
#
# - no-provisioner → PV를 자동 생성하지 않음
# - WaitForFirstConsumer → Pod 스케줄링 시점에 PV 바인딩
# - Retain → PVC 삭제 후에도 PV와 데이터 유지
#
# Local PV는 nodeAffinity로 특정 Node에 고정되므로
# Broker가 데이터가 없는 다른 Node로 이동하지 않는다.
# ===============================================
apiVersion: storage.k8s.io/v1
kind: StorageClass

metadata:
  name: {{ .Values.kafka.storageClass }}
  labels:
    app.kubernetes.io/part-of: data-layer

# 동적 프로비저닝 없이 정적 PV 사용
provisioner: kubernetes.io/no-provisioner

# Pod 스케줄링과 PV 바인딩을 함께 결정
volumeBindingMode: WaitForFirstConsumer

# PVC 삭제 후에도 PV와 실제 데이터 유지
reclaimPolicy: Retain