# ===============================================
# [Kafka UI → Deployment]
#
# Kafka 토픽과 Consumer Group을 웹 UI로 관리한다.
#
# - Kafka / Schema Registry 주소는 공용 ConfigMap 사용
# - 공용 설정 변경 시 checksum으로 Pod 롤아웃
# - 300-data-layer-base가 먼저 배포되어야 함
# ===============================================

# Kafka / Schema Registry 주소 변경 시 Pod 롤아웃
{{- $svcSuffix := printf "%s.svc.cluster.local" .Values.global.namespace }}
{{- $schemaRegistryUrl := printf "http://schema-registry.%s:%d" $svcSuffix (int .Values.global.kafka.schemaRegistryPort) }}
{{- $configHash := printf "%s|%s" (include "kafka.bootstrap" .) $schemaRegistryUrl | sha256sum }}

apiVersion: apps/v1
kind: Deployment

metadata:
  name: kafka-ui
  namespace: {{ .Values.global.namespace }}
  labels:
    app: kafka-ui
    app.kubernetes.io/name: kafka-ui
    app.kubernetes.io/part-of: data-layer

spec:
  replicas: 1

  selector:
    matchLabels:
      app: kafka-ui

  template:
    metadata:
      labels:
        app: kafka-ui
        app.kubernetes.io/name: kafka-ui
        app.kubernetes.io/part-of: data-layer

      annotations:
        # ConfigMap의 Kafka / Schema Registry 주소 변경 시 Pod 재생성
        checksum/kafka-bootstrap: "{{ $configHash }}"

    spec:
      enableServiceLinks: false

      containers:
        - name: kafka-ui

          image: {{ .Values.global.harborRegistry }}/data-layer/kafka-ui:{{ .Values.global.imageTag }}
          imagePullPolicy: IfNotPresent

          ports:
            - name: http
              containerPort: {{ .Values.kafkaUiPort }}

          # 공용 환경변수와 Secret 사용
          envFrom:
            - configMapRef:
                name: data-layer-env
            - secretRef:
                name: data-layer-secrets

          env:
            - name: SERVER_PORT
              value: {{ .Values.kafkaUiPort | quote }}

            # 공용 ConfigMap 값을 Kafka UI 전용 환경변수로 매핑
            - name: KAFKA_CLUSTERS_0_NAME
              valueFrom:
                configMapKeyRef:
                  name: data-layer-env
                  key: KAFKA_UI_CLUSTER_NAME

            - name: KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS
              valueFrom:
                configMapKeyRef:
                  name: data-layer-env
                  key: KAFKA_BOOTSTRAP

            - name: KAFKA_CLUSTERS_0_SCHEMAREGISTRY
              valueFrom:
                configMapKeyRef:
                  name: data-layer-env
                  key: SCHEMA_REGISTRY_URL

          resources:
            requests:
              cpu: "100m"
              memory: "512Mi"

          # UI 자체의 정상 동작 여부 확인
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 6

          livenessProbe:
            httpGet:
              path: /actuator/health
              port: http
            initialDelaySeconds: 60
            periodSeconds: 60
            failureThreshold: 6