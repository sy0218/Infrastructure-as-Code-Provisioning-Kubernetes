# ===============================================
# [Schema Registry → Service]
#
# 클러스터 내부에서 Schema Registry에 접근하기 위한 Service.
# 외부 공개는 하지 않으므로 ClusterIP 사용.
#
# 매퍼 / 컨슈머 / Kafka UI는
# schema-registry:<port> 로 접근한다.
# ===============================================

apiVersion: v1
kind: Service

metadata:
  name: schema-registry
  namespace: {{ .Values.global.namespace }}
  labels:
    app: schema-registry
    app.kubernetes.io/name: schema-registry
    app.kubernetes.io/part-of: data-layer

spec:
  type: ClusterIP

  # Schema Registry Pod로 트래픽 전달
  selector:
    app: schema-registry

  ports:
    - name: http

      # Service가 노출하는 포트
      port: {{ .Values.global.kafka.schemaRegistryPort }}

      # Pod의 http 포트로 전달
      targetPort: http