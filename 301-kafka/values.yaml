# ===============================================
# [kafka values]
# - 로컬 환경에서 helm template 단독 렌더 가능
# - ArgoCD app-of-apps 배포 시 global.* 덮어쓰기 가능
# - 필수 값/형식은 values.schema.json으로 검증
# ===============================================

global:
  # Kubernetes Namespace (300-data-layer-base 소유 → 여기서는 참조만)
  namespace: "data-layer"

  # Harbor 레지스트리 주소(스킴 없음) → 도구 3종 이미지 이름의 첫 마디가 된다.
  # :80 필수 — 콜론도 점도 없는 단일 라벨은 Docker 참조 파서가 레지스트리로
  # 인정하지 않고 docker.io 밑 경로로 정규화한다(그러면 pull 이 Docker Hub 로 간다).
  # 브로커 이미지(kafka)도 여기서 받는다 — data_pipeline/data_layer_kafka/Dockerfile (apache/kafka + JMX javaagent).
  harborRegistry: "data-layer-harbor:80"

  # 도구 3종 이미지 태그 → 불변 태그로 다루고 재사용하지 않는다
  imageTag: "v0.1.0"

  # Ingress 클래스 이름 (102-ingress 의 ingress-nginx)
  ingressClassName: "nginx"


# ===============================================
# [Kafka 클러스터 — StatefulSet]
#
# 장애는 쿠버네티스가 아니라 Kafka 복제(RF=3)가 막는다:
#   - 브로커는 hostNetwork 로 노드 IP 를 그대로 쓰고(파드 IP = 노드 IP), 데이터는 노드 로컬 디렉토리(정적 local PV).
#   - 브로커 ID ↔ 노드 는 아래 nodes 표로 고정된다(PV 가 PVC 이름에 미리 묶여 있어 kafka-N 은 nodes[N] 에만 뜬다).
#   - 노드가 죽으면 그 파드는 다른 노드로 옮겨지지 않는다(옮길 곳이 없다). 남은 2대가 복제본으로 서비스를 잇고,
#     복구는 사람이 nodes 표를 고쳐 한다(README '노드 장애').
#   - updateStrategy 는 OnDelete — 설정을 바꿔도 파드가 저절로 재기동되지 않는다. 사람이 한 대씩 지우며
#     복제 상태를 확인한다(README '롤링 재기동'). 이것도 "쿠버네티스가 알아서 하지 않는다" 의 일부다.
# ===============================================
kafka:
  # StatefulSet/Service 이름 → 파드 kafka-0..N-1, bootstrap Service kafka, headless kafka-hl.
  # 브로커 bootstrap 주소 <name>.<ns>.svc.cluster.local:<clientPort> 가 여기서 나온다.
  # [주의] 300-data-layer-base 의 global.kafkaBootstrap 이 이 이름의 복사본 → 바꾸면 같은 커밋에서 함께 고친다.
  name: "kafka"

  # KRaft 클러스터 ID — 최초 포맷 때 디스크(meta.properties)에 각인된다. 구 로컬 설치(Ansible) 값 승계.
  # [주의] 바꾸면 기존 디스크와 충돌해 브로커가 뜨지 않는다 = 데이터 초기화가 전제.
  clusterId: "HX65iPPZTWOoFe5w-Od0Sw"

  # 이미지 — data_pipeline/data_layer_kafka/Dockerfile (apache/kafka + JMX javaagent), 태그는 global.imageTag
  imageName: "kafka"

  # 포트 — hostNetwork 라 노드 포트 그 자체다. 노드의 다른 프로세스와 겹치면 안 된다
  # (구 로컬 설치와 동일 — 9098 은 calico-typha 가 쓰던 자리라 JMX 는 9404).
  ports:
    client: 9092     # 클라이언트(PLAINTEXT) — 공용 ConfigMap 의 KAFKA_BOOTSTRAP / 외부 접속 둘 다 이 포트
    interBroker: 9093
    controller: 9094
    jmx: 9404        # javaagent 메트릭 — 302-monitoring 이 파드 포트 이름 metrics 로 긁는다

  # 브로커 ↔ 노드 고정표. 인덱스 = 브로커 ID = 파드 ordinal(kafka-N). ip 는 controller.quorum.voters 조립에 쓴다
  # (hostNetwork 라 파드 IP = 노드 IP — 값은 Ansible host.yml 과 일치).
  # [주의] 노드를 넣기 전에 Ansible kafka_prereq 가 그 노드에 디렉토리를 만들어 뒀어야 한다.
  # [주의] 앞에서 controllers 개(3)는 controller+broker 겸용(정적 쿼럼 — 생성 후 수·IP 변경은 롤링 재기동),
  #    그 뒤는 broker 전용 → 브로커 증설은 뒤에 붙이고, 축소는 뒤에서부터 뺀다(StatefulSet ordinal 규칙).
  nodes:
    - name: ap
      ip: 192.168.0.38
    - name: s1
      ip: 192.168.0.39
    - name: s2
      ip: 192.168.0.40
  controllers: 3

  # 정적 local PV 전용 StorageClass (이 차트가 만든다 — 프로비저너 없음)
  storageClass: "kafka-local"

  # 노드 디렉토리 → Ansible group_vars/kafka.yml 의 kafka_broker_data_dir / kafka_controller_data_dir 와 글자 그대로 같아야 한다.
  # 브로커 로그 세그먼트와 KRaft 메타데이터 로그를 나눠 둔다(metadata.log.dir). size 는 local PV 명목값(강제 안 됨).
  data:
    path: "/data/kafka-broker"
    size: "10Gi"
  metadata:
    path: "/data/kafka-controller"
    size: "2Gi"

  # JVM 힙 고정(-Xms=-Xmx) — limit 이 없으면 JVM 이 노드 MemTotal 의 25% 를 향해 자란다
  heap: "1g"
  resources:
    requests:
      cpu: "500m"
      memory: "1536Mi"

  # 복제/파티션 기본값 — 구 Ansible 로컬 설치(group_vars/kafka.yml)의 계약 승계.
  # min ISR 1 = 브로커 2대가 죽어도 쓰기 지속 (내구성 ↔ 가용성 트레이드오프 — 의도된 값)
  replicationFactor: 3
  minInsyncReplicas: 1
  numPartitions: 3

  # 종료 유예 — controlled shutdown(리더 이전 + 세그먼트 flush)이 끝날 시간
  terminationGracePeriodSeconds: 120


# ===============================================
# [토픽 — Job (helm hook)]
#
# 파이프라인 계약 토픽(구 kafka_topics 롤의 kafka_topic_list 승계). install/upgrade 마다 Job 이
# kafka-topics.sh --create --if-not-exists 로 만든다 → 있으면 건드리지 않는다(멱등). 파티션/RF 는 위 kafka.* 값.
# 여기 없는 토픽(_schemas·connect-* 등)은 각 앱이 스스로 만든다. 목록에서 빼도 토픽은 지워지지 않는다(삭제는 수동).
# ===============================================
topics:
  # CDC 원본 (306-cdc Debezium 이 쓴다)
  - raw.qm.qm-chemical.batches
  - raw.qm.qm-chemical.qc-results
  - raw.qm.qm-chemical.event-logs
  - raw.qm.qm-chemical.replacement-history
  - raw.qm.qm-chemical.control-loop-defs
  - raw.qm.qm-chemical.claims
  - raw.qm.qm-chemical.lab-results
  - raw.qm.qm-chemical.sensor-timeseries
  # 파이프라인 내부 (cdm / dlq / lineage) — 이름의 원본은 300 의 ConfigMap *_TOPIC 키
  - cdm-topic
  - dlq-cdm-topic
  - dlq-cdm-consumer-rdb
  - dlq-cdm-consumer-graph
  - dlq-cdm-consumer-warehouse
  - dlq.raw
  - lineage-topic
  - dlq-lineage


# ===============================================
# [운영 도구 3종 — 이 차트가 소유한 값]
#
# 포트 하나가 매니페스트 안 여러 곳(리슨 주소/containerPort/Service port)에
# 나오므로 값 하나에서 전부 주입해 어긋날 방법 자체를 없앤다.
#
# [주의] 300-data-layer-base 가 URL 조립용 복사본을 갖는 값이 둘 있다
#    (schemaRegistryPort / kafkaUiHost) → 바꾸면 같은 커밋에서 함께 고친다.
# ===============================================

# Schema Registry 복제 수 (stateless → 리더 선출이 내장이라 늘려도 안전)
schemaRegistryReplicas: 1

# ClusterIP / 컨테이너 포트
schemaRegistryPort: 9096 # 300의 SCHEMA_REGISTRY_URL 조립에 사용
kafkaUiPort: 9095        # Ingress 백엔드가 가리키는 포트이기도 하다
kafkaExporterPort: 9097  # 302-monitoring 의 Prometheus 가 긁어가는 포트

# kafka-ui 접속 호스트명 → Ingress 규칙의 host이자 브라우저가 치는 주소.
# /etc/hosts 가 Ingress VIP 로 풀고(Ansible etc_hosts 롤), 노드 한 대가 죽으면
# MetalLB 가 VIP 를 살아 있는 노드로 옮긴다 → 주소도 포트도 그대로다.
# 이름 전체 표의 단일 출처는 저장소 README 접속 주소 표 → 바꾸면 같은 커밋에서 함께 고친다.
kafkaUiHost: "data-layer-kafka-ui" # 300의 KAFKA_UI_URL 조립에 사용
