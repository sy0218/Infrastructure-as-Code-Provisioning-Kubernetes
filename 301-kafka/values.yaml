# ===============================================
# [values.yaml]
#   — 301-kafka 전용 설정
#
# 공통값(global.*)은 저장소 루트 values.common.yaml 에서만 관리한다.
# Kafka 브로커 노드/포트 정보도 공통값에 정의해 다른 차트와 동일한 값을 사용한다.
# ===============================================


# ===============================================
# [Kafka 클러스터]
#   — StatefulSet
#
# Kafka 고가용성은 Kubernetes 재스케줄링이 아닌 Kafka 복제(RF=3)로 보장한다.
# - Broker ↔ Node ↔ Local PV를 고정
# - 노드 장애 시 다른 노드로 자동 이동하지 않음
# - 남은 Broker가 복제본으로 서비스 유지
# - 장애 복구는 brokers 표를 수정해 수동 처리
# - OnDelete 전략으로 사람이 한 대씩 재기동하며 복제 상태 확인
# ===============================================
kafka:
  # KRaft Cluster ID
  # 최초 포맷 시 디스크(meta.properties)에 기록되므로 변경 시 기존 데이터와 충돌한다.
  clusterId: "HX65iPPZTWOoFe5w-Od0Sw"

  # Kafka 이미지
  imageName: "kafka"

  # 정적 Local PV용 StorageClass
  storageClass: "kafka-local"

  # JVM Heap 고정
  heap: "1g"

  resources:
    requests:
      cpu: "500m"
      memory: "1536Mi"

  # Controlled shutdown 및 데이터 flush 대기 시간
  terminationGracePeriodSeconds: 120


# ===============================================
# [토픽]
#   — Helm Hook Job
#
# install/upgrade 시 kafka-topics.sh --create --if-not-exists 로 생성한다.
# 이미 존재하는 토픽은 변경하지 않으며, 목록에서 제거해도 자동 삭제되지 않는다.
#
# _schemas, connect-* 등 애플리케이션 전용 토픽은 각 애플리케이션이 관리한다.
# ===============================================
topics:
  # CDC 원본 (306-cdc Debezium)
  - raw.qm.qm-chemical.batches
  - raw.qm.qm-chemical.qc-results
  - raw.qm.qm-chemical.event-logs
  - raw.qm.qm-chemical.replacement-history
  - raw.qm.qm-chemical.control-loop-defs
  - raw.qm.qm-chemical.claims
  - raw.qm.qm-chemical.lab-results
  - raw.qm.qm-chemical.sensor-timeseries

  # 파이프라인 내부 토픽
  - cdm-topic
  - dlq-cdm-topic
  - dlq-cdm-consumer-rdb
  - dlq-cdm-consumer-graph
  - dlq-cdm-consumer-warehouse
  - dlq.raw
  - lineage-topic
  - dlq-lineage


# ===============================================
# [운영 도구]
# → Schema Registry 포트는 다른 차트에서도 사용하므로 공통값(global.*)으로 관리한다.
# ===============================================

# Schema Registry Replica 수
schemaRegistryReplicas: 1

# Kafka UI ClusterIP 포트
kafkaUiPort: 9095

# Prometheus Kafka Exporter 포트
kafkaExporterPort: 9097