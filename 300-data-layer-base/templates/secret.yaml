# ===============================================
# [공용 Secret — data-layer-secrets]  (원본: common-config.tf)
#   → 다른 차트 워크로드가 envFrom.secretRef 로 통째로 주입받는 민감 값 전부.
#   → 값은 전부 values.yaml 의 secrets: 블록에서만 들어온다 — 공개 랩 전제(원본 CLAUDE.md
#     시크릿 정책 승계), 실계정 전환 시 SealedSecrets/SOPS 로 교체.
#   → stringData 사용: base64 수작업 인코딩 실수를 없앤다(API 서버가 data 로 변환).
# ===============================================
apiVersion: v1
kind: Secret
metadata:
  name: data-layer-secrets
  namespace: {{ .Values.global.namespace }}
  labels:
    app.kubernetes.io/part-of: data-layer
type: Opaque
stringData:
  # MinIO 인증 — ROOT 계정이 그대로 S3 access/secret key 로도 쓰인다
  MINIO_ROOT_USER: {{ .Values.secrets.minioRootUser | quote }}
  MINIO_ROOT_PASSWORD: {{ .Values.secrets.minioRootPassword | quote }}
  CDM_OBJSTORE_ACCESS_KEY: {{ .Values.secrets.minioRootUser | quote }}
  CDM_OBJSTORE_SECRET_KEY: {{ .Values.secrets.minioRootPassword | quote }}

  # PostgreSQL 인증
  COLLECTOR_DB_USER: {{ .Values.secrets.postgresUser | quote }}
  COLLECTOR_DB_PASSWORD: {{ .Values.secrets.postgresPassword | quote }}

  # Application Key
  # collect_job.config 암호화 키(Fernet) — Airflow Variable 과 반드시 동일
  COLLECTOR_CRYPTO_KEY: {{ .Values.secrets.collectorCryptoKey | quote }}
  DATA_LAYER_API_KEY: {{ .Values.secrets.dataLayerApiKey | quote }}

  # Neo4j 인증 — 로컬 서버의 NEO4J_AUTH 와 클라이언트가 공유
  PLATFORM_NEO4J_USER: {{ .Values.secrets.platformNeo4jUser | quote }}
  PLATFORM_NEO4J_PASSWORD: {{ .Values.secrets.platformNeo4jPassword | quote }}

  # Grafana 관리자 계정
  GF_SECURITY_ADMIN_USER: {{ .Values.secrets.grafanaAdminUser | quote }}
  GF_SECURITY_ADMIN_PASSWORD: {{ .Values.secrets.grafanaAdminPassword | quote }}
