# =====================================================
# 공용 Secret
#
# 여러 서비스에서 사용하는 인증 정보와 API Key를 관리한다.
# 값의 원천은 values.common.yaml의 global.secrets이다.
#
# 개발/로컬 환경: values에 평문 사용
# 운영 환경: SealedSecrets / SOPS 등으로 관리
# =====================================================

apiVersion: v1
kind: Secret

metadata:
  name: data-layer-secrets
  namespace: {{ .Values.global.namespace }}
  labels:
    app.kubernetes.io/part-of: data-layer

type: Opaque

stringData:

  # ---------------------------------------------------
  # MinIO
  # ---------------------------------------------------

  MINIO_ROOT_USER: {{ .Values.global.secrets.minioUser | quote }}
  MINIO_ROOT_PASSWORD: {{ .Values.global.secrets.minioPassword | quote }}

  CDM_OBJSTORE_ACCESS_KEY: {{ .Values.global.secrets.minioUser | quote }}
  CDM_OBJSTORE_SECRET_KEY: {{ .Values.global.secrets.minioPassword | quote }}


  # ---------------------------------------------------
  # PostgreSQL
  # ---------------------------------------------------

  COLLECTOR_DB_USER: {{ .Values.global.secrets.postgresUser | quote }}
  COLLECTOR_DB_PASSWORD: {{ .Values.global.secrets.postgresPassword | quote }}


  # ---------------------------------------------------
  # Application
  # ---------------------------------------------------

  # Airflow Collector와 동일한 암호화 키 사용
  COLLECTOR_CRYPTO_KEY: {{ .Values.global.secrets.collectorCryptoKey | quote }}
  DATA_LAYER_API_KEY: {{ .Values.global.secrets.dataLayerApiKey | quote }}


  # ---------------------------------------------------
  # Neo4j
  # ---------------------------------------------------

  PLATFORM_NEO4J_USER: {{ .Values.global.secrets.neo4jUser | quote }}
  PLATFORM_NEO4J_PASSWORD: {{ .Values.global.secrets.neo4jPassword | quote }}


  # ---------------------------------------------------
  # Grafana
  # ---------------------------------------------------

  GF_SECURITY_ADMIN_USER: {{ .Values.global.secrets.grafanaAdminUser | quote }}
  GF_SECURITY_ADMIN_PASSWORD: {{ .Values.global.secrets.grafanaAdminPassword | quote }}


---
# =====================================================
# PostgreSQL App User Secret
#
# CNPG가 PostgreSQL role 생성/관리에 사용하는 전용 Secret.
# kubernetes.io/basic-auth 형식의 username/password가 필요하므로
# 공용 Opaque Secret과 분리한다.
#
# 값은 동일하게 global.secrets에서 가져온다.
# =====================================================

apiVersion: v1
kind: Secret

metadata:
  name: {{ .Values.global.postgres.clusterName }}-app-user
  namespace: {{ .Values.global.namespace }}
  labels:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/part-of: data-layer

  # Secret 변경 시 CNPG가 DB 인증 정보를 반영한다.
  annotations:
    cnpg.io/reload: "true"

type: kubernetes.io/basic-auth

stringData:
  username: {{ .Values.global.secrets.postgresUser | quote }}
  password: {{ .Values.global.secrets.postgresPassword | quote }}