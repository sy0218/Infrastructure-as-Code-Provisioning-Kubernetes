# =====================================================
# Kubernetes API 권한
#
# data-layer namespace의 default ServiceAccount에
# cluster-admin 권한을 부여한다.
#
# 별도 ServiceAccount를 지정하지 않는 Pod는
# default ServiceAccount를 사용한다.
# =====================================================

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding

metadata:
  # ClusterRoleBinding 이름은 클러스터 전체에서 유일해야 한다.
  name: {{ .Values.global.namespace }}-default-admin
  labels:
    app.kubernetes.io/part-of: data-layer

roleRef:
  # 부여할 권한
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cluster-admin

subjects:
  # 권한을 부여할 ServiceAccount
  - kind: ServiceAccount
    name: default
    namespace: {{ .Values.global.namespace }}