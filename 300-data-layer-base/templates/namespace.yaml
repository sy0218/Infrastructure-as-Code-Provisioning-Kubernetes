# ===============================================
# [네임스페이스 — data-layer]  (원본: namespace.tf)
#   → 이 차트가 유일한 소유자다. 다른 차트는 이름으로 참조만 한다.
#   → 두 차트가 같은 오브젝트를 가지면 한쪽 삭제가 다른 쪽까지 지운다.
# ===============================================
apiVersion: v1
kind: Namespace
metadata:
  name: {{ .Values.global.namespace }}
  labels:
    app.kubernetes.io/part-of: data-layer
