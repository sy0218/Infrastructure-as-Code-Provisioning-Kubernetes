# =====================================================
# [공용 ConfigMap]
#   - data-layer 서비스에서 공통으로 사용하는 환경변수.
#     → 각 서비스는 envFrom으로 주입받는다.
# =====================================================
apiVersion: v1
kind: ConfigMap

metadata:
  name: data-layer-env
  namespace: {{ .Values.global.namespace }}
  labels:
    app.kubernetes.io/part-of: data-layer

data:
  # ---------------------------------------------------
  # [Kafka / Messaging]
  # ---------------------------------------------------
  KAFKA_BOOTSTRAP: {{ include "datalayer.kafkaBootstrap" . | quote }}
  KAFKA_BOOTSTRAP_PLAINTEXT: {{ include "datalayer.kafkaBootstrapPlaintext" . | quote }}

  SCHEMA_REGISTRY_URL: {{ printf "http://schema-registry.%s:%d" (include "datalayer.svcSuffix" .) (int .Values.global.kafka.schemaRegistryPort) | quote }}
  KAFKA_CONNECT_URL: {{ printf "http://cdc-connect.%s:%d" (include "datalayer.svcSuffix" .) (int .Values.global.kafka.connectPort) | quote }}
  KAFKA_UI_CLUSTER_NAME: "kraft-cluster"


  # ---------------------------------------------------
  # [Kafka Topics]
  # ---------------------------------------------------
  # Producer / Consumer 간 공통 Topic 규칙
  CDM_TOPIC: "cdm-topic"
  CDM_DLQ_TOPIC: "dlq-cdm-topic"
  CDM_CONSUMER_RDB_DLQ_TOPIC: "dlq-cdm-consumer-rdb"
  CDM_CONSUMER_GRAPH_DLQ_TOPIC: "dlq-cdm-consumer-graph"
  CDM_CONSUMER_WAREHOUSE_DLQ_TOPIC: "dlq-cdm-consumer-warehouse"
  # raw 단계 DLQ 는 하나 → tcp-socket 의 TCP_SOCKET_DLQ_TOPIC 은 307 이 이 키를 valueFrom 으로 번역한다
  DATA_QUALITY_DLQ_TOPIC: "dlq.raw"
  LINEAGE_TOPIC: "lineage-topic"
  LINEAGE_DLQ_TOPIC: "dlq-lineage"


  # ---------------------------------------------------
  # [MinIO]
  # ---------------------------------------------------
  # 설정/스키마 오브젝트 저장소 → 데이터 레이크가 아니다. 버킷 이름은 global.minioBuckets(301-minio 의 hook Job 이 만든다)
  CDM_OBJSTORE_ENDPOINT: {{ .Values.global.minioEndpoint | quote }}
  CDM_OBJSTORE_BUCKET: {{ .Values.global.minioBuckets.config | quote }}


  # ---------------------------------------------------
  # [Iceberg]
  # ---------------------------------------------------
  # 데이터 레이크는 301-hadoop HDFS / 카탈로그는 303 PostgreSQL.
  #   - 카탈로그 = 데이터가 어디에 있고, 어떤 구조이며, 어떻게 관리되는지 기록해 놓은 메타데이터 저장소
  ICEBERG_WAREHOUSE: {{ printf "hdfs://%s%s" .Values.global.hadoop.nameservice .Values.global.hadoop.warehouse.path | quote }}
  ICEBERG_CATALOG_URI: {{ include "datalayer.icebergCatalogUri" . | quote }}
  ICEBERG_CATALOG_DB_NAME: {{ .Values.global.postgres.databases.icebergCatalog | quote }}


  # ---------------------------------------------------
  # [PostgreSQL]
  # ---------------------------------------------------
  PLATFORM_PG_DSN: {{ include "datalayer.postgresDsn" . | quote }}
  COLLECTOR_DB_HOST: {{ include "datalayer.postgresHost" . | quote }}
  COLLECTOR_DB_PORT: {{ .Values.global.postgres.port | quote }}
  COLLECTOR_DB_NAME: {{ .Values.global.postgres.databases.collector | quote }}
  COLLECTOR_DB_SCHEMA: {{ .Values.global.postgres.schema | quote }}


  # ---------------------------------------------------
  # [Neo4j]
  # ---------------------------------------------------
  PLATFORM_NEO4J_URI: {{ .Values.global.neo4jBoltUri | quote }}
  PLATFORM_NEO4J_DATABASE: "neo4j"


  # ---------------------------------------------------
  # [UI]
  # ---------------------------------------------------
  # 외부 접근용 Ingress 주소
  KAFKA_UI_URL: {{ printf "http://%s" .Values.global.hosts.kafkaUi | quote }}
  AIRFLOW_UI_URL: {{ printf "http://%s" .Values.global.hosts.airflow | quote }}
  GRAFANA_URL: {{ printf "http://%s" .Values.global.hosts.grafana | quote }}


  # ---------------------------------------------------
  # [Data Quality]
  # ---------------------------------------------------
  DATA_QUALITY_MAPPER_PREFIX: "cdm-mapper"
  DATA_QUALITY_RESTART_DRAIN_TIMEOUT: "180"


  # ---------------------------------------------------
  # [Kafka Consumer → Mapper / CDM / Lineage]
  # ---------------------------------------------------
  # 공통 실행 설정 및 Kafka Consumer 설정
  CDM_MAPPER_LOG_LEVEL: "INFO"
  CDM_WORK_BATCH_SIZE: "500"
  CDM_WORK_BATCH_TIME: "60.0"
  CDM_TZ: "Asia/Seoul"

  CDM_CONSUMER_RDB_GROUP: "cdm-consumer-rdb"
  CDM_CONSUMER_RDB_BATCH_SIZE: "500"
  CDM_CONSUMER_RDB_BATCH_TIME: "60.0"
  CDM_CONSUMER_RDB_LOG_LEVEL: "INFO"

  CDM_CONSUMER_GRAPH_GROUP: "cdm-consumer-graph"
  CDM_CONSUMER_GRAPH_BATCH_SIZE: "500"
  CDM_CONSUMER_GRAPH_BATCH_TIME: "60.0"
  CDM_CONSUMER_GRAPH_LOG_LEVEL: "INFO"

  CDM_CONSUMER_WAREHOUSE_GROUP: "cdm-consumer-warehouse"
  CDM_CONSUMER_WAREHOUSE_BATCH_SIZE: "500"
  CDM_CONSUMER_WAREHOUSE_BATCH_TIME: "60.0"
  CDM_CONSUMER_WAREHOUSE_LOG_LEVEL: "INFO"

  LINEAGE_GROUP: "cdm-lineage"
  LINEAGE_LOG_LEVEL: "INFO"
  LINEAGE_BATCH_SIZE: "500"
  LINEAGE_BATCH_TIME: "60.0"


  # ---------------------------------------------------
  # [TCP Socket Collector]
  # ---------------------------------------------------
  # TCP 수집기 실행 및 연결 설정
  TCP_SOCKET_BIND: "0.0.0.0"
  TCP_SOCKET_ORIGIN: "socket.tcp"

  TCP_SOCKET_MAX_CONN: "64"
  TCP_SOCKET_MAX_LINE: "65536"
  TCP_SOCKET_IDLE_TIMEOUT: "300"

  TCP_SOCKET_STATS_INTERVAL: "300"
  TCP_SOCKET_REFRESH_INTERVAL: "60"
  TCP_SOCKET_LOG_LEVEL: "INFO"

  # Collector Pod Label Selector
  TCP_SOCKET_CONTAINER: "tcp-socket-collector"


  # ---------------------------------------------------
  # [Grafana]
  # ---------------------------------------------------
  # iframe Embed 및 익명 접근 설정
  GF_SECURITY_ALLOW_EMBEDDING: "true"
  GF_AUTH_ANONYMOUS_ENABLED: "true"
  GF_AUTH_ANONYMOUS_ORG_ROLE: "Editor"


  # ---------------------------------------------------
  # [Airflow]
  # ---------------------------------------------------
  AIRFLOW_UID: "50000"