# =====================================================
# Kafka server.properties 템플릿
# =====================================================
# Kafka 설정 파일을 ConfigMap으로 관리한다.
#
# 흐름:
# Helm values
#   → ConfigMap
#   → Pod에 server.properties.tpl로 마운트
#   → 기동 스크립트가 Pod별 값을 치환
#   → server.properties 생성
#   → Kafka 실행
#
# Pod마다 달라지는 값:
# - node.id
# - process.roles
# - advertised.listeners의 IP
#
# 위 값은 __PLACEHOLDER__로 두고 기동 시 채운다.
# 나머지 공통 설정은 Helm values에서 렌더링한다.
#
# 설정 변경은 updateStrategy=OnDelete이므로
# Helm upgrade 후 Pod를 재생성해야 반영된다.
# =====================================================

apiVersion: v1
kind: ConfigMap

metadata:
  name: {{ .Values.global.kafka.name }}-config
  namespace: {{ .Values.global.namespace }}

  labels:
    app: kafka
    app.kubernetes.io/name: kafka
    app.kubernetes.io/part-of: data-layer

data:
  # Pod에 /opt/kafka/config/server.properties.tpl로 마운트된다.
  server.properties.tpl: |

    # -------------------------------------------------
    # KRaft
    # -------------------------------------------------
    # 앞쪽 controllers개 Pod는 controller + broker로 사용하고,
    # 나머지 Pod는 broker로 사용한다.
    process.roles=__ROLES__

    # StatefulSet ordinal 기반으로 기동 시 설정한다.
    node.id=__NODE_ID__

    # 모든 브로커가 동일한 정적 KRaft 쿼럼을 사용한다.
    # 노드 IP 변경 시 전체 브로커 재기동이 필요하다.
    controller.quorum.voters={{ include "datalayer.kafkaQuorumVoters" . }}


    # -------------------------------------------------
    # Network
    # -------------------------------------------------
    # CLIENT     : 클라이언트 연결
    # INTERNAL   : 브로커 간 통신
    # CONTROLLER : KRaft 컨트롤러 통신
    #
    # hostNetwork 사용으로 노드 IP와 포트를 직접 사용한다.
    listeners=__LISTENERS__

    advertised.listeners=CLIENT://__HOST_IP__:{{ .Values.global.kafka.ports.client }},INTERNAL://__HOST_IP__:{{ .Values.global.kafka.ports.interBroker }}

    inter.broker.listener.name=INTERNAL
    controller.listener.names=CONTROLLER

    # 현재 내부망 환경이므로 모든 리스너를 PLAINTEXT로 사용한다.
    listener.security.protocol.map=CLIENT:PLAINTEXT,INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT


    # -------------------------------------------------
    # Storage
    # -------------------------------------------------
    # Kafka 로그와 KRaft 메타데이터를 서로 다른 경로에 저장한다.
    # 경로는 Node Local PV를 사용한다.
    log.dirs={{ .Values.global.kafka.data.path }}
    metadata.log.dir={{ .Values.global.kafka.metadata.path }}


    # -------------------------------------------------
    # Replication / Partition
    # -------------------------------------------------
    default.replication.factor={{ .Values.global.kafka.replicationFactor }}
    offsets.topic.replication.factor={{ .Values.global.kafka.replicationFactor }}
    transaction.state.log.replication.factor={{ .Values.global.kafka.replicationFactor }}

    # 메시지 쓰기를 허용하기 위한 최소 ISR 수
    min.insync.replicas={{ .Values.global.kafka.minInsyncReplicas }}
    transaction.state.log.min.isr={{ .Values.global.kafka.minInsyncReplicas }}

    # 신규 토픽의 기본 파티션 수
    num.partitions={{ .Values.global.kafka.numPartitions }}


    # -------------------------------------------------
    # Message Timestamp
    # -------------------------------------------------
    # 브로커에 메시지가 저장되는 시각을 timestamp로 사용한다.
    log.message.timestamp.type=LogAppendTime