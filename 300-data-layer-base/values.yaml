# ===============================================
# data-layer-base values
#
# - 로컬 환경에서 helm template 단독 렌더 가능
# - ArgoCD app-of-apps 배포 시 global.* 덮어쓰기 가능
# - 필수 값/형식은 values.schema.json으로 검증
# ===============================================

global:
  # Kubernetes Namespace
  namespace: "data-layer"

  # Kafka
  kafkaBootstrap: "192.168.56.200:9092,192.168.56.201:9092,192.168.56.202:9092"

  # External Data Stores (MinIO·Neo4j 는 노드 로컬 설치 — 노드 주소)
  minioEndpoint: "http://192.168.56.200:9000"
  neo4jBoltUri: "bolt://192.168.56.200:7687"

  # PostgreSQL 은 303-postgres 의 CNPG 클러스터로 복귀 — 노드 IP 가 아니라 Service DNS.
  # -rw 는 failover 후에도 항상 현재 primary 를 가리킨다(전환 주체가 오퍼레이터).
  # [주의] 303-postgres 의 clusterName 이 이름의 원본이고, 304-airflow 의 postgres_host 와
  #    같은 값이어야 한다 — 바꾸면 같은 커밋에서 함께 고친다.
  postgresHost: "data-layer-postgres-rw.data-layer.svc.cluster.local"

# PostgreSQL Port
postgresPort: 5432

# Other Stack References
schemaRegistryPort: 9096 # 301-kafka-tools
kafkaConnectPort: 8083   # 306-cdc

kafkaUiHost: "data-layer-kafka-ui" # 301-kafka-tools
airflowHost: "data-layer-airflow"  # 304-airflow
grafanaHost: "data-layer-grafana"  # 302-monitoring

# Database / Application
collectorDbName: "data_layer"
collectorDbSchema: "data_pipeline"
icebergCatalogDbName: "iceberg_catalog"
graphLabelPrefix: "Test"


# ===============================================
# Secrets
#
# 개발/로컬 환경용 평문 설정
# 운영 환경에서는 Secret 관리 도구 사용
# ===============================================

secrets:
  # MinIO
  minioRootUser: "data_layer"
  minioRootPassword: "data_layer123!"

  # PostgreSQL
  # [주의] 303-postgres 의 secrets.appUser/appPassword 와 같은 값이어야 한다
  #    (CNPG 가 role 을 만들 때 쓰는 값과 소비자가 접속에 쓰는 값) — 같은 커밋 규칙.
  postgresUser: "data_layer"
  postgresPassword: "data_layer123!"

  # Airflow collect_job 암호화 키
  collectorCryptoKey: "u4_J9Xv9V0XmC_Y7B3V-J1oW7vL6wK2z8x3c4v5b6n7="

  # data-layer-api 인증 키
  dataLayerApiKey: "b8f79dd470abff9e6b2c2de6b57f1f46081352f03aff4ce3bd1eb359cdbd1abf"

  # Neo4j
  platformNeo4jUser: "neo4j"
  platformNeo4jPassword: "datalayer-neo4j"

  # Grafana
  grafanaAdminUser: "admin"
  grafanaAdminPassword: "admin"