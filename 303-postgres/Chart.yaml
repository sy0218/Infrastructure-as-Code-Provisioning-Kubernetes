# ===================================================
# [303-postgres]
#   - Helm Chart 스택
#   - 플랫폼 메타 DB → CloudNativePG Cluster 1개 (인스턴스 2: primary 1 + replica 1)
#     → airflow 메타 / collector(data_layer) / iceberg 카탈로그 DB 를 담는다
#
#   - CRD(Cluster/Database)와 오퍼레이터는 103-cnpg 가 설치한다
#     → 103 apply 후에 install 할 것.
#   - 네임스페이스는 300-data-layer-base 소유 → 300 다음.
#   - ArgoCD 적용 시 Sync Wave 1 → 300 다음, 304 이전 배포.
# ===================================================
apiVersion: v2
name: postgres
description: "플랫폼 PostgreSQL → CNPG Cluster data-layer-postgres(2 인스턴스) / 앱 사용자 Secret / Database CR / 메트릭·외부 Service"
type: application
# 원본 규칙 승계: 버전은 정확 고정, 업그레이드는 숫자를 고치는 커밋으로만.
version: 0.1.0
