# ===============================================
# [PostgreSQL LoadBalancer Service]
#
# 외부의 DBeaver / psql에서 PostgreSQL에 접속하기 위한 Service.
# MetalLB가 VIP를 할당하여 <VIP>:5432로 접근할 수 있다.
#
# selector는 현재 Primary Pod만 선택한다.
# CNPG가 Failover 시 Primary 라벨을 변경하므로
# Service도 자동으로 새 Primary를 바라본다.
# ===============================================

apiVersion: v1
kind: Service

metadata:
  name: {{ .Values.global.postgres.clusterName }}-external
  namespace: {{ .Values.global.namespace }}
  labels:
    app: postgres-external
    app.kubernetes.io/name: postgres-external
    app.kubernetes.io/part-of: data-layer

  annotations:
    # MetalLB에서 사용할 고정 VIP
    metallb.io/loadBalancerIPs: {{ .Values.externalIp | quote }}

spec:
  # MetalLB를 통해 외부 IP 할당
  type: LoadBalancer

  # 현재 Primary PostgreSQL Pod만 연결
  # Failover 시 CNPG가 라벨을 변경하여 새 Primary로 전환
  selector:
    cnpg.io/cluster: {{ .Values.global.postgres.clusterName }}
    cnpg.io/instanceRole: primary

  ports:
    - name: postgres
      port: {{ .Values.global.postgres.port }}

      # CNPG PostgreSQL Pod의 포트
      targetPort: postgresql