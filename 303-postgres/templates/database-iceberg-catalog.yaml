# ===============================================
# [Iceberg Catalog DB → Database CR]
#
# CNPG가 Iceberg Catalog용 빈 DB를 생성한다.
# 테이블/스키마는 PyIceberg SqlCatalog가 최초 접속 시 자동 생성한다.
# ===============================================

apiVersion: postgresql.cnpg.io/v1
kind: Database

metadata:
  name: {{ .Values.global.postgres.clusterName }}-iceberg-catalog
  namespace: {{ .Values.global.namespace }}
  labels:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/part-of: data-layer

spec:
  # DB를 생성할 CNPG Cluster
  cluster:
    name: {{ .Values.global.postgres.clusterName }}

  # 생성할 Database
  name: {{ .Values.global.postgres.databases.icebergCatalog }}

  # Database 소유자
  owner: {{ .Values.global.secrets.postgresUser }}