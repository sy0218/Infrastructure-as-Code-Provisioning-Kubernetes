# ===============================================
# [Airflow DB → Database CR]
#
# CNPG가 Airflow용 빈 DB를 생성한다.
# DB 스키마/테이블은 Airflow init Job의 `airflow db migrate`가 관리한다.
# ===============================================
apiVersion: postgresql.cnpg.io/v1
kind: Database
metadata:
  name: {{ .Values.global.postgres.clusterName }}-airflow
  namespace: {{ .Values.global.namespace }}
  labels:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/part-of: data-layer
spec:
  # DB를 생성할 CNPG Cluster
  cluster:
    name: {{ .Values.global.postgres.clusterName }}
  
  # 생성할 Database
  name: {{ .Values.global.postgres.databases.airflow }}

  # Database 소유자
  owner: {{ .Values.global.secrets.postgresUser }}
