# ===============================================
# [앱 사용자 Secret]
#
# CNPG 가 role 생성·비밀번호 관리에 쓰는 입력 — username/password 키를 가진
# kubernetes.io/basic-auth 타입이어야 한다(공용 data-layer-secrets 는 Opaque 라 못 쓴다).
# 개발/로컬 환경이라 values.yaml 평문 → 운영 환경에서는 SealedSecrets/SOPS 등으로
# 관리한다(300-data-layer-base 의 Secret 과 같은 전제).
#
# [주의] 값은 300-data-layer-base 의 secrets.postgresUser/postgresPassword 와
# 같아야 한다(소비자는 공용 Secret 의 COLLECTOR_DB_* 로 접속) — 같은 커밋 규칙.
# ===============================================
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.clusterName }}-app-user
  namespace: {{ .Values.global.namespace }}
  labels:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/part-of: data-layer
    # 비밀번호를 바꾸면 오퍼레이터가 즉시 role 에 반영한다(재기동 불필요)
    cnpg.io/reload: "true"
type: kubernetes.io/basic-auth
stringData:
  username: {{ .Values.secrets.appUser | quote }}
  password: {{ .Values.secrets.appPassword | quote }}
