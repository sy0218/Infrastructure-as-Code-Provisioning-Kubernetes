# ===============================================
# [PostgreSQL → CNPG Cluster]
#
# CNPG Operator가 이 Cluster 커스텀 리소스를 기준으로
# Pod / PVC / Service / 복제 / Failover 등을 자동 관리한다.
#
# [주의]
# Pod는 CNPG Operator가 관리하므로
# enableServiceLinks, probe 등 일부 공통 Pod 규약은 CNPG 기본 동작을 따른다.
# ===============================================

apiVersion: postgresql.cnpg.io/v1
kind: Cluster # 쿠버네티스 Cluster 커스텀 리소스 생성
metadata:
  name: {{ .Values.global.postgres.clusterName }}
  namespace: {{ .Values.global.namespace }}
  labels:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/part-of: data-layer

spec:
  # PostgreSQL 인스턴스 수
  instances: {{ .Values.instances }}

  # PostgreSQL + TimescaleDB 커스텀 이미지
  #   PG 버전을 읽으므로 "16.15-..." 처럼 버전으로 시작해야 한다(v0.1.0 은 invalid version tag).
  imageName: {{ .Values.global.harborRegistry }}/data-layer/postgres:{{ .Values.imageTag }}
  imagePullPolicy: IfNotPresent

  # 마이너 업그레이드 시 CNPG가 자동으로 Primary를 Switchover
  primaryUpdateStrategy: unsupervised

  # CNPG가 생성하는 하위 리소스에 공통 적용할 라벨
  inheritedMetadata:
    labels:
      app.kubernetes.io/part-of: data-layer

  bootstrap:
    initdb:
      # 최초 클러스터 생성 시 생성할 기본 DB / Owner
      database: {{ .Values.global.postgres.databases.collector }}
      owner: {{ .Values.global.secrets.postgresUser }}
      secret:
        # 앱 계정 비밀번호 Secret
        name: {{ .Values.global.postgres.clusterName }}-app-user

      # 최초 initdb 시 1회 실행되는 초기화 SQL
      # 각 항목은 개별 SQL 문으로 실행되며 실패하면 bootstrap 실패
      postInitApplicationSQL:

        # TimescaleDB Extension
        - CREATE EXTENSION IF NOT EXISTS timescaledb

        # 애플리케이션 Schema
        - CREATE SCHEMA IF NOT EXISTS {{ .Values.global.postgres.schema }} AUTHORIZATION {{ .Values.global.secrets.postgresUser }}

        # 배치 수집 Job
        - >-
          CREATE TABLE IF NOT EXISTS {{ .Values.global.postgres.schema }}.collect_job (
            job_id          bigserial PRIMARY KEY,
            job_name        text        NOT NULL,
            collector_type  text        NOT NULL,
            processor_name  text        NOT NULL,
            topic           text        NOT NULL,
            config          jsonb       NOT NULL,
            enabled         boolean     NOT NULL DEFAULT true,
            run_hours       integer[]   NOT NULL)

        - ALTER TABLE {{ .Values.global.postgres.schema }}.collect_job OWNER TO {{ .Values.global.secrets.postgresUser }}

        # 실시간 수집 Source
        - >-
          CREATE TABLE IF NOT EXISTS {{ .Values.global.postgres.schema }}.realtime_source (
            source_id   bigserial PRIMARY KEY,
            source_name text        NOT NULL UNIQUE,
            source_type text        NOT NULL,
            topic       text        NOT NULL,
            config      jsonb       NOT NULL,
            enabled     boolean     NOT NULL DEFAULT true)

        - ALTER TABLE {{ .Values.global.postgres.schema }}.realtime_source OWNER TO {{ .Values.global.secrets.postgresUser }}

        # 데이터 계보(Lineage)
        - >-
          CREATE TABLE IF NOT EXISTS {{ .Values.global.postgres.schema }}.data_lineage (
            entity_key   text         NOT NULL,
            ingest_ts    timestamptz  NOT NULL,
            event_ts     timestamptz  NOT NULL,
            source_type  text         NOT NULL,
            source_detail text        NOT NULL,
            target_type  text         NOT NULL,
            target_detail text        NOT NULL,
            last_event_ts timestamptz,
            process_count int         NOT NULL DEFAULT 1,
            PRIMARY KEY (entity_key, ingest_ts, source_detail, target_detail))

        - ALTER TABLE {{ .Values.global.postgres.schema }}.data_lineage OWNER TO {{ .Values.global.secrets.postgresUser }}

        # ingest_ts 기준 TimescaleDB Hypertable
        - >-
          SELECT create_hypertable(
            '{{ .Values.global.postgres.schema }}.data_lineage',
            'ingest_ts',
            chunk_time_interval => INTERVAL '1 day',
            if_not_exists => TRUE)

  managed:
    roles:
      # 앱 계정은 CNPG가 지속적으로 관리한다.
      # Superuser 권한은 부여하지 않고 DB Owner 역할만 수행한다.
      - name: {{ .Values.global.secrets.postgresUser }}
        ensure: present
        login: true
        superuser: false
        createdb: false
        passwordSecret:
          name: {{ .Values.global.postgres.clusterName }}-app-user

  postgresql:
    # CNPG 전용 설정: PostgreSQL 기동 시 preload
    shared_preload_libraries:
      - timescaledb

    parameters:
      # 애플리케이션 연결 수
      max_connections: "200"

      # 서버 / 로그 타임존
      timezone: "Asia/Seoul"
      log_timezone: "Asia/Seoul"

  storage:
    # DB 데이터 저장소
    storageClass: {{ .Values.storage.storageClass }}
    size: {{ .Values.storage.size }}

  # CPU / Memory Request만 지정하고 Limit은 사용하지 않는다.
    requests:
      cpu: 250m
      memory: 320Mi

  affinity:
    # 인스턴스가 서로 다른 Node에 배치되도록 강제한다.
    podAntiAffinityType: required
    topologyKey: kubernetes.io/hostname

    # 인스턴스를 띄울 노드 후보
    {{- with .Values.nodeNames }}
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
          - matchExpressions:
              - key: kubernetes.io/hostname
                operator: In
                values:
                  {{- toYaml . | nindent 18 }}
    {{- end }}