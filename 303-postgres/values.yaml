# ===============================================
# [303-postgres 전용 설정]
# → 공통값(global.*)은 values.common.yaml에서 관리
# ===============================================

# PostgreSQL 인스턴스 2개 → Primary 1개 + Replica 1개
instances: 2

# 인스턴스를 배치할 노드 이름 (nodeAffinity 로 지정)
nodeNames: ["s1", "s2"]


# ===============================================
# [operand 이미지 태그]
#   - 공용 global.imageTag 를 쓰지 않는 유일한 값이다.
#   - CNPG 웹훅이 태그에서 PG 메이저를 읽어 업그레이드를 판단하므로 태그가 PG 버전으로
#     시작해야 한다. v0.1.0 은 "invalid version tag" 로 거부되고 latest 도 금지다.
#   - 앞자리는 이미지의 실제 PG 버전(data_layer_postgres/Dockerfile 의 FROM), 뒷자리는
#     저장소 태그 규칙 — build_and_push.sh 에 준 태그와 글자 그대로 같아야 한다.
# ===============================================
imageTag: "16.15-v0.1.1"

# ===============================================
# [Storage]
#   - 각 PostgreSQL 인스턴스가 사용할 저장공간
#   - local-path 인 이유: 복제를 CNPG 가 앱 레벨(스트리밍 리플리케이션)에서 하므로
# ===============================================
storage:
  storageClass: "local-path" # 사용할 StorageClass
  size: "40Gi"               # 인스턴스당 저장공간


# 외부 접속용 MetalLB VIP
# → <VIP>:5432로 PostgreSQL 접속
externalIp: "192.168.56.241"
