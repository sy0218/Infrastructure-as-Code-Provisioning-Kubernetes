# ===============================================
# [PostgreSQL Values]
#
# - 303-postgres Helm Chart의 설정값
# - PostgreSQL Cluster 이름, 개수, 저장공간,
#   외부 접속 IP, DB 이름, 계정 등을 여기서 설정한다.
# ===============================================

global:
  # Kubernetes Namespace
  namespace: "data-layer"

  # PostgreSQL 이미지를 가져올 Harbor 주소
  harborRegistry: "data-layer-harbor:80"

  # 사용할 PostgreSQL 이미지 태그
  imageTag: "v0.1.0"


# ===============================================
# [PostgreSQL Cluster]
#   - CNPG Operator가 이 값을 보고 PostgreSQL Cluster를 생성한다.
#   - clusterName이 Service, Pod, PVC 등의 이름 기준이 된다.
# ===============================================

# PostgreSQL Cluster 이름
clusterName: "data-layer-postgres"

# PostgreSQL 인스턴스 2개 → Primary 1개 + Replica1개
instances: 2


# ===============================================
# [Storage]
#   - 각 PostgreSQL 인스턴스가 사용할 저장공간
#   - CNPG가 DB 복제를 관리하므로 local-path를 사용한다.
# ===============================================

storage:
  # local-path 인 이유: 복제를 CNPG 가 앱 레벨(스트리밍 리플리케이션)에서 하므로
  storageClass: "local-path"
  size: "40Gi"

# 외부 접속용 MetalLB VIP → DBeaver 등 클러스터 밖 도구가 <이 IP>:5432 로 붙는다.
# [주의] 102-ingress terraform.tfvars 의 postgres_vip 와 같은 값
externalIp: "192.168.56.241"



# ===============================================
# [Database]
#   - PostgreSQL Cluster 안에 생성할 데이터베이스
# ===============================================
databases:
  collector: "data_layer"           # 앱 DB → collect_job/realtime_source/lineage
  airflow: "airflow"                # Airflow 메타스토어 (스키마는 airflow db migrate 가 만든다)
  icebergCatalog: "iceberg_catalog" # pyiceberg SqlCatalog (테이블은 pyiceberg 가 만든다)

# collector DB에서 사용할 스키마 이름
collectorDbSchema: "data_pipeline"


# ===============================================
# [Application 계정]
#   - 애플리케이션이 PostgreSQL에 접속할 때 사용하는 계정
#   - 3개 DB에서 사용한다.
#   - 개발/로컬 환경용 설정이며 운영에서는 Secret 관리 도구를 사용한다.
# ===============================================
secrets:
  appUser: "data_layer"
  appPassword: "data_layer123!"
