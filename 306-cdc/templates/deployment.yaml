# ===============================================
# [Kafka Connect Deployment]
#   - Kafka 내부 Topic에 상태를 저장하므로 Deployment로 구성
#   - Worker별 Pod IP를 광고하여 Worker 간 REST 통신 보장
#   - 플러그인 초기화 시간이 길어 startupProbe로 기동을 대기
# ===============================================
apiVersion: apps/v1
kind: Deployment

metadata:
  name: cdc-connect
  namespace: {{ .Values.global.namespace }}
  labels:
    app: cdc-connect
    app.kubernetes.io/name: cdc-connect
    app.kubernetes.io/part-of: data-layer

spec:
  replicas: {{ .Values.replicas }}

  selector:
    matchLabels:
      app: cdc-connect

  template:
    metadata:
      labels:
        app: cdc-connect
        app.kubernetes.io/name: cdc-connect
        app.kubernetes.io/part-of: data-layer

    spec:
      # Kubernetes Service 환경변수 자동 주입 비활성화
      enableServiceLinks: false

      # 종료 전 Task가 다른 Worker로 이동할 시간 확보
      terminationGracePeriodSeconds: 90

      # Worker를 서로 다른 노드에 배치
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - topologyKey: kubernetes.io/hostname
              labelSelector:
                matchLabels:
                  app: cdc-connect

      containers:
        - name: cdc-connect
          image: {{ .Values.global.harborRegistry }}/data-layer/kafka-connect:{{ .Values.global.imageTag }}
          imagePullPolicy: IfNotPresent

          ports:
            - name: rest
              containerPort: {{ .Values.global.kafka.connectPort }}

          # 공통 환경변수 + Secret 주입
          envFrom:
            - configMapRef:
                name: data-layer-env
            - secretRef:
                name: data-layer-secrets

          env:
            # Worker 간 REST 통신을 위해 자신의 Pod IP를 광고
            - name: HOST_NAME
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP

            - name: CONNECT_REST_ADVERTISED_HOST_NAME
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP

            # Kafka Broker 주소
            - name: BOOTSTRAP_SERVERS
              valueFrom:
                configMapKeyRef:
                  name: data-layer-env
                  key: KAFKA_BOOTSTRAP

            # Connect 클러스터 식별자
            - name: GROUP_ID
              value: {{ .Values.groupId | quote }}

            # Connect 내부 상태 Topic
            - name: CONFIG_STORAGE_TOPIC
              value: {{ .Values.storageTopics.config | quote }}

            - name: OFFSET_STORAGE_TOPIC
              value: {{ .Values.storageTopics.offset | quote }}

            - name: STATUS_STORAGE_TOPIC
              value: {{ .Values.storageTopics.status | quote }}

            # 내부 Topic 복제 계수
            - name: CONNECT_CONFIG_STORAGE_REPLICATION_FACTOR
              value: {{ .Values.replicationFactor | quote }}

            - name: CONNECT_OFFSET_STORAGE_REPLICATION_FACTOR
              value: {{ .Values.replicationFactor | quote }}

            - name: CONNECT_STATUS_STORAGE_REPLICATION_FACTOR
              value: {{ .Values.replicationFactor | quote }}

            # Connect REST API
            - name: CONNECT_LISTENERS
              value: "http://:{{ .Values.global.kafka.connectPort }}"

            - name: ADVERTISED_PORT
              value: {{ .Values.global.kafka.connectPort | quote }}

            # JVM Heap
            - name: HEAP_OPTS
              value: {{ .Values.heapOpts | quote }}

          # 플러그인 초기화가 끝날 때까지 기동 실패로 판단하지 않음
          startupProbe:
            httpGet:
              path: /
              port: rest
            periodSeconds: 10
            failureThreshold: 30

          # 정상적으로 API를 제공하는 Worker만 트래픽 수신
          readinessProbe:
            httpGet:
              path: /connectors
              port: rest
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 6

          # Worker 프로세스 생존 여부 확인
          livenessProbe:
            httpGet:
              path: /
              port: rest
            initialDelaySeconds: 90
            periodSeconds: 60
            failureThreshold: 6

          # 현재 노드 자원 여유에 따라 임시 미설정
          # - BestEffort QoS → 메모리 압박 시 우선 Eviction 대상
          # - 자원 여유 확보 후 requests 설정
          # resources:
          #   requests:
          #     cpu: "250m"
          #     memory: "1Gi"