# ===============================================
# [Kafka Connect Deployment]
#
# - 상태(설정·오프셋·상태)는 Kafka 내부 토픽 → StatefulSet 이 아니라 Deployment
# - 워커마다 자기 podIP 를 광고 → 비리더가 등록 요청을 리더에게 포워딩한다
# - 플러그인 스캔에 수 분 걸린다 → startupProbe 로 liveness 예산을 지킨다
# ===============================================
apiVersion: apps/v1
kind: Deployment

metadata:
  name: cdc-connect
  namespace: {{ .Values.global.namespace }}
  labels:
    app: cdc-connect
    app.kubernetes.io/name: cdc-connect
    app.kubernetes.io/part-of: data-layer

spec:
  replicas: {{ .Values.replicas }}

  selector:
    matchLabels:
      app: cdc-connect

  template:
    metadata:
      labels:
        app: cdc-connect
        app.kubernetes.io/name: cdc-connect
        app.kubernetes.io/part-of: data-layer

    spec:
      # Kubernetes Service 환경변수 자동 주입 비활성화
      enableServiceLinks: false

      # 리밸런스로 태스크를 넘겨줄 시간 (기본 30초면 진행 중 배치가 잘린다)
      terminationGracePeriodSeconds: 90

      # 워커를 노드에 흩는다. ⚠ required 로 바꾸지 말 것 — 노드 1대가 죽으면 파드가 영구 Pending
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    app: cdc-connect

      containers:
        - name: cdc-connect
          image: {{ .Values.global.harborRegistry }}/data-layer/kafka-connect:{{ .Values.global.imageTag }}
          imagePullPolicy: IfNotPresent

          ports:
            - name: rest
              containerPort: {{ .Values.global.kafka.connectPort }}

          # Debezium entrypoint 는 정해진 이름과 CONNECT_ 접두 변수만 워커 프로퍼티로 번역한다
          # → 나머지 공용 키는 있어도 무해
          envFrom:
            - configMapRef:
                name: data-layer-env
            - secretRef:
                name: data-layer-secrets

          env:
            # ⚠ 리더 포워딩의 핵심 → 고정 문자열이면 세 워커가 같은 주소를 광고해 등록이 조용히 실패한다.
            #   entrypoint 가 HOST_NAME 에서 CONNECT_ 쪽을 파생시켜 덮어쓰므로 둘 다 podIP 로 맞춘다.
            - name: HOST_NAME
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            - name: CONNECT_REST_ADVERTISED_HOST_NAME
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP

            # 브로커 주소의 출처는 300 의 공용 ConfigMap 하나 → 브로커 표가 바뀌면 300 upgrade 후 rollout restart
            - name: BOOTSTRAP_SERVERS
              valueFrom:
                configMapKeyRef:
                  name: data-layer-env
                  key: KAFKA_BOOTSTRAP

            - name: GROUP_ID
              value: {{ .Values.groupId | quote }}
            - name: CONFIG_STORAGE_TOPIC
              value: {{ .Values.storageTopics.config | quote }}
            - name: OFFSET_STORAGE_TOPIC
              value: {{ .Values.storageTopics.offset | quote }}
            - name: STATUS_STORAGE_TOPIC
              value: {{ .Values.storageTopics.status | quote }}
            - name: CONNECT_CONFIG_STORAGE_REPLICATION_FACTOR
              value: {{ .Values.replicationFactor | quote }}
            - name: CONNECT_OFFSET_STORAGE_REPLICATION_FACTOR
              value: {{ .Values.replicationFactor | quote }}
            - name: CONNECT_STATUS_STORAGE_REPLICATION_FACTOR
              value: {{ .Values.replicationFactor | quote }}

            - name: CONNECT_LISTENERS
              value: "http://:{{ .Values.global.kafka.connectPort }}"
            # 광고 포트는 listeners 에서 따라오지 않는다 (없으면 entrypoint 가 8083 하드코딩)
            - name: ADVERTISED_PORT
              value: {{ .Values.global.kafka.connectPort | quote }}

            # entrypoint 가 HEAP_OPTS → KAFKA_HEAP_OPTS 로 옮겨 준다
            - name: HEAP_OPTS
              value: {{ .Values.heapOpts | quote }}

          # 플러그인 스캔(실측 150초)이 끝나야 REST 포트가 열린다 → 10초 × 30 = 300초
          startupProbe:
            httpGet:
              path: /
              port: rest
            periodSeconds: 10
            failureThreshold: 30

          # /connectors 는 그룹 합류 전에는 응답하지 않는다 → 리밸런스 중 워커로 트래픽이 가지 않는다
          readinessProbe:
            httpGet:
              path: /connectors
              port: rest
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 6

          # ⚠ 일부러 "/" 다. /connectors 로 두면 브로커가 흔들릴 때 멀쩡한 워커를 죽여 리밸런스를 키운다
          livenessProbe:
            httpGet:
              path: /
              port: rest
            initialDelaySeconds: 90
            periodSeconds: 20
            failureThreshold: 6

          # requests 는 당분간 주석 처리 — 노드 여유가 없다 (304-airflow 와 같은 임시 조치)
          # 대가: BestEffort QoS → 메모리 압박 시 먼저 evict. 여유가 생기면 주석을 푼다.
          # resources:
          #   requests:
          #     cpu: "250m"
          #     memory: "1Gi"
