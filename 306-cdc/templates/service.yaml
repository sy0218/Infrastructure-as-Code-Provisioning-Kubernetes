# ===============================================
# [Kafka Connect Service]
#
# - 커넥터 등록·조회 REST 창구 → 아무 워커나 받으면 된다 (비리더는 리더에게 포워딩)
# - 이름 cdc-connect + global.kafka.connectPort = 300 의 KAFKA_CONNECT_URL (계약)
# ===============================================
apiVersion: v1
kind: Service

metadata:
  name: cdc-connect
  namespace: {{ .Values.global.namespace }}
  labels:
    app: cdc-connect
    app.kubernetes.io/name: cdc-connect
    app.kubernetes.io/part-of: data-layer

spec:
  type: ClusterIP

  selector:
    app: cdc-connect

  ports:
    - name: rest
      port: {{ .Values.global.kafka.connectPort }}
      targetPort: rest
