# ===============================================
# [Kafka Connect Service]
#   - Kafka Connect REST API의 내부 진입점
#   - ClusterIP로 Worker Pod에 요청 전달
#   - Service 이름 + 포트는 300-data-layer의 KAFKA_CONNECT_URL과 동일
# ===============================================

apiVersion: v1
kind: Service

metadata:
  name: cdc-connect
  namespace: {{ .Values.global.namespace }}
  labels:
    app: cdc-connect
    app.kubernetes.io/name: cdc-connect
    app.kubernetes.io/part-of: data-layer

spec:
  type: ClusterIP

  selector:
    app: cdc-connect

  ports:
    - name: rest
      port: {{ .Values.global.kafka.connectPort }}
      targetPort: rest