# ===================================================
# [306-cdc]
#   - Kafka Connect(Debezium)
#     → RDB 변경사항(CDC)을 raw.* Kafka Topic으로 전달
#
# 설계
# - Deployment + ClusterIP로 구성
# - 상태는 Kafka 내부 Topic 3종에 저장 → Worker에 로컬 상태 없음
# - Worker 장애 시 커밋된 Offset부터 다른 Worker가 이어서 처리
# - Connector는 배포 후 REST API로 등록/관리
#
# 의존성
# - 300-data-layer-base → 공용 ConfigMap/Secret
# - 301-kafka → Kafka Broker
# - Service: cdc-connect
# - REST Port: global.kafka.connectPort
# ===================================================
apiVersion: v2
name: cdc
description: "Kafka Connect(Debezium) → CDC 워커 (Deployment + ClusterIP)"
type: application

# Chart 버전 (업그레이드 시 명시적으로 변경)
version: 0.1.0
