# ===============================================
# [306-cdc 전용 설정]
# - 공통값(global.*)은 values.common.yaml에서 관리
# - REST 포트는 global.kafka.connectPort 사용
# ===============================================

# Connect Worker 수
# - 같은 groupId의 Worker끼리 커넥터/태스크를 분산 처리
replicas: 2

# Connect 클러스터 식별자
# - 같은 groupId의 Worker가 하나의 클러스터로 동작
# - Service 이름과 동일하게 유지
groupId: "cdc-connect"

# Connect 내부 상태 저장 토픽
# - Connector 설정 / Offset / 상태를 저장
# - 기존 운영 중에는 이름 변경 금지
storageTopics:
  config: "connect-configs"
  offset: "connect-offsets"
  status: "connect-status"

# 내부 토픽 복제 계수
# - Kafka Broker 3대 기준 최대 3
replicationFactor: 3

# JVM Heap
# - Worker당 512MB ~ 1280MB
heapOpts: "-Xms512m -Xmx1280m"